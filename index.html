/* ---------------------------- Konva : scène ------------------------------ */
// Finesse du canevas à l'ÉCRAN plafonnée à ×2 (v2.1-62). Sur un téléphone à écran très fin
// (×3), chaque couche faisait ~8 millions de pixels ; à ×2 c'est ~2,25 fois moins à effacer
// et redessiner à chaque image, pour une différence quasi invisible. Sans effet sur l'EXPORT,
// qui fixe son propre pixelRatio (voir captureAllPagesAsImages) : qualité inchangée.
Konva.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
const stage = new Konva.Stage({ container: 'konvaContainer', width: SHEET_W, height: SHEET_H });
// (v2.1-62) Plus de couche "fond blanc" à l'écran : le fond blanc est déjà fourni par le CSS
// (#konvaContainer), et une couche entière de plus coûtait de la mémoire et du temps de
// composition. Le fond blanc est ajouté uniquement dans l'image EXPORTÉE (voir exportStageDataURL).
const planLayer = new Konva.Layer();
const contentLayer = new Konva.Layer();
// Couche dédiée au quadrillage : placée AU-DESSUS du plan et des pastilles (et non plus
// dans staticLayer, en-dessous de tout, où elle restait invisible sous le plan importé).
// Elle sert uniquement de repère visuel / point d'ancrage pour le placement déporté des
// pastilles numérotées ; elle n'intercepte jamais les clics (listening:false).
const gridLayer = new Konva.Layer({ listening:false });
const uiLayer = new Konva.Layer(); // transformer + aperçu fantôme (regroupés pour limiter le nb de layers)
// Couche DÉDIÉE au curseur de placement déporté (v2.1-89), en résolution 1 : la redessiner à chaque
// image du doigt ne coûte plus un canvas de feuille entière à la densité de l'écran.
const cursorLayer = new Konva.Layer({ visible:false });
stage.add(planLayer); stage.add(contentLayer); stage.add(gridLayer); stage.add(uiLayer); stage.add(cursorLayer);
cursorLayer.getCanvas().setPixelRatio(1);
// v2.1-104 : À CHAQUE événement tactile, Konva cherche l'élément sous le doigt (getIntersection) en LISANT un pixel
// de chaque couche (getImageData) — une lecture GPU lente sur smartphone, répétée à chaque mouvement du doigt.
// Comme sur un écran tactile natif, l'élément visé est celui du CONTACT INITIAL : on garde donc ce résultat pendant
// les mouvements du même geste (touchmove) et on ne le recalcule qu'au contact et au relâchement (là où la cible
// compte : tap, début de glissement). Souris et relâchement inchangés.
(function(){
  const origGI = stage.getIntersection.bind(stage);
  let moving = false, cached = undefined, awaitingStart = false;
  const content = stage.content;
  content.addEventListener('touchstart', ()=>{ moving = false; cached = undefined; awaitingStart = true; }, true);
  content.addEventListener('touchmove', ()=>{ moving = true; }, true);
  ['touchend','touchcancel'].forEach(ev=>content.addEventListener(ev, ()=>{ moving = false; cached = undefined; awaitingStart = false; }, true));
  stage.getIntersection = function(pos){
    if (moving && cached !== undefined) return cached;
    const r = origGI(pos);
    if (awaitingStart){ cached = r; awaitingStart = false; } // 1er calcul après le contact = élément touché
    return r;
  };
})();
// Ordre d'empilement STRUCTUREL du contenu (v2.1-62) : lignes < pastilles < textes < logos <
// légende. Chaque catégorie a son propre groupe, ajouté une fois pour toutes dans cet ordre :
// plus besoin de rappeler moveToTop() sur chaque élément à chaque rendu (coût proportionnel au
// nombre de pastilles, répété à chaque curseur ou déplacement).
const linesLayerGroup = new Konva.Group({ listening:false });
const pastillesLayerGroup = new Konva.Group();
const textesLayerGroup = new Konva.Group();
const logosLayerGroup = new Konva.Group();
const legendLayerGroup = new Konva.Group();
// v2.1-91 : les textes en dernier = toujours au premier plan (au-dessus des logos et de la légende).
contentLayer.add(linesLayerGroup, pastillesLayerGroup, logosLayerGroup, legendLayerGroup, textesLayerGroup);
const gridGroup = new Konva.Group({ listening:false });
gridLayer.add(gridGroup);
// Quadrillage : la COUCHE entière est masquée quand la grille est cachée (et non seulement son
// contenu), pour que le navigateur n'ait plus à composer un grand canevas vide (v2.1-62).
function setGridVisible(show){
  gridGroup.visible(show);
  gridLayer.visible(show);
  if (show) gridLayer.batchDraw();
}
const ghostGroup = new Konva.Group({ listening:false });
// Groupe du curseur déporté (cercle + triangle) — au-dessus de tout, il doit rester
// tapotable (listening:true) puisque l'on doit pouvoir toucher son cercle pour valider.
const remoteCursorGroup = new Konva.Group({ listening:true });

let transformer = new Konva.Transformer({
  rotateAnchorOffset: 56, // ajusté avec la taille des poignées ci-dessous, pour garder un espacement cohérent
  enabledAnchors: ['top-left','top-right','bottom-left','bottom-right'],
  boundBoxFunc: (oldBox, newBox) => (newBox.width < 8 || newBox.height < 8) ? oldBox : newBox,
  anchorSize: 52, // doublé (+100%) pour une meilleure préhension au doigt
  anchorCornerRadius: 26,
  anchorStrokeWidth: 2,
  anchorStroke: '#0E6FA8',
  anchorFill: '#ffffff',
  borderStroke: '#0E6FA8',
  borderStrokeWidth: 1.5,
  rotateAnchorCursor: 'grab'
});
uiLayer.add(transformer);
// Poignées MINIMALISTES (v2.1-57) : chaque poignée est DESSINÉE comme un petit point, mais sa
// zone de saisie (hitFunc) garde la taille complète de 52 px — aussi facile à attraper au
// doigt qu'avant, seul l'aspect visuel prend moins de place sur le plan.
const HANDLE_DOT_RADIUS = 6;
transformer.find('._anchor').forEach(anchor=>{
  anchor.sceneFunc((ctx, shape)=>{
    ctx.beginPath();
    ctx.arc(shape.width()/2, shape.height()/2, HANDLE_DOT_RADIUS, 0, Math.PI*2);
    ctx.fillStrokeShape(shape);
  });
  anchor.hitFunc((ctx, shape)=>{
    ctx.beginPath();
    ctx.rect(0, 0, shape.width(), shape.height());
    ctx.fillStrokeShape(shape);
  });
});
uiLayer.add(ghostGroup);
cursorLayer.add(remoteCursorGroup);
transformer.on('transform', ()=>{ if (typeof updateLockIndicator === 'function') updateLockIndicator(); });

let lastGridKey = null;
function drawGrid(){
  const w = stage.width(), h = stage.height();
  const key = w+'x'+h;
  if (key === lastGridKey) return; // taille inchangée depuis le dernier appel : rien à refaire
  lastGridKey = key;
  gridGroup.destroyChildren();
  // Un seul Shape qui dessine tout le quadrillage en un seul passage, au lieu de
  // ~100 nœuds Konva individuels (beaucoup plus rapide à (re)dessiner).
  const gridShape = new Konva.Shape({
    listening:false,
    perfectDrawEnabled:false,
    sceneFunc:(ctx, shapeNode)=>{
      ctx.beginPath();
      for(let x=0;x<=w;x+=GRID_STEP){ ctx.moveTo(x,0); ctx.lineTo(x,h); }
      for(let y=0;y<=h;y+=GRID_STEP){ ctx.moveTo(0,y); ctx.lineTo(w,y); }
      ctx.strokeStyle = '#e3e7ee';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
  gridGroup.add(gridShape);
  if (gridVisible) gridLayer.batchDraw(); // couche masquée : inutile de dessiner (voir setGridVisible)
}
let gridVisible = false; // masquée par défaut ; affichée manuellement (icône grille) ou automatiquement en placement déporté
let gridAutoShown = false; // true si la grille a été affichée automatiquement par l'outil "placement déporté" (pour la remasquer en quittant l'outil)

/* ---------------------------- Rendu principal ----------------------------- */
// Pour les curseurs (taille de pastille ou de texte, luminosité…) : le navigateur peut envoyer
// plusieurs valeurs par image d'écran, et chacune relançait un rendu complet. Ici, un seul
// rendu par image, avec la dernière valeur (v2.1-64).
let renderRAF = 0;
function scheduleRender(){
  if (renderRAF) return;
  renderRAF = requestAnimationFrame(()=>{ renderRAF = 0; render(); });
}
function render(){
  ensureDefaultDeviceTypes(); // garantit que les postes "par défaut" (souris/rat) sont toujours présents
  applySheetSize();
  renderPlan();
  renderContent();
  refreshTypeList();
  refreshSelectionUI();
  // Ces deux contrôles reflètent l'état de la page COURANTE : sans cette resynchronisation,
  // changer de page pouvait laisser affiché l'état de l'ancienne page (ex. case "Utilisés"
  // restée cochée visuellement alors que cette page-ci l'a décochée).
  document.getElementById('toolToggleLegend').classList.toggle('active', model.legend.visible);
  document.getElementById('chkOnlyUsed').checked = model.legend.onlyUsed;
  updateSizePreview(); // pastille témoin : couleur/étiquette du poste choisi (v2.1-68)
}

// render() appelle cette fonction très souvent (chaque valeur de curseur, chaque fin de
// déplacement…). Réécrire les mêmes styles puis relire la mise en page (updateScrollBands lit
// scrollWidth/clientWidth) forçait à chaque fois le navigateur à recalculer toute la page :
// on mémorise donc la dernière taille/zoom appliqués et on ne refait le travail que s'ils
// ont changé (v2.1-62).
let lastSheetKey = null;
const sheetShadowHostEl = document.getElementById('sheetShadowHost');
function applySheetSize(){
  const w = model.orientation === 'portrait' ? SHEET_W : SHEET_H;
  const h = model.orientation === 'portrait' ? SHEET_H : SHEET_W;
  const key = w+'x'+h+'@'+zoom;
  if (key !== lastSheetKey){
    lastSheetKey = key;
    if (stage.width() !== w || stage.height() !== h){
      stage.width(w); stage.height(h);
      stage.container().style.width = w+'px';
      stage.container().style.height = h+'px';
    }
    sheetShadowHostEl.style.width = (w*zoom)+'px';
    sheetShadowHostEl.style.height = (h*zoom)+'px';
    stage.container().style.transform = `scale(${zoom})`;
    stage.container().style.transformOrigin = 'top left';
    drawGrid();
    if (typeof updateScrollBands === 'function') updateScrollBands();
  }
  if (gridLayer.visible() !== gridVisible) setGridVisible(gridVisible);
}

let planImageNodes = new Map(); // id de plan -> node Konva.Image correspondant
function renderPlan(){
  const seen = new Set();
  model.plans.forEach(p=>{
    seen.add(p.id);
    const natural = planNaturalCanvases.get(p.id);
    if (!natural) return; // pas encore réhydraté (chargement du dataURL en cours)
    const canvas = planDisplayCanvases.get(p.id) || natural; // copie réduite pour l'écran (voir makeDisplayCanvas)
    let node = planImageNodes.get(p.id);
    if (!node){
      node = new Konva.Image({ name:'plan-image', id:p.id, offsetX:0, offsetY:0 });
      // Les gestionnaires relisent le plan via son id à chaque appel (jamais une référence
      // capturée), pour rester corrects même après un undo/redo qui remplace l'objet model
      // entier, ou si le plan a depuis été supprimé.
      // Les icônes de rotation suivent le plan pendant son déplacement.
      node.on('dragmove', () => { if (typeof updateRotateIcons === 'function') updateRotateIcons(); });
      // AU DOIGT, le plan importé ne se déplace sur la feuille qu'avec l'outil "Déplacer le
      // plan" (v2.1-60) : sans outil, le doigt sur le plan sert à faire défiler la vue. À la
      // souris (ordinateur), le glisser du plan reste possible comme avant.
      node.on('dragstart', () => {
        if (selectedId !== p.id && Date.now() - lastTouchStartTs < 1000){
          node._cancelledTouchDrag = true;
          node.stopDrag();
        }
      });
      node.on('dragend', () => {
        if (node._cancelledTouchDrag){ node._cancelledTouchDrag = false; return; } // rien n'a bougé
        const pl = model.plans.find(x=>x.id===p.id); if (!pl) return;
        pl.x = node.x(); pl.y = node.y(); pushHistory();
      });
      node.on('transformend', () => {
        const pl = model.plans.find(x=>x.id===p.id); if (!pl) return;
        pl.x = node.x(); pl.y = node.y(); pl.rotation = node.rotation();
        pl.width = node.width()*node.scaleX();
        pl.height = node.height()*node.scaleY();
        node.scaleX(1); node.scaleY(1);
        pushHistory(); render();
      });
      node.on('click tap', () => {
        // Un plan verrouillé reste sélectionnable (juste non déplaçable, voir draggable()
        // ci-dessous) : sinon, une fois verrouillé et désélectionné, il deviendrait
        // impossible à resélectionner pour le déverrouiller — un blocage permanent.
        const pl = model.plans.find(x=>x.id===p.id);
        if (pl && activeTool===null){ selectNode(node, p.id); }
      });
      planImageNodes.set(p.id, node);
      planLayer.add(node);
    }
    node.visible(true);
    node.position({x:p.x, y:p.y});
    node.size({width:p.width, height:p.height});
    node.rotation(p.rotation||0);
    node.draggable(planCanBeDragged(p));

    const imageChanged = node.image() !== canvas;
    if (imageChanged) node.image(canvas);

    // Pendant qu'un curseur d'image (luminosité…) est tiré, le calcul des filtres se fait en
    // résolution d'aperçu (x1) : bien plus léger qu'à la finesse de l'écran à chaque cran. Au
    // relâchement (événement "change") on recalcule une dernière fois à la finesse normale ;
    // l'export, lui, recalcule toujours depuis l'image pleine définition (voir prepareStageForExport).
    const filterKey = (p.brightness||0)+'|'+(p.contrast||0)+'|'+(p.saturation||0)+'|'+(p.hue||0)+'|'+(planFilterPreview?'p':'f');
    if (imageChanged || node._forceRefresh || node._lastFilterKey !== filterKey){
      const filters = [];
      if (p.brightness) filters.push(Konva.Filters.Brighten);
      if (p.contrast) filters.push(Konva.Filters.Contrast);
      if (p.saturation || p.hue) filters.push(Konva.Filters.HSL);
      node.filters(filters);
      node.brightness((p.brightness||0)/100);
      node.contrast(p.contrast||0);
      node.saturation((p.saturation||0)/50);
      node.hue(p.hue||0);
      node.clearCache();
      if (filters.length>0) node.cache(planFilterPreview ? { pixelRatio:1 } : undefined);
      node._lastFilterKey = filterKey;
      node._forceRefresh = false;
    }
  });
  // Nettoie les nodes/canevas des plans qui ont été supprimés du modèle depuis le dernier rendu.
  for (const [id, node] of planImageNodes){
    if (!seen.has(id)){ node.destroy(); planImageNodes.delete(id); deletePlanCanvases(id); }
  }
  planLayer.batchDraw();
}
let planFilterPreview = false; // vrai tant qu'un curseur d'image (luminosité, contraste…) est en cours de glissement
// Trouve le plan (donnée) correspondant à un id, sur la page courante.
function findPlanById(id){ return model.plans.find(p=>p.id===id); }
// Trouve le node Konva du plan visible à une position donnée (coordonnées feuille), pour
// que les outils pixel (pipette, pot, gomme, découpe) sachent sur QUEL plan agir quand il y
// en a plusieurs sur la même page.
function planNodeAt(pos){
  const shape = planLayer.getIntersection(pos);
  if (shape && shape.name && shape.name()==='plan-image') return shape;
  return null;
}

function toLocal(node, absX, absY){
  const t = node.getAbsoluteTransform().copy();
  t.invert();
  return t.point({x:absX,y:absY});
}

// Nodes Konva persistants entre deux rendus (pastilles/textes/logos) : on ne les
// détruit/recrée que si leur apparence a vraiment changé (voir "sig" plus bas), sinon on
// se contente de mettre à jour position/rotation — bien moins coûteux que tout reconstruire
// à chaque rendu (c'était la principale source de lenteur, surtout avec beaucoup de pastilles
// ou pendant un glissement de curseur comme la taille/luminosité qui déclenche des rendus
// répétés).
// Marge (en pixels) entre le texte et le bord de son cadre.
const TEXT_PAD = 4;
// Convertit un texte de l'ancien format (cadre de taille FIXE : t.width/t.height, marge de 8)
// vers le nouveau (cadre ajusté au contenu), SANS que le texte ne bouge visuellement :
// on recalcule la mise en page qu'il avait dans son ancien cadre (y compris les retours à
// la ligne automatiques, qu'on fige en vrais retours à la ligne), puis on décale sa position
// pour que le texte reste exactement au même endroit sur la feuille.
function fitTextToContent(t){
  t.autoFit = true;
  if (!t.width){ delete t.height; return; }
  const OLD_PAD = 8;
  const tmp = new Konva.Text({
    text:t.text, fontSize:t.fontSize, fontFamily:APP_FONT, width:t.width, height:t.height,
    align:t.align||'left', verticalAlign:t.verticalAlign||'middle', padding:OLD_PAD, wrap:'word'
  });
  const lines = (tmp.textArr||[]).map(l=>l.text);
  const contentW = Math.max(0, ...(tmp.textArr||[]).map(l=>l.width));
  const contentH = lines.length * t.fontSize * (tmp.lineHeight()||1);
  tmp.destroy();
  const align = t.align||'left', valign = t.verticalAlign||'middle';
  let cx = OLD_PAD, cy = OLD_PAD;
  if (align==='center') cx = (t.width - contentW)/2;
  else if (align==='right') cx = t.width - OLD_PAD - contentW;
  if (t.height){
    if (valign==='middle') cy = (t.height - contentH)/2;
    else if (valign==='bottom') cy = t.height - OLD_PAD - contentH;
  }
  const dx = cx - TEXT_PAD, dy = cy - TEXT_PAD;
  const rad = (t.rotation||0)*Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
  t.x += dx*cos - dy*sin;
  t.y += dx*sin + dy*cos;
  if (lines.length) t.text = lines.join('\n');
  delete t.width; delete t.height;
}
// Affiche/masque le halo bleu ET la zone de saisie élargie d'une pastille selon qu'elle est
// sélectionnée. La zone de saisie fait au moins 32 px de rayon À L'ÉCRAN (d'où la division
// par le zoom), pour rester facile à attraper au doigt même très zoomé ou dézoomé.
function syncPastilleSelection(group, isSelected, radius){
  const halo = group.findOne('.selection-halo');
  if (halo) halo.visible(isSelected);
  const grab = group.findOne('.selection-grab');
  if (grab){ grab.visible(isSelected); grab.radius(Math.max((radius||16)+9, 32/zoom)); }
}
// Le plan importé est-il déplaçable en ce moment ? Non s'il est verrouillé, si l'outil actif ne
// le permet pas, ou (v2.1-59) si une PASTILLE est sélectionnée : on est alors en train de
// repositionner cette pastille, et un geste un peu imprécis ne doit jamais emporter tout le
// plan. Désélectionner la pastille (toucher une zone vide) rend le plan à nouveau déplaçable.
function planCanBeDragged(pl){
  if (pl.locked) return false;
  if (activeTool!==null) return false;
  // v2.1-78 : plus d'outil « Déplacer le plan » — seul le plan SÉLECTIONNÉ (et déverrouillé) se
  // déplace ; sinon le doigt sur le plan fait défiler la vue. (Une pastille sélectionnée exclut
  // de fait le plan, puisque selectedId est alors l'id de la pastille.)
  return selectedId === pl.id;
}
function refreshPlansDraggable(){
  model.plans.forEach(pl=>{ const n = planImageNodes.get(pl.id); if (n) n.draggable(planCanBeDragged(pl)); });
}
// Horodatage du dernier contact tactile : permet de distinguer un glisser AU DOIGT d'un
// glisser à la souris (les deux déclenchent les mêmes événements de déplacement Konva).
let lastTouchStartTs = 0;
window.addEventListener('touchstart', ()=>{ lastTouchStartTs = Date.now(); }, { passive:true, capture:true });
let pastilleNodes = new Map();
let textNodes = new Map();
let logoNodes = new Map();
let legendGroupNode = null;
let lastLinesSig = null; // signature des lignes de raccord affichées (voir renderContent)

// ---- Mise en cache bitmap des pastilles et de la légende (v2.1-65) --------------------------
// Une pastille = dégradé + ombre floue + contour + étiquette avec ombre ; la légende en contient
// une par poste, plus sa propre ombre. Redessiner tout cela en vectoriel à CHAQUE image (dès
// qu'on glisse un élément, la couche entière est redessinée) coûtait cher dès qu'il y avait
// beaucoup de pastilles. Mis en cache, chacun n'est plus qu'une petite image recopiée.
// L'EXPORT n'utilise JAMAIS ces images : bitmapCacheEnabled est coupé pendant la capture
// (voir captureAllPagesAsImages), tout est alors redessiné en vectoriel, à pleine netteté.
let bitmapCacheEnabled = true;
const BITMAP_CACHE_MIN_RATIO = 2; // au moins la finesse de l'export (pixelRatio:2)
function cachePastilleBody(group){
  const body = group.findOne('.pastille-body');
  if (!body) return;
  body.clearCache();
  body.cache({ pixelRatio: Math.max(BITMAP_CACHE_MIN_RATIO, Konva.pixelRatio) });
}
function cacheLegendGroup(group, scale){
  group.clearCache();
  // L'échelle de la légende agrandit l'image mise en cache : on la mémorise à une finesse
  // proportionnelle pour qu'elle reste nette à l'écran même agrandie.
  const ratio = Math.min(6, Math.max(BITMAP_CACHE_MIN_RATIO, Konva.pixelRatio) * Math.max(1, scale||1));
  group.cache({ pixelRatio: ratio });
  group._cachedScale = scale;
}
// Régénère toutes les images en cache (ex. une fois la police chargée : l'image d'une
// étiquette dessinée avec la police de secours resterait sinon figée avec la mauvaise police).
function rebuildAllBitmapCaches(){
  if (!bitmapCacheEnabled) return;
  pastilleNodes.forEach(g=>cachePastilleBody(g));
  if (legendGroupNode && legendGroupNode.visible()) cacheLegendGroup(legendGroupNode, model.legend.scale);
  contentLayer.batchDraw();
}
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ try{ rebuildAllBitmapCaches(); } catch(err){ /* sans conséquence */ } });
}

function renderContent(){
  // lignes (placement déporté) — dessinées avant les pastilles. Peu nombreuses et non
  // interactives : on les reconstruit simplement à chaque rendu plutôt que de les suivre
  // individuellement, le coût est négligeable.
  try{
    // Reconstruites seulement si une ligne a réellement changé (position d'un ancrage ou d'une
    // pastille, couleur du poste) — v2.1-65 : avant, détruites et recréées (avec leurs ombres) à
    // chaque rendu, même pour un simple changement de curseur sans rapport.
    let linesSig = '';
    model.lines.forEach(line=>{
      const anchor = model.anchors.find(a=>a.id===line.fromAnchorId);
      const past = model.pastilles.find(pp=>pp.id===line.toPastilleId);
      if (!anchor || !past) return;
      const ty = model.deviceTypes.find(t=>t.id===past.typeId);
      linesSig += line.id+':'+anchor.x+','+anchor.y+'>'+past.x+','+past.y+'#'+(ty?ty.color:'')+';';
    });
    if (linesSig !== lastLinesSig){
    lastLinesSig = linesSig;
    linesLayerGroup.destroyChildren();
    model.lines.forEach(line=>{
      const anchor = model.anchors.find(a=>a.id===line.fromAnchorId);
      const past = model.pastilles.find(pp=>pp.id===line.toPastilleId);
      if (!anchor || !past) return;
      const type = model.deviceTypes.find(t=>t.id===past.typeId) || {color:'#5a6172'};
      // Ni la ligne ni le point d'ancrage ne sont cliquables : listening:false allège le
      // graphe de détection tactile, et perfectDrawEnabled:false accélère le rendu (léger
      // gain, sans différence visible ici vu la finesse du trait).
      linesLayerGroup.add(new Konva.Line({
        points:[anchor.x, anchor.y, past.x, past.y],
        stroke:type.color, strokeWidth:2, name:'connector-line', id:line.id,
        shadowColor:'rgba(0,0,0,0.25)', shadowBlur:2, shadowOffset:{x:0,y:1},
        listening:false, perfectDrawEnabled:false
      }));
      linesLayerGroup.add(new Konva.Circle({x:anchor.x, y:anchor.y, radius:4.5, fill:type.color, stroke:'#fff', strokeWidth:1.5, listening:false, perfectDrawEnabled:false}));
    });
    }
  } catch(err){ console.warn('Rendu des lignes de raccord interrompu :', err); }

  // pastilles — rendu vectoriel haut de gamme, mis à jour de façon incrémentale
  try{
    const seen = new Set();
    model.pastilles.forEach((p, orderIdx)=>{
      seen.add(p.id);
      const type = model.deviceTypes.find(t=>t.id===p.typeId) || {color:'#0E6FA8', name:'?'};
      // Signature de tout ce qui influence l'APPARENCE de la pastille (pas sa position ni
      // sa rotation, mises à jour séparément sans reconstruction) : si rien de tout ça n'a
      // changé, on réutilise le node existant tel quel.
      const sig = type.color+'|'+(type.shape||'circle')+'|'+p.label+'|'+p.radius;
      let group = pastilleNodes.get(p.id);
      if (!group || group._sig !== sig){
        if (group) group.destroy();
        // Le dessin proprement dit (dégradé, ombres, étiquette) est dans "body", mis en cache bitmap
        // (v2.1-65) : chaque redessin de la couche ne recopie plus qu'une petite image au lieu
        // de recalculer dégradé + ombres floues. Halo et zone de saisie restent HORS du cache : ils
        // changent d'état (sélection, zoom) sans devoir régénérer l'image.
        const body = buildPastilleGroup(type, p.radius, p.label);
        body.name('pastille-body');
        group = new Konva.Group();
        group.add(body);
        group.id(p.id); group.name('pastille'); group.draggable(true);
        // v2.1-89 : grille affichée = le centre s'accroche aux intersections PENDANT le glissement.
        group.dragBoundFunc(pos=> gridVisible ? { x:snapToGrid(pos.x), y:snapToGrid(pos.y) } : pos);
        group._sig = sig;
        if (bitmapCacheEnabled) cachePastilleBody(group);
        const r = p.radius;
        // Halo lumineux affiché uniquement sur la pastille SÉLECTIONNÉE — depuis que les
        // poignées de redimensionnement ne s'y attachent plus (v2.1-37), plus rien
        // n'indiquait visuellement laquelle était active. Ajouté en dessous du reste
        // (moveToBottom) pour ne pas masquer le contenu de la pastille elle-même ; sa
        // visibilité est réaffirmée à chaque rendu, indépendamment de la mise en cache par
        // signature ci-dessus (comme la position/rotation un peu plus bas).
        const halo = new Konva.Circle({
          x:0, y:0, radius:r+9, name:'selection-halo', visible:false, listening:false,
          stroke:'#2FA8F5', strokeWidth:4,
          shadowColor:'#2FA8F5', shadowBlur:16, shadowOpacity:0.95
        });
        group.add(halo);
        halo.moveToBottom();
        // Zone de SAISIE élargie de la pastille sélectionnée (v2.1-59) : un disque invisible
        // couvrant toute la zone entourée de bleu (et au moins ~32 px à l'écran, quel que soit
        // le zoom). Un doigt posé n'importe où dans cette zone attrape la PASTILLE — avant, un
        // doigt tombant juste à côté de la pastille touchait le plan en dessous, et c'était
        // le plan entier qui se déplaçait.
        const grabZone = new Konva.Circle({
          x:0, y:0, radius:r+9, name:'selection-grab', visible:false, fill:'rgba(0,0,0,0.001)'
        });
        group.add(grabZone);
        grabZone.moveToBottom();
        // Les gestionnaires relisent le modèle via p.id à chaque appel (jamais une
        // référence capturée), pour rester corrects même après un undo/redo qui remplace
        // l'objet model entier, ou si la pastille a depuis été supprimée.
        group.on('click tap', ()=>selectNode(group, p.id));
        group.on('mousedown touchstart', ()=>{
          const pp = model.pastilles.find(x=>x.id===p.id);
          if (pp && pp.locked) showTimedBubble('Pastille verrouillée : touchez le cadenas pour la déverrouiller');
        });
        group.on('dragend', ()=>{
          const pp = model.pastilles.find(x=>x.id===p.id); if (!pp) return;
          let nx = group.x(), ny = group.y();
          if (gridVisible){ nx = snapToGrid(nx); ny = snapToGrid(ny); group.position({x:nx,y:ny}); }
          pp.x = nx; pp.y = ny;
          pushHistory(); render();
        });
        group.on('transformend', ()=>{
          const pp = model.pastilles.find(x=>x.id===p.id); if (!pp) return;
          const scale = (group.scaleX()+group.scaleY())/2;
          pp.radius = Math.max(6, r*scale);
          pp.rotation = group.rotation();
          group.scaleX(1); group.scaleY(1);
          pushHistory(); render();
        });
        group.on('dblclick dbltap', ()=>{
          const pp = model.pastilles.find(x=>x.id===p.id); if (!pp) return;
          // Le renommage se fait déjà via le champ dédié dans la barre de sélection (un
          // simple clic suffit) : le double-clic sert donc plutôt à verrouiller/déverrouiller
          // la pastille en place, une fois son emplacement définitif validé.
          pp.locked = !pp.locked;
          toast(pp.locked ? 'Pastille verrouillée en place (double-clic pour déverrouiller).' : 'Pastille déverrouillée, déplaçable à nouveau.');
          pushHistory(); render();
        });
        pastilleNodes.set(p.id, group);
        pastillesLayerGroup.add(group);
        // Un node reconstruit (changement de taille, couleur…) est rajouté en fin de groupe :
        // on le remet à son rang d'origine pour que l'ordre de superposition reste celui du modèle.
        group.zIndex(Math.min(orderIdx, pastillesLayerGroup.children.length-1));
      }
      group.position({x:p.x, y:p.y});
      group.rotation(p.rotation||0);
      group.draggable(!p.locked);
      syncPastilleSelection(group, selectedId === p.id, p.radius);
    });
    for (const [id, node] of pastilleNodes){ if (!seen.has(id)){ node.destroy(); pastilleNodes.delete(id); } }
  } catch(err){ console.warn('Rendu des pastilles interrompu :', err); }

  // textes
  try{
    const seen = new Set();
    model.textes.forEach((t, orderIdx)=>{
      seen.add(t.id);
      if (!t.autoFit) fitTextToContent(t); // ancien texte à cadre fixe -> cadre ajusté (voir plus bas)
      const sig = t.text+'|'+t.fontSize+'|'+t.color+'|'+(t.background||'')+'|'+(t.align||'left');
      let label = textNodes.get(t.id);
      if (!label || label._sig !== sig){
        if (label) label.destroy();
        label = new Konva.Label({ x:t.x, y:t.y, rotation:t.rotation||0, draggable:true, id:t.id, name:'texte' });
        label.add(new Konva.Tag({ fill: t.background || 'transparent' }));
        // Cadre AJUSTÉ AU TEXTE (v2.1-54) : ni largeur ni hauteur imposées, Konva calcule
        // la taille exacte du contenu ; le cadre (fond + poignées) n'ajoute que TEXT_PAD
        // pixels de marge tout autour. Les retours à la ligne sont ceux tapés au clavier.
        const textNode = new Konva.Text({
          text:t.text, fontSize:t.fontSize, fontFamily:APP_FONT, fill:t.color,
          align:t.align||'left', padding:TEXT_PAD
        });
        label.add(textNode);
        label._sig = sig;
        label.on('click tap', ()=>selectNode(label, t.id));
        label.on('dragend', ()=>{
          const tt = model.textes.find(x=>x.id===t.id); if (!tt) return;
          tt.x=label.x(); tt.y=label.y(); pushHistory();
        });
        label.on('transformend', ()=>{
          const tt = model.textes.find(x=>x.id===t.id); if (!tt) return;
          // Poignées de coin : le cadre ET la police s'agrandissent ensemble, dans la même
          // proportion (comme pour une image) — demandé en v2.1-53. Avant, seul le cadre
          // changeait de taille et la police restait identique, ce qui surprenait.
          const s = (label.scaleX()+label.scaleY())/2;
          tt.x=label.x(); tt.y=label.y(); tt.rotation=label.rotation();
          // Le cadre étant ajusté au texte, seule la police change : le cadre suit tout seul.
          tt.fontSize = Math.max(6, Math.min(200, Math.round(tt.fontSize*s*10)/10));
          label.scaleX(1); label.scaleY(1);
          pushHistory(); render();
        });
        label.on('dblclick dbltap', ()=>{
          const tt = model.textes.find(x=>x.id===t.id); if (!tt) return;
          openTextEditor(tt, label);
        });
        textNodes.set(t.id, label);
        textesLayerGroup.add(label);
        label.zIndex(Math.min(orderIdx, textesLayerGroup.children.length-1)); // garde l'ordre du modèle (voir pastilles)
      }
      label.position({x:t.x, y:t.y});
      label.rotation(t.rotation||0);
      label.draggable(!t.locked);
    });
    for (const [id, node] of textNodes){ if (!seen.has(id)){ node.destroy(); textNodes.delete(id); } }
  } catch(err){ console.warn('Rendu des textes interrompu :', err); }

  // logos
  try{
    const seen = new Set();
    model.logos.forEach((lg, orderIdx)=>{
      seen.add(lg.id);
      let node = logoNodes.get(lg.id);
      if (!node || node._dataURL !== lg.dataURL){
        if (node) node.destroy();
        const imgEl = new Image();
        imgEl.src = lg.dataURL;
        node = new Konva.Image({
          image: imgEl, x:lg.x, y:lg.y, width:lg.width, height:lg.height, rotation:lg.rotation||0,
          draggable:true, id:lg.id, name:'logo'
        });
        node._dataURL = lg.dataURL;
        if (!imgEl.complete){ imgEl.onload = ()=>contentLayer.batchDraw(); }
        node.on('click tap', ()=>{
          const ll = model.logos.find(x=>x.id===lg.id);
          // Tant que c'est encore le placeholder "logo Cie" (aucun vrai logo client importé),
          // un clic dessus ouvre directement la galerie/le sélecteur de fichier — plus rapide
          // que de devoir passer par l'outil dédié dans le bandeau.
          if (ll && ll.which==='client' && ll.dataURL===CLIENT_LOGO_PLACEHOLDER_DATAURL){
            document.getElementById('fileInputLogoB').click();
            return;
          }
          selectNode(node, lg.id);
        });
        node.on('dragend', ()=>{
          const ll = model.logos.find(x=>x.id===lg.id); if (!ll) return;
          ll.x=node.x(); ll.y=node.y(); pushHistory();
        });
        node.on('transformend', ()=>{
          const ll = model.logos.find(x=>x.id===lg.id); if (!ll) return;
          ll.x=node.x(); ll.y=node.y(); ll.rotation=node.rotation();
          ll.width=node.width()*node.scaleX(); ll.height=node.height()*node.scaleY();
          node.scaleX(1); node.scaleY(1);
          pushHistory(); render();
        });
        logoNodes.set(lg.id, node);
        logosLayerGroup.add(node);
        node.zIndex(Math.min(orderIdx, logosLayerGroup.children.length-1)); // garde l'ordre du modèle (voir pastilles)
      }
      node.position({x:lg.x, y:lg.y});
      node.size({width:lg.width, height:lg.height});
      node.rotation(lg.rotation||0);
      node.draggable(!lg.locked);
    });
    for (const [id, node] of logoNodes){ if (!seen.has(id)){ node.destroy(); logoNodes.delete(id); } }
  } catch(err){ console.warn('Rendu des logos interrompu :', err); }

  // légende — un seul groupe, reconstruit uniquement si son contenu (postes affichés,
  // réglages) a changé ; sinon juste repositionné.
  try{
  if (model.legend && model.legend.visible){
    const lg = model.legend;
    const usedIds = new Set(model.pastilles.map(p=>p.typeId));
    let types = model.deviceTypes;
    if (lg.onlyUsed) types = types.filter(t=>usedIds.has(t.id));
    // Filet de sécurité : si la taille de la légende a fini par devenir nulle, invalide,
    // minuscule OU DÉMESURÉE (ex. NaN, ou une valeur corrompue par l'ancien bug de
    // redimensionnement qui multipliait l'échelle à chaque geste au lieu de la remplacer,
    // voir v2.1-48), elle devenait quasiment invisible — soit un simple point, soit à
    // l'inverse bien plus grande que la feuille elle-même — tout en restant "visible" au
    // sens du modèle, d'où l'impression qu'elle "ne s'affichait pas" malgré la case cochée.
    if (!lg.scale || !isFinite(lg.scale) || lg.scale < 0.3 || lg.scale > 8) lg.scale = 1;
    const sheetWChk = model.orientation==='portrait' ? SHEET_W : SHEET_H;
    const sheetHChk = model.orientation==='portrait' ? SHEET_H : SHEET_W;
    const legendWChk = 300*lg.scale, legendHChk = (34+14*2+Math.max(types.length,0)*30)*lg.scale;
    // Recentre aussi si la légende est passée ENTIÈREMENT hors de la feuille — pas
    // seulement pour des valeurs aberrantes (NaN, des milliers de pixels) : un simple
    // déplacement accidentel (ou hérité d'un changement d'orientation, une page dupliquée
    // depuis une autre feuille de taille différente…) suffisait à la rendre invisible sans
    // qu'on comprenne pourquoi, la case "insérer/retirer" restant pourtant cochée.
    const offPage = !isFinite(lg.x) || !isFinite(lg.y)
      || (lg.x+legendWChk) < 0 || lg.x > sheetWChk
      || (lg.y+legendHChk) < 0 || lg.y > sheetHChk;
    if (offPage){ lg.x = sheetWChk-legendWChk-40; lg.y = sheetHChk-legendHChk-40; }
    // Les couleurs de police et de fond font partie de la signature : les modifier doit
    // reconstruire la légende (sinon le changement ne s'afficherait pas).
    const legendSig = JSON.stringify(types.map(t=>[t.id,t.color,t.shape,t.code,t.name,t.noNumber,t.defaultRadius])) + '|' + (lg.textColor||'') + '|' + (lg.bgColor||'');
    const legendFg = lg.textColor || null;
    const legendBg = (!lg.bgColor) ? '#ffffff' : (lg.bgColor==='transparent' ? 'rgba(0,0,0,0)' : lg.bgColor);
    const legendNoBg = lg.bgColor==='transparent';
    if (!legendGroupNode || legendGroupNode._sig !== legendSig){
      if (legendGroupNode) legendGroupNode.destroy();
      const group = new Konva.Group({
        x:lg.x, y:lg.y, rotation:lg.rotation||0, scaleX:lg.scale, scaleY:lg.scale,
        draggable:true, id:'legend-frame', name:'legend'
      });
      group._sig = legendSig;
      const DESIGN_W = 300, ROW_H = 30, PAD = 14, TITLE_H = 34;
      const height = TITLE_H + PAD*2 + types.length*ROW_H;
      group.add(new Konva.Rect({
        x:0,y:0,width:DESIGN_W,height, fill:legendBg, stroke:legendNoBg ? 'rgba(0,0,0,0)' : '#d8dce3', strokeWidth:1, cornerRadius:8,
        shadowColor:'rgba(20,26,40,0.28)', shadowBlur:14, shadowOffset:{x:0,y:4}, shadowOpacity:legendNoBg ? 0 : 0.5
      }));
      group.add(new Konva.Text({
        x:0,y:PAD, width:DESIGN_W, text:'Légende', align:'center', fontStyle:'700', fontSize:19,
        fontFamily:APP_FONT, fill:legendFg || '#1c2230'
      }));
      types.forEach((t,i)=>{
        const rowY = TITLE_H + PAD + i*ROW_H + ROW_H/2;
        // Les postes "sans numéro" (ex. souris/rat) n'affichent aucune étiquette sur la
        // pastille du plan : la légende reste cohérente avec ça, sans code dessus non plus.
        // Taille UNIFORME (10) pour toutes les pastilles de la légende, quelle que soit
        // leur taille réelle sur le plan — testé avec une taille proportionnelle au poste
        // (rat plus grand que souris) mais ça donnait des pastilles de légende inégales,
        // jugé moins lisible qu'une taille identique partout.
        const iconR = 10;
        const mini = buildPastilleGroup(t, iconR, t.noNumber ? '' : t.code);
        mini.position({x:PAD+12, y:rowY});
        group.add(mini);
        group.add(new Konva.Text({
          x:PAD+34, y:rowY-9, width:DESIGN_W-PAD*2-34, text:t.name, fontSize:13,
          fontFamily:APP_FONT, fill:legendFg || '#2a3142'
        }));
      });
      if (types.length===0){
        group.add(new Konva.Text({
          x:PAD, y:TITLE_H+PAD, width:DESIGN_W-PAD*2, text:'Aucun dispositif utilisé sur ce plan.', fontSize:12,
          fontFamily:APP_FONT, fill:legendFg || '#8b93a6', fontStyle:'italic'
        }));
      }
      group.on('click tap', ()=>selectNode(group,'legend-frame'));
      group.on('dragend', ()=>{ model.legend.x=group.x(); model.legend.y=group.y(); pushHistory(); });
      group.on('transformend', ()=>{
        // Konva rapporte ici la nouvelle échelle ABSOLUE (le node porte déjà l'échelle
        // actuelle de la légende au début de CHAQUE glissement, puisqu'on la réapplique à
        // chaque rendu) — PAS un facteur relatif à multiplier par l'ancienne valeur. La
        // multiplier comme avant cumulait l'agrandissement à chaque redimensionnement,
        // encore et encore, même en essayant de rétrécir : d'où l'agrandissement en boucle.
        const s = (group.scaleX()+group.scaleY())/2;
        model.legend.scale = Math.min(8, Math.max(0.4, s));
        model.legend.rotation = group.rotation();
        model.legend.x = group.x(); model.legend.y = group.y();
        group.scaleX(1); group.scaleY(1);
        pushHistory(); render();
      });
      legendGroupNode = group;
      legendLayerGroup.add(group);
      if (bitmapCacheEnabled) cacheLegendGroup(group, lg.scale);
    }
    legendGroupNode.position({x:lg.x, y:lg.y});
    legendGroupNode.rotation(lg.rotation||0);
    legendGroupNode.scale({x:lg.scale, y:lg.scale});
    // L'échelle a changé (redimensionnement terminé) : l'image en cache est refaite à la bonne finesse.
    if (bitmapCacheEnabled && legendGroupNode._cachedScale !== lg.scale) cacheLegendGroup(legendGroupNode, lg.scale);
    legendGroupNode.draggable(!lg.locked);
    legendGroupNode.visible(true);
  } else if (legendGroupNode){
    legendGroupNode.visible(false);
  }
  } catch(err){ console.warn('Rendu de la légende interrompu :', err); }

  // L'empilement entre catégories (lignes < pastilles < textes < logos < légende) est désormais
  // garanti par la structure : un groupe par catégorie (voir linesLayerGroup & co. plus haut).
  // Avant, un moveToTop() était rappelé sur CHAQUE élément à chaque rendu.

  contentLayer.batchDraw();
  if (selectedId){
    const node = stage.findOne('#'+selectedId);
    // Les poignées de redimensionnement/rotation ne doivent jamais s'attacher à une
    // pastille (voir selectNode()) : ce même principe doit être réaffirmé ICI aussi, sinon
    // ce bloc — exécuté à CHAQUE rendu pour resynchroniser le cadre après qu'un node ait pu
    // être recréé (changement d'apparence, voir la mise en cache par "signature" plus haut)
    // — réattachait les poignées sur la pastille dès le rendu suivant la sélection,
    // annulant silencieusement l'exclusion pourtant faite au moment du clic.
    const isPastille = model.pastilles.some(p=>p.id===selectedId);
    if (node && !isPastille){ transformer.nodes([node]); transformer.rotateEnabled(!findPlanById(selectedId)); transformer.forceUpdate(); } // forceUpdate : le cadre de sélection suit la NOUVELLE taille du texte (ajusté à son contenu)
    else if (!node){ transformer.nodes([]); selectedId=null; }
    else { transformer.nodes([]); }
  } else {
    transformer.nodes([]);
  }
  uiLayer.batchDraw();
}

// Mesure la largeur réelle du texte (via un canvas hors-scène) afin d'ajuster la taille
// de police de façon fiable. L'ancienne méthode se basait uniquement sur le NOMBRE de
// caractères de l'étiquette (ex: 2 caractères -> une taille fixe), ce qui pouvait faire
// déborder — et donc apparaître coupé — un chiffre dès que l'étiquette ne suivait pas
// exactement le même gabarit que les autres (étiquette éditée manuellement, code de poste
// de longueur différente, etc.). Ici, on réduit la police progressivement jusqu'à ce que
// le texte tienne réellement dans la pastille, quel que soit son contenu.
let __measureCtx = null;
function fontSizeForLabel(text, r){
  if (!__measureCtx) __measureCtx = document.createElement('canvas').getContext('2d');
  const maxWidth = r*1.6; // marge de sécurité à l'intérieur du cercle/étoile
  const maxFontSize = r*1.5, minFontSize = r*0.5;
  let fontSize = maxFontSize;
  while (fontSize > minFontSize){
    __measureCtx.font = `700 ${fontSize}px ${APP_FONT}`;
    if (__measureCtx.measureText(text).width <= maxWidth) break;
    fontSize -= r*0.04;
  }
  return fontSize;
}
function buildPastilleGroup(type, r, labelText){
  const group = new Konva.Group();
  const gradStops = [0, lighten(type.color,32), 0.55, type.color, 1, darken(type.color,18)];
  const commonFill = {
    fillRadialGradientStartPoint:{x:-r*0.3,y:-r*0.3}, fillRadialGradientStartRadius:0,
    fillRadialGradientEndPoint:{x:0,y:0}, fillRadialGradientEndRadius:r*1.15,
    fillRadialGradientColorStops:gradStops,
    stroke:'#ffffff', strokeWidth: Math.max(1, r*0.05),
    shadowColor:'rgba(20,26,40,0.45)', shadowBlur:r*0.5, shadowOffset:{x:0,y:r*0.16}, shadowOpacity:0.55,
    perfectDrawEnabled:false, shadowForStrokeEnabled:false
  };
  let base, ring;
  if (type.shape === 'burst'){
    base = new Konva.Star({ numPoints:10, innerRadius:r*0.74, outerRadius:r, ...commonFill });
    ring = new Konva.Star({ numPoints:10, innerRadius:r*0.74, outerRadius:r, stroke:'#000000', strokeWidth: Math.max(1.6, r*0.14), listening:false, perfectDrawEnabled:false });
  } else {
    base = new Konva.Circle({ radius:r, ...commonFill });
    ring = new Konva.Circle({ radius:r, stroke:'#000000', strokeWidth: Math.max(1.6, r*0.14), listening:false, perfectDrawEnabled:false });
  }
  const labelStr = String(labelText);
  const label = new Konva.Text({
    text:labelStr, fontSize:fontSizeForLabel(labelStr, r), fontStyle:'700', fontFamily:APP_FONT,
    fill:'#ffffff', width:r*2, height:r*2, offsetX:r, offsetY:r, align:'center', verticalAlign:'middle',
    // wrap:'none' est essentiel ici : par défaut Konva peut replier un texte trop large sur
    // plusieurs lignes (y compris en coupant un mot lettre par lettre s'il ne tient pas sur
    // une ligne), et seule la ligne du milieu restait visible dans la hauteur de la pastille
    // — c'est ce qui faisait disparaître certains chiffres (ex: "G10" coupé en "G"/"1"/"0").
    // L'étiquette reste donc toujours sur une seule ligne ; la taille de police est déjà
    // ajustée par fontSizeForLabel() pour qu'elle tienne dans la pastille.
    wrap:'none', ellipsis:false,
    shadowColor:'rgba(0,0,0,0.4)', shadowBlur:2, shadowOffset:{x:0,y:1}, shadowOpacity:0.5,
    listening:false, perfectDrawEnabled:false
  });
  group.add(base); group.add(ring); group.add(label);
  return group;
}
function lighten(hex, amt){ return shade(hex, amt); }
function darken(hex, amt){ return shade(hex, -amt); }
function shade(hex, amt){
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  let r = (num>>16)+amt, g=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------------------------- Sélection ----------------------------------- */
function selectNode(node, modelId){
  selectedId = modelId;
  // Les poignées de redimensionnement/rotation ne servent à rien sur une pastille (sa
  // taille se règle via le curseur "Taille" dédié) et gênaient le glisser-déposer pour la
  // déplacer sur le plan : on n'attache donc le cadre de transformation qu'aux autres types
  // d'éléments (plan, texte, logo, légende).
  const isPastille = modelId && model.pastilles.some(p=>p.id===modelId);
  transformer.nodes(modelId && !isPastille ? [node] : []);
  // Plan : plus de poignée de rotation (remplacée par la zone de rotation "main" tout autour
  // du cadre, façon Paint.NET — voir plus bas, v2.1-56). Les autres éléments la gardent.
  transformer.rotateEnabled(!(modelId && findPlanById(modelId)));
  // Le halo lumineux (voir renderContent) ne se resynchronise normalement qu'au PROCHAIN
  // rendu complet — qui pouvait ne survenir que bien après un simple clic de sélection (le
  // clic seul n'en déclenche pas). Sans ce correctif, le halo n'apparaissait donc pas au
  // tout premier clic, seulement après une action ultérieure. Mis à jour ici directement,
  // pour qu'il s'allume immédiatement, sans attendre.
  pastilleNodes.forEach((g, id)=>{
    const pp = model.pastilles.find(x=>x.id===id);
    syncPastilleSelection(g, id === modelId, pp ? pp.radius : 16);
  });
  refreshPlansDraggable(); // pastille sélectionnée -> plan de fond figé (et inversement)
  contentLayer.batchDraw();
  uiLayer.batchDraw();
  refreshSelectionUI();
}
stage.on('click tap', (e)=>{
  if (planRotate.justEnded) return; // fin d'une rotation : ce n'est pas un clic de désélection
  if (e.target === stage){ selectNode(null, null); }
});

/* ---------------------------- Rotation du plan par 4 icônes (v2.1-57) -------------------
   Remplace le système de v2.1-56 (bande tout autour du cadre + ligne de mire). Quand un plan
   est sélectionné (non verrouillé, outil compatible), QUATRE icônes fixes s'affichent au
   milieu de chaque côté, à l'extérieur du cadre : une MAIN OUVERTE grisée avec un arc à
   double flèche. Au repos, il ne se passe rien. Au clic (souris) ou dès que le doigt se pose
   et reste dessus (tactile), l'icône devient une MAIN FERMÉE et le plan tourne autour de son
   centre en suivant le mouvement. AIMANT conservé : à moins de ROT_SNAP_DEG d'un angle droit
   (0°, 90°, 180°, 270°), le plan s'y cale. Rien d'autre ne s'affiche pendant la rotation.
   Icônes de main : fournies par l'utilisateur (v2.1-58). */
const ROT_SNAP_DEG = 4;      // force de l'aimant, en degrés de part et d'autre de l'angle droit
const ROT_ICON_PX = 38;      // diamètre (pixels écran) d'une icône de rotation
const ROT_ICON_GAP_PX = 10;  // écart (pixels écran) entre le cadre du plan et l'icône
// Icônes de rotation fournies par l'utilisateur (v2.1-58, fichier Main.svg) : main ouverte
// (repos, grisée) et main fermée (pendant la rotation), arc à double flèche inclus. Le
// fichier d'origine contenait les deux mains : elles ont été séparées et recadrées.

function svgToImage(svg){ const img = new Image(); img.src = 'data:image/svg+xml;utf8,'+encodeURIComponent(svg); return img; }

const planRotate = { active:null, justEnded:false };
// Plan actuellement sélectionné ET rotatif (non verrouillé, outil compatible), ou null.
function rotatablePlan(){
  if (!selectedId) return null;
  const pl = findPlanById(selectedId);
  if (!pl || pl.locked) return null;
  if (activeTool!==null) return null;
  return pl;
}
function planCenter(pl){
  const rad = (pl.rotation||0)*Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
  return { x: pl.x + (pl.width/2)*cos - (pl.height/2)*sin, y: pl.y + (pl.width/2)*sin + (pl.height/2)*cos };
}

// CHAQUE mouvement du doigt, ce qui alourdissait fortement la rotation sur smartphone.
// Ici, seuls la position, l'échelle et l'apparence (repos / main fermée) sont mis à jour.
let rotIconsGroup = null;
let rotIconNodes = null; // [{ group, circle, img, active }] x4
function ensureRotIcons(){
  if (rotIconsGroup) return;
  rotIconsGroup = new Konva.Group({ visible:false });
  const imgSize = ROT_ICON_PX*0.8;
  rotIconNodes = [0,1,2,3].map(i=>{
    const g = new Konva.Group({ name:'rot-icon' });
    const circle = new Konva.Circle({
      radius:ROT_ICON_PX/2, fill:'rgba(255,255,255,0.88)', stroke:'#c3c8cf', strokeWidth:1.2,
      shadowColor:'rgba(0,0,0,0.25)', shadowBlur:4, shadowOffset:{x:0,y:1},
      shadowForStrokeEnabled:false, perfectDrawEnabled:false
    });
    const img = new Konva.Image({ image:ROT_IMG_OPEN, x:-imgSize/2, y:-imgSize/2, width:imgSize, height:imgSize, listening:false });
    g.add(circle); g.add(img);
    g.on('mouseenter', ()=>{ if (!planRotate.active) stage.container().style.cursor = 'pointer'; });
    g.on('mouseleave', ()=>{ if (!planRotate.active) stage.container().style.cursor = ''; });
    g.on('mousedown touchstart', (e)=>startPlanRotation(e, i));
    rotIconsGroup.add(g);
    return { group:g, circle, img, active:null };
  });
  uiLayer.add(rotIconsGroup);
}

// au zoom et à chaque image d'une rotation, pour que les icônes suivent toujours le cadre.
function updateRotateIcons(livePl){

  refreshRotFine(pl);
  if (!pl){
    if (rotIconsGroup.visible()){ rotIconsGroup.visible(false); uiLayer.batchDraw(); }
    return;
  }
  if (!livePl){
    // Lecture sur le node affiché : suit le plan PENDANT un déplacement ou un redimensionnement,
    // avant même que le modèle ne soit mis à jour (en fin de geste).
    const node = planImageNodes.get(pl.id);
    if (node) pl = { ...pl, x:node.x(), y:node.y(), rotation:node.rotation(),
                     width:node.width()*node.scaleX(), height:node.height()*node.scaleY() };
  }
  rotIconsGroup.visible(true);
  const sc = 1/zoom, d = (ROT_ICON_PX/2 + ROT_ICON_GAP_PX)/zoom; // taille constante à l'écran quel que soit le zoom
  const rad = (pl.rotation||0)*Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);

  const spots = [[pl.width/2, -d], [pl.width+d, pl.height/2], [pl.width/2, pl.height+d], [-d, pl.height/2]];

    if (n.active !== active){

      n.circle.fill(active ? '#ffffff' : 'rgba(255,255,255,0.88)');
      n.circle.stroke(active ? '#0E6FA8' : '#c3c8cf');
      n.circle.strokeWidth(active ? 2 : 1.2);
      n.img.image(active ? ROT_IMG_CLOSED : ROT_IMG_OPEN);
    }

    // image), rétablies au repos.

const ROT_FINE_STEP = 0.1; // degrés par appui

function ensureRotFine(){
  if (rotFineEl) return;
  rotFineEl = document.createElement('div');
  rotFineEl.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:790;display:none;align-items:center;gap:6px;'
    + 'background:#F59E0B;color:#1c2230;padding:5px 8px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.25);'
    + 'font-size:13px;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;';
  const mk = (txt, dir)=>{
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = txt;
    b.style.cssText = 'font:inherit;font-size:20px;line-height:1;width:44px;height:36px;border:none;border-radius:18px;background:#1c2230;color:#fff;touch-action:none;';
    const stop = ()=>{
      clearTimeout(rotFineTimer); rotFineTimer = null;
      if (rotFineChanged){ rotFineChanged = false; pushHistory(); render(); }
    };
    b.addEventListener('pointerdown', (e)=>{
      e.preventDefault();

      rotFineTimer = setTimeout(rep, 400);

  };

function refreshRotFine(pl){

  rotFineEl.style.display = 'flex';

// Tourne le plan sélectionné de "delta" degrés autour de son CENTRE (même calcul que la rotation à la main).
function nudgePlanRotation(delta){
  const pl = rotatablePlan(); if (!pl) return;
  const c = planCenter(pl);

function pointerClient(e){

  if (id === 'legend-frame') return legendGroupNode;
  return planImageNodes.get(id) || pastilleNodes.get(id) || textNodes.get(id) || logoNodes.get(id) || null;
}
function ensureLockBadge(){
  if (lockIndicatorGroup) return;
  lockIndicatorGroup = new Konva.Group({ visible:false });
  // Visuel (v2.1-53) : pastille ronde rouge, liseré blanc et légère ombre, avec un cadenas
  // BLANC dessiné à l'intérieur — anse refermée si verrouillé, anse relevée et ouverte si
  // déverrouillé. Taille constante à l'écran quel que soit le zoom (échelle 1/zoom).
  const g = new Konva.Group({ name:'lock-badge' });
  g.add(new Konva.Circle({ x:0, y:0, radius:13, fill:'#D6493E', stroke:'#ffffff', strokeWidth:2,
    hitStrokeWidth:22, // zone de clic/tap élargie autour du cadenas
    shadowColor:'rgba(0,0,0,0.35)', shadowBlur:4, shadowOffset:{x:0,y:1},
    shadowForStrokeEnabled:false, perfectDrawEnabled:false }));
  const path = new Konva.Path({ data:LOCK_PATH_CLOSED, stroke:'#ffffff', strokeWidth:2, lineCap:'round', lineJoin:'round' });
  g.add(path);
  // Corps du cadenas + trou de serrure.
  g.add(new Konva.Rect({ x:-5.6, y:-0.5, width:11.2, height:8.5, cornerRadius:1.8, fill:'#ffffff' }));
  g.add(new Konva.Circle({ x:0, y:3.2, radius:1.4, fill:'#D6493E' }));
  // CLIQUABLE (v2.1-58) : un clic (ou un tap rapide au doigt) sur le cadenas verrouille ou
  // déverrouille l'élément — même action que le bouton 🔓/🔒 de la barre de sélection.
  g.on('mousedown touchstart', (e)=>{ e.cancelBubble = true; }); // ne déclenche aucun autre outil
  g.on('click tap', (e)=>{ e.cancelBubble = true; document.getElementById('selLock').click(); });
  g.on('mouseenter', ()=>{ stage.container().style.cursor = 'pointer'; });
  g.on('mouseleave', ()=>{ stage.container().style.cursor = ''; });
  lockIndicatorGroup.add(g);
  // v2.1-84 : croix de SUPPRESSION (plan uniquement), même style que le cadenas, placée dessous.
  const del = new Konva.Group({ name:'delete-badge', visible:false });
  del.add(new Konva.Circle({ x:0, y:0, radius:13, fill:'#D6493E', stroke:'#ffffff', strokeWidth:2, hitStrokeWidth:22,
    shadowColor:'rgba(0,0,0,0.35)', shadowBlur:4, shadowOffset:{x:0,y:1}, shadowForStrokeEnabled:false, perfectDrawEnabled:false }));
  del.add(new Konva.Line({ points:[-5,-5,5,5], stroke:'#ffffff', strokeWidth:2.4, lineCap:'round' }));
  del.add(new Konva.Line({ points:[5,-5,-5,5], stroke:'#ffffff', strokeWidth:2.4, lineCap:'round' }));
  del.on('mousedown touchstart', (e)=>{ e.cancelBubble = true; });
  del.on('click tap', (e)=>{
    e.cancelBubble = true;
    const isTxt = model.textes.some(t=>t.id===selectedId);
    if (!findPlanById(selectedId) && !isTxt) return;
    const sid = selectedId;
    askYesNo(isTxt ? 'Supprimer ce texte ?' : 'Supprimer le plan ?').then(ok=>{ if (ok && selectedId===sid) document.getElementById('selDelete').click(); });
  });
  del.on('mouseenter', ()=>{ stage.container().style.cursor = 'pointer'; });
  del.on('mouseleave', ()=>{ stage.container().style.cursor = ''; });
  lockIndicatorGroup.add(del);
  uiLayer.add(lockIndicatorGroup);
  lockBadge = { g, path, del, locked:false };
}
// v2.1-83 : icône + texte du bouton cadenas de la tuile Plan selon l'état du plan (sélectionné, sinon le 1er).
const PLAN_LOCK_SHACKLE_CLOSED = 'M7.5 10.5V7.8a4.5 4.5 0 0 1 9 0v2.7';
const PLAN_LOCK_SHACKLE_OPEN = 'M7.5 10.5V7.8a4.5 4.5 0 0 1 9 0V6';
function updatePlanLockButton(){
  const btn = document.getElementById('toolLockPlan');
  if (!btn) return;
  const pl = findPlanById(selectedId) || (model.plans && model.plans[0]) || null;
  const txt = !pl ? 'Aucun plan' : (pl.locked ? 'Plan verrouillé' : 'Plan déverrouillé');
  const short = !pl ? 'Aucun plan' : (pl.locked ? 'Verrouillé' : 'Déverrouillé'); // une seule ligne (v2.1-92)
  const lbl = btn.querySelector('.tb-icon-label');
  if (lbl && lbl.textContent !== short) lbl.textContent = short;
  btn.title = txt;
  const sh = btn.querySelector('svg path');
  const d = (pl && !pl.locked) ? PLAN_LOCK_SHACKLE_OPEN : PLAN_LOCK_SHACKLE_CLOSED;
  if (sh && sh.getAttribute('d') !== d) sh.setAttribute('d', d);
}
function updateLockIndicator(duringRotation){
  updatePlanLockButton();
  // Les icônes de rotation se mettent à jour en même temps (sélection, désélection,
  // redimensionnement…), sauf pendant une rotation où elles sont déjà gérées en direct.
  if (!duringRotation && typeof updateRotateIcons === 'function' && !(planRotate && planRotate.active)) updateRotateIcons();
  ensureLockBadge();
  // Pendant une rotation, le cadenas reste masqué (voir applyPlanRotationFrame).
  if (planRotate && planRotate.active && planRotate.active.uiHidden){ lockIndicatorGroup.visible(false); return; }
  const obj = typeof findSelectedModelObject === 'function' ? findSelectedModelObject() : null;
  const node = obj ? nodeForId(selectedId) : null;
  if (!obj || !node){
    if (lockIndicatorGroup.visible()){ lockIndicatorGroup.visible(false); uiLayer.batchDraw(); }
    return;
  }
  // Position calculée directement sur le CONTOUR RÉEL de l'élément affiché (v2.1-58) : coin
  // supérieur droit de sa boîte englobante, un peu à l'extérieur. Recalculée à chaque
  // mouvement (voir stage.on('dragmove') plus bas), pour tous les types d'éléments.
  // v2.1-78 : cadre du PLAN sélectionné plus épais et plus lumineux (épaisseur constante à l'écran).
  const isPlanSel = !!findPlanById(selectedId);
  transformer.borderStrokeWidth(isPlanSel ? 3/zoom : 1.5);
  transformer.borderStroke(isPlanSel ? '#2FA8F5' : '#0E6FA8');
  const box = node.getClientRect({ relativeTo: uiLayer });
  const off = 16/zoom;
  const pastille = model.pastilles.find(p=>p.id===selectedId);
  if (pastille){
    // v2.1-75 : cadenas collé au cercle bleu, à « 10 h » (x = -sin60°, y = -cos60° en repère écran).
    const d = (pastille.radius + 9 + 2) + (13 + 2)/zoom;
    const a = 300*Math.PI/180;
    lockBadge.g.position({ x: node.x() + d*Math.sin(a), y: node.y() - d*Math.cos(a) });
  } else {
    lockBadge.g.position({ x: box.x + box.width + off, y: box.y - off });
  }
  lockBadge.g.scale({ x:1/zoom, y:1/zoom });
  // Croix de suppression : seulement pour un plan, juste sous le cadenas (v2.1-84).
  const isPlanSel2 = !!findPlanById(selectedId) || model.textes.some(t=>t.id===selectedId); // plan ou texte (v2.1-107)
  lockBadge.del.visible(isPlanSel2);
  if (isPlanSel2){
    const gp = lockBadge.g.position();
    lockBadge.del.position({ x:gp.x, y:gp.y + 32/zoom });
    lockBadge.del.scale({ x:1/zoom, y:1/zoom });
  }
  const locked = !!obj.locked;
  if (lockBadge.locked !== locked){
    lockBadge.locked = locked;
    lockBadge.path.data(locked ? LOCK_PATH_CLOSED : LOCK_PATH_OPEN);
  }
  lockIndicatorGroup.visible(true);
  uiLayer.batchDraw();
}

let lastTextDrawerId = null;
let textOptionsInTray = false;
function placeTextOptions(inTray){
  if (inTray === textOptionsInTray) return;
  textOptionsInTray = inTray;
  const tray = document.getElementById('textOptions'), bar = document.getElementById('selectionBar');
  const ids = ['selAlignGroup','selFontSizeWrap','selColorWrap','selBgWrap'];
  if (inTray){
    ids.forEach(id=>tray.appendChild(document.getElementById(id)));
    tray.classList.add('has-text');
  } else {
    // retour dans la barre, à leur place d'origine
    const before = { selAlignGroup:'selLabel', selFontSizeWrap:'selLabel', selColorWrap:'selLock', selBgWrap:'selLock' };
    ids.forEach(id=>bar.insertBefore(document.getElementById(id), document.getElementById(before[id])));
    tray.classList.remove('has-text');
  }
}
function refreshSelectionUI(){
  const bar = document.getElementById('selectionBar');
  if (!selectedId){ placeTextOptions(false); lastTextDrawerId = null; bar.style.display='none'; scheduleBottomReserve(); document.getElementById('toolLockPlan').classList.remove('active'); updateLockIndicator(); return; }
  const node = stage.findOne('#'+selectedId);
  if (!node){ placeTextOptions(false); lastTextDrawerId = null; bar.style.display='none'; scheduleBottomReserve(); updateLockIndicator(); return; }
  // La barre est ancrée en bas de l'écran par CSS (voir #selectionBar) plutôt que
  // positionnée près de l'élément sélectionné : elle pouvait sinon atterrir en plein
  // milieu du plan et y rester figée par-dessus le contenu, sans repère fixe pour la
  // retrouver ni moyen de la déplacer.
  // v2.1-84 : plus de barre pour le plan (cadenas + croix sur le plan) ; v2.1-107 : ni pour un texte (options dans le tiroir Texte)
  const isTextSel = model.textes.some(t=>t.id===selectedId);
  placeTextOptions(isTextSel);
  bar.style.display = (findPlanById(selectedId) || isTextSel) ? 'none' : 'flex';

  } else if (!isTextSel){ lastTextDrawerId = null; }

  document.getElementById('selInfo').textContent = describeSelection();
  const selObj = findSelectedModelObject();
  document.getElementById('selLock').textContent = (selObj && selObj.locked) ? '🔒' : '🔓';
  const sizeInput = document.getElementById('selSize');
  const labelInput = document.getElementById('selLabel');
  const labelConfirm = document.getElementById('selLabelConfirm');
  const p = model.pastilles.find(p=>p.id===selectedId);
  if (p){
    sizeInput.style.display='inline-block'; sizeInput.value = p.radius;
    document.getElementById('selSizeWrap').style.display='inline-flex';
    labelInput.style.display='inline-block';
    labelConfirm.style.display='inline-block';
    if (document.activeElement !== labelInput) labelInput.value = p.label;
  }
  else { document.getElementById('selSizeWrap').style.display='none'; sizeInput.style.display='none'; labelInput.style.display='none'; labelConfirm.style.display='none'; }
  const t = model.textes.find(t=>t.id===selectedId);
  const alignGroup = document.getElementById('selAlignGroup');
  const fontWrap = document.getElementById('selFontSizeWrap');
  if (t){
    alignGroup.style.display = 'inline-flex';
    fontWrap.style.display = 'inline-flex';
    document.getElementById('selFontSize').value = t.fontSize;
    ['selAlignLeft','selAlignCenter','selAlignRight'].forEach(id=>document.getElementById(id).classList.remove('active'));
    const activeId = t.align==='center' ? 'selAlignCenter' : t.align==='right' ? 'selAlignRight' : 'selAlignLeft';
    document.getElementById(activeId).classList.add('active');
  } else {
    alignGroup.style.display = 'none';
    fontWrap.style.display = 'none';
  }
  const pl = findPlanById(selectedId);
  const isLegend = selectedId==='legend-frame';
  // Couleurs : texte & légende -> couleur de POLICE + couleur de FOND ; pastille -> couleur
  // du poste ; plan & logo -> aucune (ce sont des images).
  const colorWrap = document.getElementById('selColorWrap');
  const bgWrap = document.getElementById('selBgWrap');
  const colorInput = document.getElementById('selColor');
  const bgInput = document.getElementById('selBgColor');
  const bgNone = document.getElementById('selBgNone');
  const selPast = model.pastilles.find(p=>p.id===selectedId);
  if (t || isLegend){
    const fg = t ? t.color : (model.legend.textColor || '#1c2230');
    const bg = t ? t.background : (model.legend.bgColor || '#ffffff');
    const noBg = !bg || bg==='transparent';
    colorWrap.style.display = 'inline-flex';
    document.getElementById('selColorLabel').textContent = 'Police';
    colorInput.value = toHexColor(fg, '#1c2230');
    bgWrap.style.display = 'inline-flex';
    bgInput.value = toHexColor(noBg ? '#ffffff' : bg, '#ffffff');
    bgNone.classList.toggle('active', noBg);
  } else if (selPast){
    const ty = model.deviceTypes.find(x=>x.id===selPast.typeId);
    colorWrap.style.display = 'inline-flex';
    document.getElementById('selColorLabel').textContent = 'Couleur';
    colorInput.value = toHexColor(ty && ty.color, '#0E6FA8');
    bgWrap.style.display = 'none';
  } else {
    colorWrap.style.display = 'none';
    bgWrap.style.display = 'none';
  }
  document.getElementById('selDup').style.display = isLegend ? 'none' : 'inline-block';
  document.getElementById('selDelete').textContent = 'Supprimer';
  // Le verrou (bandeau du haut) reflète l'état du plan actuellement sélectionné, s'il y en a un.
  document.getElementById('toolLockPlan').classList.toggle('active', !!(pl && pl.locked));
  updateLockIndicator();
  if (pl){
    // Les curseurs du popover "réglages image" doivent refléter CE plan précisément,
    // maintenant qu'il peut y en avoir plusieurs avec des réglages différents.
    document.getElementById('rngBrightness').value = pl.brightness||0;
    document.getElementById('rngContrast').value = pl.contrast||0;
    document.getElementById('rngSaturation').value = pl.saturation||0;
    document.getElementById('rngHue').value = pl.hue||0;
  }
}
function describeSelection(){
  if (selectedId==='legend-frame') return 'Légende';
  if (findPlanById(selectedId)) return 'Plan (glissez les coins pour redimensionner)';
  if (model.pastilles.find(p=>p.id===selectedId)) return 'Pastille';
  if (model.textes.find(t=>t.id===selectedId)) return 'Texte';
  if (model.logos.find(l=>l.id===selectedId)) return 'Logo';
  return 'Élément';
}
document.getElementById('selDelete').addEventListener('click', ()=>{
  if (!selectedId) return;
  if (selectedId==='legend-frame'){ model.legend.visible=false; selectedId=null; pushHistory(); render(); return; }
  if (findPlanById(selectedId)){
    // Suppression réelle du plan (et nettoyage de son canevas pixel / node associés).
    model.plans = model.plans.filter(pl=>pl.id!==selectedId);
    deletePlanCanvases(selectedId);
    const node = planImageNodes.get(selectedId);
    if (node){ node.destroy(); planImageNodes.delete(selectedId); }
    selectedId = null;
    pushHistory(); render();
    return;
  }
  model.pastilles = model.pastilles.filter(p=>p.id!==selectedId);
  model.textes = model.textes.filter(t=>t.id!==selectedId);
  model.logos = model.logos.filter(l=>l.id!==selectedId);
  model.lines = model.lines.filter(l=>l.toPastilleId!==selectedId);
  selectedId = null;
  pushHistory(); render();
});
// Trouve l'objet sélectionné (données du modèle, pas le node Konva) quel que soit son type
// — pastille, plan, texte, logo ou légende — pour les actions génériques de la barre de
// sélection (verrouillage, ici) qui doivent fonctionner pareil sur n'importe lequel.
function findSelectedModelObject(){
  if (!selectedId) return null;
  if (selectedId==='legend-frame') return model.legend;
  return model.pastilles.find(p=>p.id===selectedId)
      || findPlanById(selectedId)
      || model.textes.find(t=>t.id===selectedId)
      || model.logos.find(l=>l.id===selectedId)
      || null;
}
document.getElementById('selLock').addEventListener('click', ()=>{
  const obj = findSelectedModelObject();
  if (!obj) return;
  obj.locked = !obj.locked;
  document.getElementById('selLock').textContent = obj.locked ? '🔒' : '🔓';
  toast(obj.locked ? 'Élément verrouillé (déplacement bloqué).' : 'Élément déverrouillé.');
  pushHistory(); render();
});
document.getElementById('selDup').addEventListener('click', ()=>{
  if (selectedId==='legend-frame') return;
  const p = model.pastilles.find(p=>p.id===selectedId);
  if (p){
    const np = {...p, id: nextId('past-'), x:p.x+24, y:p.y+24};
    model.pastilles.push(np); selectedId = np.id; pushHistory(); render(); return;
  }
  const t = model.textes.find(t=>t.id===selectedId);
  if (t){
    const nt = {...t, id: nextId('text-'), x:t.x+16, y:t.y+16};
    model.textes.push(nt); selectedId = nt.id; pushHistory(); render(); return;
  }
  const pl = findPlanById(selectedId);
  if (pl){
    const npl = {...pl, id: nextId('plan-'), x:pl.x+24, y:pl.y+24};
    model.plans.push(npl);
    // Le nouveau plan partage temporairement le même canevas pixel (copie légère) : toute
    // future retouche pixel (gomme/pot/découpe) recrée son propre canevas indépendant.
    const srcCanvas = planNaturalCanvases.get(pl.id);
    if (srcCanvas){
      const copy = document.createElement('canvas');
      copy.width = srcCanvas.width; copy.height = srcCanvas.height;
      copy.getContext('2d').drawImage(srcCanvas,0,0);
      setPlanCanvas(npl.id, copy, npl.dataURL);
    }
    selectedId = npl.id; pushHistory(); render(); return;
  }
});
// Convertit une couleur stockée en "#rrggbb" (seul format accepté par <input type=color>),
// avec une valeur de repli si elle est absente ou dans un autre format.
function toHexColor(c, fallback){
  if (typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c)) return c;
  if (typeof c === 'string' && /^#[0-9a-fA-F]{3}$/.test(c)) return '#'+c.slice(1).split('').map(x=>x+x).join('');
  return fallback;
}
