// v2.1-76 : pastille sous le pointeur (positions des nodes en direct, donc aussi pendant un glissement).
function pastilleUnderPointer(pos){
  for (const p of model.pastilles){
    const n = pastilleNodes.get(p.id);
    const x = n ? n.x() : p.x, y = n ? n.y() : p.y;
    if (Math.hypot(pos.x-x, pos.y-y) <= p.radius + 9) return p;
  }
  return null;
}
// Appui commencé SUR une pastille : pas d'aperçu de pose jusqu'au relâchement, même si le doigt
// s'éloigne (pastille verrouillée qui ne bouge pas : le fantôme donnait l'illusion de la déplacer).
let ghostBlockedByPastille = false;
stage.on('mousedown touchstart', ()=>{
  const pos = stage.getPointerPosition();
  ghostBlockedByPastille = !!(pos && pastilleUnderPointer(pos));
});
window.addEventListener('mouseup', ()=>{ ghostBlockedByPastille = false; });
window.addEventListener('touchend', ()=>{ ghostBlockedByPastille = false; });
window.addEventListener('touchcancel', ()=>{ ghostBlockedByPastille = false; });
function updateGhost(pos){
  // Aucun aperçu à montrer et rien à effacer (aucun outil de pose/gomme actif) : on ne
  // redessine surtout pas toute la couche à chaque mouvement du doigt pour rien (v2.1-61).
  if (ghostGroup.children.length === 0 && !pastilleLongPressActive && activeTool!=='place-classic' && activeTool!=='place-remote' && activeTool!=='eraser') return;
  ghostGroup.destroyChildren();
  if (pastilleLongPressActive){ uiLayer.batchDraw(); return; } // en cours de déplacement du plan : pas d'aperçu de pastille
  if (pos && (activeTool==='place-classic' || activeTool==='place-remote') && (ghostBlockedByPastille || pastilleUnderPointer(pos))){
    uiLayer.batchDraw(); return; // sur une pastille existante : aucun aperçu de pose (v2.1-76)
  }
  if (activeTool==='place-classic' || activeTool==='place-remote'){
    const type = model.deviceTypes.find(t=>t.id===selectedTypeId);
    if (type && pos){
      const r = effectiveNextRadius(); // même taille que la pastille qui sera réellement posée
      const c = new Konva.Circle({x:snapToGrid(pos.x),y:snapToGrid(pos.y),radius:r, fill:type.color, opacity:0.55, stroke:'#000', strokeWidth:1.5});
      // v2.1-87 : placement déporté à la souris, 2e clic en attente : trait en direct depuis le point réel.
      if (activeTool==='place-remote' && remoteAnchor){
        const gx = snapToGrid(pos.x), gy = snapToGrid(pos.y); // même calage que la pastille posée
        c.position({x:gx, y:gy});
        ghostGroup.add(new Konva.Line({points:[remoteAnchor.x, remoteAnchor.y, gx, gy], stroke:type.color, strokeWidth:2,
          shadowColor:'rgba(0,0,0,0.25)', shadowBlur:2, shadowOffset:{x:0,y:1}, listening:false}));
        ghostGroup.add(new Konva.Circle({x:remoteAnchor.x, y:remoteAnchor.y, radius:4.5, fill:type.color, stroke:'#fff', strokeWidth:1.5, listening:false}));
      }
      ghostGroup.add(c);
    }
  } else if (activeTool==='eraser' && pos){
    renderEraserGhost(pos); // forme de la gomme (carrée / ronde) ou aperçu du trait en cours (v2.1-97)
    return;
  }
  uiLayer.batchDraw();
}
stage.on('mousemove touchmove', (e)=>{
  if (isPinching) return;
  if (planRotate.active) return; // rotation du plan en cours : aucun aperçu fantôme à mettre à jour (v2.1-61)
  if (e.evt && e.evt.touches && e.evt.touches.length>1) return;
  // En placement/tracé déporté au doigt (pastille, gomme, découpe), c'est le curseur dédié
  // (drawRemoteCursor / previews spécifiques) qui sert d'aperçu ; l'ancien aperçu fantôme
  // resterait collé sous le doigt et ferait doublon avec le point réellement visé.
  if (['place-remote','eraser','cut-rect','cut-point'].includes(activeTool) && isRealTouch(e)) return;
  if (e.evt && e.evt.cancelable) e.evt.preventDefault();
  const pos = stage.getPointerPosition();
  if (!pos) return;
  updateGhost(pos);
});
stage.on('mouseleave touchend touchcancel', ()=>{ ghostGroup.destroyChildren(); uiLayer.batchDraw(); });

/* ---------------------------- Pincer pour zoomer -------------------------- */
// La navigation (déplacement dans le plan) ne passe plus par un appui prolongé au doigt
// (source de blocages/faux départs) : elle se fait désormais via les bandeaux de défilement
// larges en bas et à droite de l'écran (voir plus bas, "Bandeaux de défilement tactiles").
// Seul le pincement à deux doigts reste géré ici, pour le zoom.
const canvasWrapEl = document.getElementById('canvasWrap');
// Ces barres flottantes contextuelles (sélection, validation de découpe) sont ancrées en
// bas de l'écran par-dessus le plan, quel que soit le mode PC/mobile actif : avec plusieurs
// contrôles, elles peuvent être hautes et cacher une bonne partie de la feuille. Plutôt que
// de les superposer, on réduit la zone visible/défilable du plan (#canvasWrap) de la
// hauteur de la barre ouverte, pour qu'elle reste physiquement EN DEHORS du champ de
// vision du plan, jamais dessus.
function updateCanvasBottomReserve(){
  const ids = ['selectionBar','cutConfirmBar','pointCutBar'];
  let maxH = 0;
  ids.forEach(id=>{
    const el = document.getElementById(id);
    // Une fois glissée ailleurs à la main (voir makeBarDraggable), une barre n'est plus
    // ancrée en bas : inutile de continuer à réserver de la place pour elle à cet endroit.
    const stillDocked = el && el.style.bottom !== 'auto';
    if (el && stillDocked && el.style.display!=='none' && el.offsetHeight>maxH) maxH = el.offsetHeight;
  });
  const newBottom = maxH>0 ? (maxH+28)+'px' : '';
  if (newBottom !== lastBottomReserve){ // inchangé : rien à écrire, rien à relire (v2.1-62)
    lastBottomReserve = newBottom;
    canvasWrapEl.style.bottom = newBottom;
    if (typeof updateScrollBands === 'function') updateScrollBands();
  }
}
let lastBottomReserve = '';
// Version regroupée sur une image d'écran, utilisée par refreshSelectionUI() (appelée à chaque
// rendu) : mesurer la hauteur des barres juste après les avoir modifiées forçait un recalcul
// complet de la page au milieu du rendu. Reportée à l'image suivante, une seule fois.
let bottomReserveRAF = 0;
function scheduleBottomReserve(){
  if (bottomReserveRAF) return;
  bottomReserveRAF = requestAnimationFrame(()=>{ bottomReserveRAF = 0; updateCanvasBottomReserve(); });
}
// Convertit un point écran (coordonnées client, ex. centre du viewport visible) en
// coordonnées internes de la feuille (mêmes coordonnées que stage.getPointerPosition()),
// en tenant compte du zoom appliqué via transform CSS sur le conteneur Konva.
function clientPointToStage(clientX, clientY){
  const rect = stage.container().getBoundingClientRect();
  return { x:(clientX-rect.left)/zoom, y:(clientY-rect.top)/zoom };
}
// Comme clientPointToStage, mais à partir d'un événement Konva tactile : donne la position
// RÉELLE du doigt, y compris légèrement en dehors de la feuille (ex. doigt glissé un peu
// plus bas que le bord inférieur). stage.getPointerPosition() peut en effet la ramener à
// l'intérieur de la feuille dans certains cas limites, ce qui empêchait le curseur déporté
// (pointe toujours décalée vers le haut par rapport au doigt) d'atteindre le bord du bas :
// avec cette position brute, le doigt peut être posé légèrement hors feuille pour que la
// pointe, elle, atteigne exactement ce bord, sans réduire l'écart doigt-pointe.
function rawTouchStagePos(e){
  const t = e.evt && e.evt.touches && e.evt.touches[0];
  if (!t) return null;
  return clientPointToStage(t.clientX, t.clientY);
}
// Centre de la zone actuellement visible à l'écran (tient compte du défilement), en
// coordonnées de la feuille : sert de position de départ raisonnable pour un curseur
// déporté affiché avant tout contact au doigt (ex. dès la sélection de l'outil ciseaux).
function viewportCenterStagePos(){
  const wrapRect = canvasWrapEl.getBoundingClientRect();
  return clientPointToStage(wrapRect.left + wrapRect.width/2, wrapRect.top + wrapRect.height/2);
}
let pinchStartDist = 0, pinchStartZoom = 1;
let pinchRAF = null, pendingPinchZoom = null, pendingPinchMid = null;
function touchDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}
function pinchMidpoint(touches){
  return { x:(touches[0].clientX+touches[1].clientX)/2, y:(touches[0].clientY+touches[1].clientY)/2 };
}
// Le zoom (transform CSS scale) grandit depuis le coin haut-gauche du contenu (voir
// transformOrigin:'top left' dans applySheetSize) : sans compensation, zoomer fait donc
// dériver visuellement tout le plan vers le bas-droite depuis ce coin — ce qui, vu depuis
// les doigts qui pincent ailleurs sur l'écran, donne l'impression que le plan glisse vers le
// haut-gauche au lieu de rester centré entre eux. On compense en ajustant le défilement du
// conteneur pour que le point ÉCRAN sous le milieu du pincement reste fixe avant/après.
function setZoomAnchored(z, screenPoint){
  const wrap = canvasWrapEl;
  const wrapRect = wrap.getBoundingClientRect();
  const oldZoom = zoom;
  // Position du point de pincement dans le contenu défilable, en unités indépendantes du
  // zoom (pour pouvoir la retrouver après que le zoom ait changé).
  const logicalX = (wrap.scrollLeft + (screenPoint.x - wrapRect.left)) / oldZoom;
  const logicalY = (wrap.scrollTop + (screenPoint.y - wrapRect.top)) / oldZoom;
  setZoom(z, isPinching);
  wrap.scrollLeft = logicalX*zoom - (screenPoint.x - wrapRect.left);
  wrap.scrollTop = logicalY*zoom - (screenPoint.y - wrapRect.top);
}
stage.on('touchstart', (e)=>{
  const touches = e.evt.touches;
  if (!touches) return;
  if (touches.length===2){
    isPinching = true;
    sheetShadowHostEl.classList.add('pinching'); // ombre de la feuille retirée pendant le geste (coûteuse à repeindre)
    pinchStartDist = touchDist(touches);
    pinchStartZoom = zoom;
    e.evt.preventDefault();
  }
});
stage.on('touchmove', (e)=>{
  const touches = e.evt.touches;
  if (!touches) return;
  if (isPinching && touches.length===2){
    e.evt.preventDefault();
    const dist = touchDist(touches);
    pendingPinchZoom = pinchStartDist>0 ? pinchStartZoom * (dist/pinchStartDist) : null;
    pendingPinchMid = pinchMidpoint(touches);
    if (pendingPinchZoom!=null && !pinchRAF){
      pinchRAF = requestAnimationFrame(()=>{ pinchRAF=null; if (pendingPinchZoom!=null) setZoomAnchored(pendingPinchZoom, pendingPinchMid); });
    }
  }
});
stage.on('touchend touchcancel', (e)=>{
  const remaining = e.evt.touches ? e.evt.touches.length : 0;
  if (remaining<2){
    const wasPinching = isPinching;
    isPinching = false;
    if (wasPinching){
      sheetShadowHostEl.classList.remove('pinching');
      settleZoom(); // recale une seule fois ce qui doit garder une taille constante à l'écran
    }
  }
});

/* ---------------------------- Bandeaux de défilement tactiles ------------- */
// Deux larges bandeaux façon "scrollbar", en bas et à droite de la zone de dessin : on les
// fait glisser du doigt (ou à la souris) pour se déplacer dans le plan, quel que soit le
// niveau de zoom. Ils ne s'affichent que lorsqu'il y a effectivement de quoi défiler.
const hScrollBand = document.getElementById('hScrollBand');
const vScrollBand = document.getElementById('vScrollBand');
const hScrollThumb = document.getElementById('hScrollThumb');
const vScrollThumb = document.getElementById('vScrollThumb');
const SCROLL_THUMB_MIN = 44;
function updateScrollBands(){
  const cw = canvasWrapEl.clientWidth, sw = canvasWrapEl.scrollWidth;
  const ch = canvasWrapEl.clientHeight, sh = canvasWrapEl.scrollHeight;
  const hOverflow = sw > cw + 1;
  const vOverflow = sh > ch + 1;
  hScrollBand.classList.toggle('visible', hOverflow);
  vScrollBand.classList.toggle('visible', vOverflow);
  if (hOverflow){
    const bandW = hScrollBand.clientWidth;
    const thumbW = Math.min(bandW, Math.max(SCROLL_THUMB_MIN, bandW*(cw/sw)));
    const trackW = bandW - thumbW;
    const maxScroll = sw - cw;
    const ratio = (trackW>0 && maxScroll>0) ? canvasWrapEl.scrollLeft/maxScroll : 0;
    hScrollThumb.style.width = thumbW+'px';
    hScrollThumb.style.left = (ratio*trackW)+'px';
  }
  if (vOverflow){
    const bandH = vScrollBand.clientHeight;
    const thumbH = Math.min(bandH, Math.max(SCROLL_THUMB_MIN, bandH*(ch/sh)));
    const trackH = bandH - thumbH;
    const maxScroll = sh - ch;
    const ratio = (trackH>0 && maxScroll>0) ? canvasWrapEl.scrollTop/maxScroll : 0;
    vScrollThumb.style.height = thumbH+'px';
    vScrollThumb.style.top = (ratio*trackH)+'px';
  }
}
function scrollHFromClientX(clientX){
  const rect = hScrollBand.getBoundingClientRect();
  const thumbW = hScrollThumb.offsetWidth;
  const trackW = rect.width - thumbW;
  if (trackW <= 0) return;
  const ratio = Math.max(0, Math.min(1, (clientX - rect.left - thumbW/2) / trackW));
  canvasWrapEl.scrollLeft = ratio * (canvasWrapEl.scrollWidth - canvasWrapEl.clientWidth);
}
function scrollVFromClientY(clientY){
  const rect = vScrollBand.getBoundingClientRect();
  const thumbH = vScrollThumb.offsetHeight;
  const trackH = rect.height - thumbH;
  if (trackH <= 0) return;
  const ratio = Math.max(0, Math.min(1, (clientY - rect.top - thumbH/2) / trackH));
  canvasWrapEl.scrollTop = ratio * (canvasWrapEl.scrollHeight - canvasWrapEl.clientHeight);
}
let scrollBandDrag = null; // {axis:'h'|'v', pointerId}
function bandPointerDown(axis, band){
  return (e)=>{
    e.preventDefault();
    band.setPointerCapture(e.pointerId);
    scrollBandDrag = { axis, pointerId:e.pointerId };
    if (axis==='h') scrollHFromClientX(e.clientX); else scrollVFromClientY(e.clientY);
    updateScrollBands();
  };
}
function bandPointerMove(e){
  if (!scrollBandDrag || e.pointerId !== scrollBandDrag.pointerId) return;
  if (scrollBandDrag.axis==='h') scrollHFromClientX(e.clientX); else scrollVFromClientY(e.clientY);
  updateScrollBands();
}
function bandPointerUp(e){
  if (!scrollBandDrag || e.pointerId !== scrollBandDrag.pointerId) return;
  scrollBandDrag = null;
}
hScrollBand.addEventListener('pointerdown', bandPointerDown('h', hScrollBand));
vScrollBand.addEventListener('pointerdown', bandPointerDown('v', vScrollBand));
hScrollBand.addEventListener('pointermove', bandPointerMove);
vScrollBand.addEventListener('pointermove', bandPointerMove);
hScrollBand.addEventListener('pointerup', bandPointerUp);
vScrollBand.addEventListener('pointerup', bandPointerUp);
hScrollBand.addEventListener('pointercancel', bandPointerUp);
vScrollBand.addEventListener('pointercancel', bandPointerUp);
// Regroupé sur une image d'écran (v2.1-62) : pendant un défilement au doigt, l'événement part
// à chaque pixel et chaque appel relit la mise en page (scrollWidth, clientWidth…).
let scrollBandsRAF = 0;
canvasWrapEl.addEventListener('scroll', ()=>{
  if (scrollBandsRAF) return;
  scrollBandsRAF = requestAnimationFrame(()=>{ scrollBandsRAF = 0; updateScrollBands(); });
}, { passive:true });

/* ---------------------------- Placement déporté au doigt (curseur dédié) ---
   Sur tactile, l'outil "déporté" n'utilise plus le tap direct (trop imprécis, la pointe
   est masquée par le doigt). Le doigt fait apparaître/déplace un curseur (cercle + pointe
   décalée) ; on valide en tapotant le cercle sans glisser. Le zoom à deux doigts et le
   déplacement natif des éléments existants restent inchangés (voir les gardes ci-dessous). */
let remoteCursorRAF = null;
let pendingRemoteCursorPos = null;
function scheduleRemoteCursorMove(pos){
  pendingRemoteCursorPos = pos;
  if (remoteCursorRAF) return; // déjà une mise à jour programmée pour la prochaine frame
  remoteCursorRAF = requestAnimationFrame(()=>{
    remoteCursorRAF = null;
    if (!pendingRemoteCursorPos || !remoteCursor) return;
    remoteCursor.tip = remoteTipFromHandlePos(pendingRemoteCursorPos);
    drawRemoteCursor();
    // Actions continues propres à chaque outil, effectuées à la pointe visée (et non
    // sous le doigt) : la gomme efface au fil du glissement, la découpe rectangle met
    // à jour son aperçu.
    if (remoteCursor.tool==='eraser'){ /* v2.1-97 : l'aperçu du trait est mis à jour par drawRemoteCursor ; effacement au relâchement */ }
    else if (remoteCursor.tool==='cut-rect' && remoteCursor.phase==='end' && cutRectStart){ drawCutPreview(remoteCursor.tip); }
    else if (remoteCursor.tool==='cut-point' && cutPoints.length>0){ drawCutPreview(remoteCursor.tip); }
  });
}
// Crée le curseur déporté initial pour l'outil donné, à la position indiquée. Factorisé
// pour être appelé soit immédiatement (mouvement rapide = intention normale), soit après
// un appui long resté sans effet (voir remoteToolPendingGate ci-dessous).
function createRemoteCursorForTool(tool, pos){
  if (tool==='place-remote'){ remoteCursor = { tool:'pastille', phase:'anchor', tip: remoteTipFromHandlePos(pos) }; return true; }
  const targetNode = planNodeAt(pos);
  if (!targetNode){ toast('Touchez un plan pour le découper.'); return false; }
  cutTargetPlanId = targetNode.id();
  remoteCursor = { tool, phase: tool==='cut-rect' ? 'start' : undefined, tip: remoteTipFromHandlePos(pos) };
  return true;
}
// Appui long = déplacer le plan, même logique que pour les outils au tapotement : tant que
// le curseur déporté n'a pas encore été créé pour ce geste, un appui bref-puis-glissé garde
// le comportement normal (créer le curseur là où le doigt s'est arrêté), tandis qu'un appui
// long resté immobile bascule en déplacement du plan dans toutes les directions.
let remoteToolPendingGate = null; // {startX,startY,resolved,panning,lastX,lastY,timer}
stage.on('touchstart', (e)=>{
  if (!['place-remote','cut-rect','cut-point'].includes(activeTool)) return;
  const touches = e.evt.touches;
  if (!touches || touches.length !== 1) return; // laisser le pincement à deux doigts tranquille
  if (activeTool==='place-remote' && !selectedTypeId){ toast('Sélectionnez d\'abord un type de dispositif.'); return; }
  if ((activeTool==='cut-rect' || activeTool==='cut-point') && pendingCutPolygon) return; // découpe déjà en attente de validation
  const isHandle = !!(e.target && e.target.name && e.target.name()==='remote-cursor-handle');
  // Ignore un doigt posé sur un élément déjà existant (pastille, texte, logo…), sauf si
  // c'est notre propre cercle de validation : on ne veut pas gêner leur glisser-déposer natif.
  if (!isHandle && e.target !== stage && e.target.getLayer() !== planLayer) return;
  e.evt.preventDefault();
  const t = touches[0];

  if (!remoteCursor && !isHandle){
    // Tout premier contact pour ce geste : on ne crée pas le curseur tout de suite, pour
    // laisser une chance à l'appui long de basculer en déplacement du plan.
    if (remoteToolPendingGate) clearTimeout(remoteToolPendingGate.timer);
    remoteToolPendingGate = { startX:t.clientX, startY:t.clientY, lastX:t.clientX, lastY:t.clientY, resolved:false, panning:false };
    remoteToolPendingGate.timer = setTimeout(()=>{
      if (remoteToolPendingGate) { remoteToolPendingGate.resolved = true; remoteToolPendingGate.panning = true; }
    }, PASTILLE_LONGPRESS_MS);
    return;
  }

  const pos = rawTouchStagePos(e);
  if (!pos) return;
  remoteCursorDragActive = true;
  remoteCursorDragOnHandle = isHandle;
  remoteCursorDragStart = { x:t.clientX, y:t.clientY };
  remoteCursorDragMoved = false;
  if (!remoteCursor){
    createRemoteCursorForTool(activeTool, pos);
    drawRemoteCursor();
  } else if (!isHandle){
    // Doigt posé ailleurs sur le plan pendant qu'un curseur existe déjà : on le fait
    // sauter directement à cet endroit pour continuer à ajuster sa position.
    remoteCursor.tip = remoteTipFromHandlePos(pos);
    drawRemoteCursor();
  }
});
stage.on('touchmove', (e)=>{
  if (!['place-remote','cut-rect','cut-point'].includes(activeTool)) return;
  const touches = e.evt.touches;
  const t = touches && touches[0];
  if (remoteToolPendingGate && !remoteToolPendingGate.resolved){
    if (!t) return;
    const moved = Math.hypot(t.clientX-remoteToolPendingGate.startX, t.clientY-remoteToolPendingGate.startY);
    if (moved > PASTILLE_LONGPRESS_MOVE_PX){
      // Le doigt bouge tout de suite : intention normale, pas un déplacement du plan. On
      // crée le curseur déporté ici même, comme si ce mouvement avait été le premier contact.
      clearTimeout(remoteToolPendingGate.timer);
      remoteToolPendingGate = null;
      e.evt.preventDefault();
      const pos = rawTouchStagePos(e);
      if (!pos) return;
      if (createRemoteCursorForTool(activeTool, pos)){
        drawRemoteCursor();
        remoteCursorDragActive = true;
        remoteCursorDragOnHandle = false;
        remoteCursorDragStart = { x:t.clientX, y:t.clientY };
        remoteCursorDragMoved = true;
      }
    }
    return;
  }
  if (remoteToolPendingGate && remoteToolPendingGate.panning){
    if (!t) return;
    e.evt.preventDefault();
    canvasWrapEl.scrollLeft -= (t.clientX - remoteToolPendingGate.lastX);
    canvasWrapEl.scrollTop -= (t.clientY - remoteToolPendingGate.lastY);
    remoteToolPendingGate.lastX = t.clientX; remoteToolPendingGate.lastY = t.clientY;
    return;
  }
  if (!remoteCursorDragActive) return;
  if (!touches || touches.length !== 1 || !remoteCursor) return;
  e.evt.preventDefault();
  if (Math.hypot(t.clientX-remoteCursorDragStart.x, t.clientY-remoteCursorDragStart.y) > 6) remoteCursorDragMoved = true;
  const pos = rawTouchStagePos(e);
  if (!pos) return;
  scheduleRemoteCursorMove(pos); // regroupé sur requestAnimationFrame pour rester fluide
});
stage.on('touchend touchcancel', (e)=>{
  if (!['place-remote','cut-rect','cut-point'].includes(activeTool)) return;
  if (remoteToolPendingGate){
    const wasPanning = remoteToolPendingGate.panning;
    clearTimeout(remoteToolPendingGate.timer);
    remoteToolPendingGate = null;
    if (!wasPanning){
      // Relâché rapidement, sans avoir assez bougé ni assez attendu : comportement
      // d'origine, on crée le curseur pile là où le doigt vient de se lever.
      const ct = e.evt.changedTouches && e.evt.changedTouches[0];
      if (ct){
        const pos = clientPointToStage(ct.clientX, ct.clientY);
        if (createRemoteCursorForTool(activeTool, pos)) drawRemoteCursor();
      }
    }
    return;
  }
  if (!remoteCursorDragActive) return;
  remoteCursorDragActive = false;
  if (remoteCursorRAF){ cancelAnimationFrame(remoteCursorRAF); remoteCursorRAF = null; }
  pendingRemoteCursorPos = null;
  if (remoteCursorDragOnHandle && !remoteCursorDragMoved) confirmRemoteCursor(); // tap net sur le cercle = validation
  remoteCursorDragOnHandle = false;
});

/* ---------------------------- Placement des pastilles ----------------------- */
stage.on('click tap', (e)=>{
  if (isPinching) return;
  if (justPannedPlan) return; // appui long relâché après avoir déplacé le plan : ne pas coller de pastille (le drapeau s'efface tout seul après coup, voir endPastilleLongPress)
  if (activeTool==='place-remote') return; // géré par le curseur déporté tactile ou par le clic souris ci-dessous
  const pos = stage.getPointerPosition();
  if (!pos) return;
  if (e.target !== stage && e.target.getLayer() !== planLayer) return; // clic doit toucher la feuille/plan, pas un élément déjà présent

  if (activeTool==='place-classic'){
    if (!selectedTypeId){ toast('Sélectionnez d\'abord un type de dispositif.'); return; }
    addPastille(pos.x, pos.y);
  } else if (activeTool==='pipette'){
    pickColorAt(pos); closeAllTileDrawers();
  } else if (activeTool==='paint-bucket'){
    paintBucketAt(pos); closeAllTileDrawers();
  }
});

/* ---------------------------- Appui long = déplacer le plan (outils au tapotement) ------
   Pour les outils qui agissent par simple TAPOTEMENT (pastille classique, pipette, pot de
   peinture — aucun n'a de geste de glissement à proprement parler), un appui BREF déclenche
   l'action habituelle. Un appui LONG, maintenu sans relâcher, bascule au contraire en
   déplacement du plan dans toutes les directions tant que le doigt reste posé — pratique
   pour se repositionner sans quitter l'outil en cours. */
// v2.1-60 : étendu à "aucun outil" (null) et à l'outil "Déplacer le plan", pour pouvoir
// TOUJOURS naviguer dans un plan zoomé en maintenant le doigt puis en glissant — avant, ce
// défilement n'existait qu'avec certains outils actifs. (Les outils à glissement continu —
// pastille déportée, découpes, gomme — ont leur propre équivalent, voir plus bas.)
const TAP_TOOLS_WITH_LONGPRESS_PAN = ['place-classic','pipette','paint-bucket', null];
const PASTILLE_LONGPRESS_MS = 380;
const PASTILLE_LONGPRESS_MOVE_PX = 10; // au-delà, on bascule aussi en déplacement avant même la fin du délai
let pastilleLongPressTimer = null;
let pastilleLongPressActive = false;
let pastilleLongPressStart = null; // {x,y} en coordonnées écran (clientX/clientY)
let pastilleLongPressLast = null;
let justPannedPlan = false;
function endPastilleLongPress(){
  if (pastilleLongPressTimer){ clearTimeout(pastilleLongPressTimer); pastilleLongPressTimer = null; }
  if (pastilleLongPressActive){
    // Certains navigateurs mobiles émettent à la fois un "tap" (Konva) ET, ~300ms plus
    // tard, un "click" de compatibilité pour la même interaction tactile. On garde le
    // drapeau actif un court instant après le relâchement (au lieu de le consommer dès le
    // premier événement) pour être sûr d'attraper les deux et ne jamais coller de pastille.
    justPannedPlan = true;
    setTimeout(()=>{ justPannedPlan = false; }, 400);
  }
  pastilleLongPressActive = false;
  pastilleLongPressStart = null;
  pastilleLongPressLast = null;
}
stage.on('touchstart', (e)=>{
  if (!TAP_TOOLS_WITH_LONGPRESS_PAN.includes(activeTool)) return;
  const touches = e.evt.touches;
  if (!touches || touches.length!==1) return; // le pincement à 2 doigts reste géré ailleurs
  // Doigt posé SUR un élément (pastille, texte, logo, légende, poignée…) : c'est cet élément
  // qui doit se déplacer, pas la vue (v2.1-59). Le défilement de la vue n'est déclenché que
  // depuis une zone vide de la feuille ou depuis le plan importé.
  if (e.target !== stage && e.target.getLayer() !== planLayer) return;
  // v2.1-78 : un doigt posé sur le plan SÉLECTIONNÉ et déverrouillé le déplace (glisser Konva) ;
  // sinon (plan non sélectionné ou verrouillé) il fait défiler la vue.
  if (activeTool===null && e.target.getLayer() === planLayer){
    const spl = findPlanById(e.target.id());
    if (spl && planCanBeDragged(spl)) return;
  }
  justPannedPlan = false; // évite qu'un drapeau resté bloqué (tap non déclenché après un déplacement) ne bloque le prochain appui bref
  const t = touches[0];
  pastilleLongPressStart = {x:t.clientX, y:t.clientY};
  pastilleLongPressLast = {x:t.clientX, y:t.clientY};
  pastilleLongPressActive = false;
  if (pastilleLongPressTimer) clearTimeout(pastilleLongPressTimer);
  pastilleLongPressTimer = setTimeout(()=>{
    pastilleLongPressTimer = null;
    if (pastilleLongPressStart){
      pastilleLongPressActive = true; // le doigt est toujours posé : on bascule en déplacement
      justPannedPlan = true; // posé dès maintenant (pas seulement au relâchement) : le "tap" peut se
                              // déclencher avant notre gestionnaire de fin de geste selon l'ordre interne de Konva
    }
  }, PASTILLE_LONGPRESS_MS);
});
stage.on('touchmove', (e)=>{
  if (!TAP_TOOLS_WITH_LONGPRESS_PAN.includes(activeTool) || !pastilleLongPressStart) return;
  const touches = e.evt.touches;
  if (!touches || touches.length!==1) return;
  const t = touches[0];
  if (!pastilleLongPressActive){
    const moved = Math.hypot(t.clientX-pastilleLongPressStart.x, t.clientY-pastilleLongPressStart.y);
    if (moved > PASTILLE_LONGPRESS_MOVE_PX){
      // Bouge trop tôt pour être une pastille précise : on considère aussi que
      // l'intention est de se déplacer, sans attendre la fin du délai.
      if (pastilleLongPressTimer){ clearTimeout(pastilleLongPressTimer); pastilleLongPressTimer=null; }
      pastilleLongPressActive = true;
      justPannedPlan = true; // même raison que ci-dessus : posé au moment où le déplacement démarre vraiment
    } else {
      return;
    }
  }
  e.evt.preventDefault();
  const dx = t.clientX - pastilleLongPressLast.x;
  const dy = t.clientY - pastilleLongPressLast.y;
  canvasWrapEl.scrollLeft -= dx;
  canvasWrapEl.scrollTop -= dy;
  pastilleLongPressLast = {x:t.clientX, y:t.clientY};
});
stage.on('touchend touchcancel', (e)=>{
  if (!TAP_TOOLS_WITH_LONGPRESS_PAN.includes(activeTool)) return;
  endPastilleLongPress();
});
// Souris (PC/Mac) : le pointeur est déjà précis, on garde l'ancien geste simple à 2 clics.
stage.on('click', (e)=>{
  if (activeTool !== 'place-remote') return;
  if (window.TouchEvent && e.evt instanceof TouchEvent) return; // le tactile passe par le curseur déporté ci-dessus
  if (!selectedTypeId){ toast('Sélectionnez d\'abord un type de dispositif.'); return; }
  const pos = stage.getPointerPosition();
  if (!pos) return;
  if (e.target !== stage && e.target.getLayer() !== planLayer) return;
  if (!remoteAnchor){
    remoteAnchor = {x:snapToGrid(pos.x), y:snapToGrid(pos.y)};
    toast('Point réel placé. Cliquez à présent où afficher la pastille.');
  } else {
    const anchor = {id: nextId('anchor-'), x:remoteAnchor.x, y:remoteAnchor.y};
    model.anchors.push(anchor);
    const past = addPastille(snapToGrid(pos.x), snapToGrid(pos.y), false);
    model.lines.push({id: nextId('line-'), fromAnchorId:anchor.id, toPastilleId:past.id});
    remoteAnchor = null;
    pushHistory(); render();
  }
});

function addPastille(x,y, commit=true){
  x = snapToGrid(x); y = snapToGrid(y); // v2.1-89 : centre sur une intersection de la grille si elle est affichée
  const type = model.deviceTypes.find(t=>t.id===selectedTypeId);
  const countSameType = countPastillesOfType(selectedTypeId);
  // Certains postes (ex. rongeurs souris/rat) sont configurés "sans numéro" : leur pastille
  // n'affiche alors que la couleur/forme, sans étiquette dessus.
  const label = (type && type.noNumber) ? '' : (type ? type.code : '?') + (countSameType+1);
  const radius = (type && type.defaultRadius) ? type.defaultRadius : currentPastilleRadius;
  const p = { id: nextId('past-'), typeId: selectedTypeId, label, x, y, radius, rotation:0 };
  model.pastilles.push(p);
  closeAllTileDrawers(); // v2.1-86 : le tiroir Pastille se referme dès qu'une pastille est posée
  if (commit){ pushHistory(); render(); }
  return p;
}
// Quadrillage invisible et serré, utilisé uniquement comme point d'ancrage pour aligner
// proprement les pastilles en placement déporté (celles reliées par un trait à leur point réel).
// v2.1-89 : même pas que la grille affichée (GRID_STEP) ; sans effet si la grille est masquée.
function snapToGrid(v){ return gridVisible ? Math.round(v/GRID_STEP)*GRID_STEP : v; }

/* ---------------------------- Curseur déporté (placement précis au doigt) --- */
// Le cercle (le "handle") reste exactement sous le doigt — c'est lui qu'on touche et qu'on
// glisse. La pointe (sommet du triangle) est décalée en diagonale à 45°, comme le sommet
// d'un pointeur de souris classique, pour rester visible au-dessus/à côté du doigt et ne
// jamais être masquée. On ne recrée jamais les formes : on met seulement à jour leurs
// attributs, pour rester fluide même sur un plan complexe.
function remoteCursorColor(){
  if (remoteCursor){
    if (remoteCursor.tool==='pastille' && remoteCursor.phase==='pastille'){
      const type = model.deviceTypes.find(t=>t.id===selectedTypeId);
      if (type) return type.color;
    }
    if (remoteCursor.tool==='eraser') return '#C0392B';
    if (remoteCursor.tool==='cut-rect' || remoteCursor.tool==='cut-point') return '#0E6FA8';
  }
  return '#0E6FA8';
}
let remoteCursorNodes = null;
function ensureRemoteCursorNodes(){
  if (remoteCursorNodes) return remoteCursorNodes;
  const previewCircle = new Konva.Circle({ listening:false, visible:false });
  // v2.1-87 : trait provisoire point réel -> pastille (en dessous de tout le reste) + repère du point réel.
  const previewLine = new Konva.Line({ listening:false, visible:false, strokeWidth:2, lineCap:'round' });
  const anchorDot = new Konva.Circle({ listening:false, visible:false });
  const arrow = new Konva.Line({ closed:true, listening:false, strokeWidth:1 });
  const tipDot = new Konva.Circle({ listening:false });
  const handleCircle = new Konva.Circle({ name:'remote-cursor-handle', fill:'#ffffff' });
  const handleDot = new Konva.Circle({ listening:false });
  remoteCursorGroup.add(previewLine, anchorDot, previewCircle, arrow, tipDot, handleCircle, handleDot);
  remoteCursorNodes = { previewLine, anchorDot, previewCircle, arrow, tipDot, handleCircle, handleDot };
  return remoteCursorNodes;
}
// Convertit la position brute du doigt (= centre du cercle) en position de la pointe visée,
// décalée en diagonale (45°, haut-gauche) d'une distance constante à l'écran quel que soit le zoom.
// Le CERCLE (et non la pointe) est systématiquement ramené à l'intérieur de la feuille, avec une
// marge suffisante pour rester entièrement visible et tapotable : sans cela, en approchant un bord
// ou un coin, le cercle sortirait de la zone dessinée par Konva et deviendrait impossible à retoucher
// (un nouveau tap dans le vide, hors de la feuille, ne peut plus l'atteindre).
// Convertit la position brute du doigt (= centre du cercle) en position de la pointe visée,
// décalée uniquement verticalement (la pointe est toujours pile au-dessus du doigt, jamais
// sur le côté), d'une distance constante à l'écran quel que soit le zoom.
// La POINTE (point réellement visé) doit pouvoir atteindre les bords de la feuille, y
// compris en sortir légèrement (haut ET bas) : elle n'est donc plus tirée vers l'intérieur
// par une marge artificielle (l'ancienne version empêchait complètement d'atteindre ou de
// dépasser les bords, ex. impossible de gommer tout à fait sur le bord extérieur du plan).
// L'écart doigt-pointe (lift) reste désormais constant partout, y compris près du bord bas :
// voir rawTouchStagePos(), qui permet au doigt d'être suivi même légèrement hors feuille.
function remoteTipFromHandlePos(pos){
  const lift = REMOTE_CURSOR_LIFT_PX/zoom;
  return { x: pos.x, y: pos.y - lift };
}
function drawRemoteCursor(){
  if (!remoteCursor){
    if (remoteCursorNodes) remoteCursorGroup.visible(false);
    cursorLayer.visible(false); // couche masquée hors usage : plus rien à composer
    return;
  }
  const nodes = ensureRemoteCursorNodes();
  remoteCursorGroup.visible(true);
  cursorLayer.visible(true);
  const lift = REMOTE_CURSOR_LIFT_PX/zoom;
  const handleR = REMOTE_CURSOR_HANDLE_PX / zoom;
  const tx = remoteCursor.tip.x, ty = remoteCursor.tip.y;
  const hx = tx, hy = ty + lift; // le cercle est TOUJOURS exactement sous le doigt, à la verticale de la pointe
  const color = remoteCursorColor();

  // Aperçu de la pastille à venir (outil pastille, phase 'pastille' uniquement)
  // Position réellement utilisée à la validation : calée sur la grille (v2.1-88/89). Seule la
  // pastille s'accroche ; le cercle sous le doigt (hx, hy) reste exactement sous le doigt.
  const snapTip = remoteCursor.tool==='pastille';
  const sx = snapTip ? snapToGrid(tx) : tx, sy = snapTip ? snapToGrid(ty) : ty;
  if (remoteCursor.tool==='pastille' && remoteCursor.phase==='pastille' && remoteAnchor){
    nodes.previewLine.setAttrs({ points:[remoteAnchor.x, remoteAnchor.y, sx, sy], stroke:color, strokeWidth:2, lineCap:'butt',
      shadowColor:'rgba(0,0,0,0.25)', shadowBlur:2, shadowOffset:{x:0,y:1}, visible:true });
    nodes.anchorDot.setAttrs({ x:remoteAnchor.x, y:remoteAnchor.y, radius:4.5, fill:color, stroke:'#ffffff', strokeWidth:1.5, visible:true });
  } else {
    nodes.previewLine.visible(false); nodes.anchorDot.visible(false);
  }
  if (remoteCursor.tool==='pastille' && remoteCursor.phase==='pastille'){
    nodes.previewCircle.setAttrs({ x:sx, y:sy, radius:effectiveNextRadius(), fill:color, opacity:0.35, stroke:color, strokeWidth:1.5, visible:true });
  } else {
    nodes.previewCircle.visible(false);
  }
  // Aperçu du carré de la gomme, centré sur la pointe visée (et non sous le doigt)
  if (remoteCursor.tool==='eraser'){
    renderEraserGhost({x:tx, y:ty}); // v2.1-97 : forme + aperçu du trait depuis le point de départ
  }

  // Flèche verticale (pointe en haut, base près du cercle en dessous)
  const ux = 0, uy = 1; // vecteur unitaire tip->handle : toujours vertical, vers le bas
  const perpX = -uy, perpY = ux;
  const baseDist = handleR*0.92, baseHalf = handleR*0.42;
  const bcx = sx + ux*baseDist, bcy = sy + uy*baseDist;
  nodes.arrow.setAttrs({
    points:[sx, sy, bcx+perpX*baseHalf, bcy+perpY*baseHalf, bcx-perpX*baseHalf, bcy-perpY*baseHalf],
    fill:color, stroke:color
  });

  // Petit repère exactement sur la pointe visée
  nodes.tipDot.setAttrs({ x:sx, y:sy, radius:Math.max(2, 3/zoom), fill:color, stroke:'#ffffff', strokeWidth:Math.max(1, 1/zoom) });

  // Le cercle à tapoter : grand et bien visible, toujours centré sous le doigt
  nodes.handleCircle.setAttrs({ x:hx, y:hy, radius:handleR, stroke:color, strokeWidth:Math.max(2, 2.5/zoom) });
  nodes.handleDot.setAttrs({ x:hx, y:hy, radius:handleR*0.32, fill:color });

  cursorLayer.batchDraw();
}// Valide l'étape en cours (point réel puis pastille numérotée), et enchaîne sur la suivante.
function confirmRemoteCursor(){
  if (!remoteCursor) return;
  const {x,y} = remoteCursor.tip;
  if (remoteCursor.tool==='pastille'){
    if (remoteCursor.phase==='anchor'){
      remoteAnchor = {x:snapToGrid(x), y:snapToGrid(y)};
      remoteCursor = { tool:'pastille', phase:'pastille', tip:{x, y} };
      drawRemoteCursor();
      toast('Point réel validé. Positionnez la pastille puis tapotez le cercle pour valider.');
    } else {
      const anchor = {id: nextId('anchor-'), x:remoteAnchor.x, y:remoteAnchor.y};
      model.anchors.push(anchor);
      const past = addPastille(snapToGrid(x), snapToGrid(y), false);
      model.lines.push({id: nextId('line-'), fromAnchorId:anchor.id, toPastilleId:past.id});
      remoteAnchor = null;
      remoteCursor = null;
      pushHistory(); render();
      drawRemoteCursor();
      toast('Pastille placée. Touchez le plan pour le point réel suivant.');
    }
  } else if (remoteCursor.tool==='cut-rect'){
    if (remoteCursor.phase==='start'){
      cutRectStart = {x, y};
      remoteCursor = { tool:'cut-rect', phase:'end', tip:{x, y} };
      drawRemoteCursor();
      toast('Premier coin validé. Positionnez le coin opposé puis tapotez le cercle pour valider.');
    } else {
      const start = cutRectStart;
      const rectPts = [
        {x:Math.min(start.x,x), y:Math.min(start.y,y)},
        {x:Math.max(start.x,x), y:Math.min(start.y,y)},
        {x:Math.max(start.x,x), y:Math.max(start.y,y)},
        {x:Math.min(start.x,x), y:Math.max(start.y,y)},
      ];
      cutRectStart = null;
      remoteCursor = null;
      drawRemoteCursor();
      const w = Math.abs(rectPts[2].x-rectPts[0].x), h = Math.abs(rectPts[2].y-rectPts[0].y);
      if (w>4 && h>4) showCutConfirm(rectPts);
      else toast('Zone trop petite, réessayez.');
    }
  } else if (remoteCursor.tool==='cut-point'){
    if (!pendingCutPolygon){
      cutPoints.push([x,y]);
      drawCutPreview({x,y});
      updatePointCutBar();
    }
    // Le curseur reste affiché, à la même position, prêt à enchaîner sur le point suivant.
    drawRemoteCursor();
  }
}

/* ---------------------------- Pipette / Pot de peinture --------------------- */
function pickColorAt(pos){
  const planNode = planNodeAt(pos);
  const canvas = planNode && planNaturalCanvases.get(planNode.id());
  if (!planNode || !canvas){ toast('Cliquez sur un plan pour utiliser la pipette.'); return; }
  const local = toLocal(planNode, pos.x, pos.y);
  const px = Math.round(local.x / planNode.width() * canvas.width);
  const py = Math.round(local.y / planNode.height() * canvas.height);
  if (px<0||py<0||px>=canvas.width||py>=canvas.height) return;
  const ctx = canvas.getContext('2d');
  const d = ctx.getImageData(px,py,1,1).data;
  const hex = '#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  bucketColor = hex;
  document.getElementById('bucketColorSwatch').style.background = hex;
  document.getElementById('bucketColorPicker').value = hex;
  toast('Couleur du pot définie : '+hex);
}

function paintBucketAt(pos){
  const planNode = planNodeAt(pos);
  const canvas = planNode && planNaturalCanvases.get(planNode.id());
  if (!planNode || !canvas){ toast('Cliquez sur un plan pour utiliser le pot de peinture.'); return; }
  const local = toLocal(planNode, pos.x, pos.y);
  const px = Math.round(local.x / planNode.width() * canvas.width);
  const py = Math.round(local.y / planNode.height() * canvas.height);
  const tolerance = parseInt(document.getElementById('rngTolerance').value,10);
  floodFill(canvas, px, py, hexToRgb(bucketColor), tolerance);
  commitPlanPixelEdit(planNode.id());
}
// Fin d'une retouche pixel (pot de peinture, gomme) faite EN PLACE sur le canevas pleine
// définition : on l'encode dans le modèle (pour l'historique, la sauvegarde et le fichier .json),
// on régénère la copie réduite de l'écran, puis on redessine (v2.1-64).
function commitPlanPixelEdit(planId){
  const canvas = planNaturalCanvases.get(planId);
  const pl = findPlanById(planId);
  if (!canvas || !pl) return false;
  pl.dataURL = canvas.toDataURL('image/png');
  refreshPlanDisplay(planId, pl.dataURL);
  const node = planImageNodes.get(planId);
  if (node) node._forceRefresh = true;
  pushHistory(); render();
  return true;
}
function hexToRgb(hex){
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function floodFill(canvas, startX, startY, fillColor, tolerance){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if (startX<0||startY<0||startX>=w||startY>=h) return;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  // Remplissage PAR LIGNES (v2.1-64). L'ancienne version empilait un petit tableau [x,y] par
  // pixel voisin (4 par pixel rempli) : sur une grande zone d'une image pleine définition, cela
  // créait des dizaines de millions de petits objets (gel de plusieurs secondes, voire plantage
  // du navigateur sur téléphone). Ici : on remplit un segment horizontal d'un coup et on ne
  // mémorise que quelques graines (nombres entiers à plat). Même résultat : un pixel est
  // rempli si sa couleur est à moins de "tolerance" (distance RVB) de celle du point touché.
  const startIdx = (startY*w+startX)*4;
  const tr = data[startIdx], tg = data[startIdx+1], tb = data[startIdx+2];
  const tol2 = tolerance*tolerance;
  const fr = fillColor.r, fg = fillColor.g, fb = fillColor.b;
  const matches = (p)=>{
    const i = p*4;
    const dr=data[i]-tr, dg=data[i+1]-tg, db=data[i+2]-tb;
    return dr*dr+dg*dg+db*db <= tol2;
  };
  const visited = new Uint8Array(w*h);
  const stack = [startX, startY]; // graines à plat : x, y, x, y…
  while(stack.length){
    const y = stack.pop(), x = stack.pop();
    const rowStart = y*w;
    if (visited[rowStart+x] || !matches(rowStart+x)) continue;
    let xl = x;
    while (xl > 0 && !visited[rowStart+xl-1] && matches(rowStart+xl-1)) xl--;
    let xr = x;
    while (xr < w-1 && !visited[rowStart+xr+1] && matches(rowStart+xr+1)) xr++;
    for (let xi = xl; xi <= xr; xi++){
      const p = rowStart+xi, i = p*4;
      visited[p] = 1;
      data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
    }
    // Lignes du dessus (d=-1) et du dessous (d=+1) : une graine par segment contigu à remplir.
    for (let d = -1; d <= 1; d += 2){
      const ny = y + d;
      if (ny < 0 || ny >= h) continue;
      const nRow = ny*w;
      let inSpan = false;
      for (let xi = xl; xi <= xr; xi++){
        const ok = !visited[nRow+xi] && matches(nRow+xi);
        if (ok && !inSpan){ stack.push(xi, ny); inSpan = true; }
        else if (!ok) inSpan = false;
      }
    }
  }
  ctx.putImageData(imgData,0,0);
}

/* ---------------------------- Outils de découpe (pixels réels) ---------------- */
// Les outils de découpe ne recadrent pas via un clip Konva (peu fiable) : ils effacent
// réellement les pixels hors de la zone sélectionnée dans le canevas source du plan,
// via composition "destination-in". Le résultat est donc identique à l'écran et à l'export.
// Une zone dessinée n'est jamais appliquée immédiatement : un aperçu (trace fantôme)
// s'affiche d'abord, et la découpe n'est effectuée qu'après validation explicite.
let cutRectStart = null;
let cutTargetPlanId = null; // plan visé par la découpe en cours (déterminé au premier contact)
let pendingCutPolygon = null; // points {x,y} en attente de validation

function planPixelScale(planNode){
  const canvas = planNaturalCanvases.get(planNode.id());
  return { sx: canvas.width/planNode.width(), sy: canvas.height/planNode.height() };
}
function drawCutPreview(pos){
  ghostGroup.destroyChildren();
  if (activeTool==='cut-rect' && cutRectStart){
    ghostGroup.add(new Konva.Rect({
      x:Math.min(cutRectStart.x,pos.x), y:Math.min(cutRectStart.y,pos.y),
      width:Math.abs(pos.x-cutRectStart.x), height:Math.abs(pos.y-cutRectStart.y),
      stroke:'#0E6FA8', dash:[6,4], fill:'rgba(14,111,168,0.08)'
    }));
  } else if (activeTool==='cut-point' && cutPoints.length>0){
    const pts = cutPoints.flat();
    ghostGroup.add(new Konva.Line({points:[...pts,pos.x,pos.y], stroke:'#0E6FA8', dash:[6,4], closed:false}));
    cutPoints.forEach(pt=>ghostGroup.add(new Konva.Circle({x:pt[0],y:pt[1],radius:4,fill:'#0E6FA8'})));
  }
  uiLayer.batchDraw();
}
function redrawCutPointsOnly(){
  ghostGroup.destroyChildren();
  if (cutPoints.length>0){
    const pts = cutPoints.flat();
    if (cutPoints.length>1) ghostGroup.add(new Konva.Line({points:pts, stroke:'#0E6FA8', dash:[6,4], closed:false}));
    cutPoints.forEach(pt=>ghostGroup.add(new Konva.Circle({x:pt[0],y:pt[1],radius:4,fill:'#0E6FA8'})));
  }
  uiLayer.batchDraw();
}
let eraserPendingGate = null; // même principe que remoteToolPendingGate, pour la gomme au doigt
stage.on('mousedown touchstart', (e)=>{
  if (isPinching) return;
  if (e.evt && e.evt.touches && e.evt.touches.length>1) return;
  if (isRealTouch(e) && (activeTool==='cut-rect' || activeTool==='cut-point')) return; // gérés par le curseur déporté générique ci-dessus
  if (e.evt && e.evt.cancelable) e.evt.preventDefault();
  if (pendingCutPolygon) return; // une découpe est déjà en attente de validation

  if (isRealTouch(e) && activeTool==='eraser'){
    // Appui long = déplacer le plan (même logique que les autres outils) : on ne démarre
    // pas l'effacement tout de suite, pour laisser une chance à un appui immobile prolongé
    // de basculer en déplacement plutôt qu'en tracé de gomme.
    const t = e.evt.touches[0];
    if (eraserPendingGate) clearTimeout(eraserPendingGate.timer);
    eraserPendingGate = { startX:t.clientX, startY:t.clientY, lastX:t.clientX, lastY:t.clientY, resolved:false, panning:false };
    eraserPendingGate.timer = setTimeout(()=>{
      if (eraserPendingGate){ eraserPendingGate.resolved = true; eraserPendingGate.panning = true; }
    }, PASTILLE_LONGPRESS_MS);
    return;
  }

  // Souris (précise, pas besoin de déport) : comportement direct inchangé.
  const rawPos = stage.getPointerPosition();
  if (!rawPos) return;
  if (activeTool==='cut-rect'){
    const targetNode = planNodeAt(rawPos);
    if (!targetNode){ toast('Cliquez sur un plan pour le découper.'); return; }
    cutTargetPlanId = targetNode.id();
    cutRectStart = rawPos;
  }
  else if (activeTool==='eraser'){
    const targetNode = planNodeAt(rawPos);
    if (!targetNode){ toast('Cliquez sur un plan pour utiliser la gomme.'); return; }
    eraseTargetPlanId = targetNode.id();
    isErasing=true;
    eraseStart = { x:rawPos.x, y:rawPos.y }; // début du trait (v2.1-97) ; l'effacement a lieu au relâchement
    eraseEnd = null;
    targetNode.clearCache();
    renderEraserGhost(rawPos);
  }
});
// Démarre réellement le tracé de gomme à la position donnée (facteur commun entre un
// mouvement rapide détecté pendant l'attente, et un relâchement rapide sans mouvement).
// v2.1-97 : "origin" = point du premier contact (le début du trait est la pointe au-dessus de CE point,
// même si le curseur n'a été créé qu'après un petit déplacement du doigt) ; aucun effacement ici.
function startEraseAt(rawPos, origin){
  const targetNode = planNodeAt(origin || rawPos);
  if (!targetNode){ toast('Touchez un plan pour utiliser la gomme.'); return; }
  eraseTargetPlanId = targetNode.id();
  eraseStart = remoteTipFromHandlePos(origin || rawPos);
  eraseEnd = null;
  remoteCursor = { tool:'eraser', tip: remoteTipFromHandlePos(rawPos) };
  isErasing = true;
  targetNode.clearCache();
  drawRemoteCursor();
}
stage.on('mousemove touchmove', (e)=>{
  if (isPinching) return;
  if (e.evt && e.evt.touches && e.evt.touches.length>1) return;
  if (isRealTouch(e) && (activeTool==='cut-rect' || activeTool==='cut-point')) return;
  if (isRealTouch(e) && eraserPendingGate && !eraserPendingGate.resolved){
    const t = e.evt.touches && e.evt.touches[0];
    if (!t) return;
    const moved = Math.hypot(t.clientX-eraserPendingGate.startX, t.clientY-eraserPendingGate.startY);
    if (moved > PASTILLE_LONGPRESS_MOVE_PX){
      clearTimeout(eraserPendingGate.timer);
      const origin = clientPointToStage(eraserPendingGate.startX, eraserPendingGate.startY);
      eraserPendingGate = null;
      if (e.evt.cancelable) e.evt.preventDefault();
      const rawPos = rawTouchStagePos(e);
      if (rawPos) startEraseAt(rawPos, origin);
    }
    return;
  }
  if (isRealTouch(e) && eraserPendingGate && eraserPendingGate.panning){
    const t = e.evt.touches && e.evt.touches[0];
    if (!t) return;
    if (e.evt.cancelable) e.evt.preventDefault();
    canvasWrapEl.scrollLeft -= (t.clientX - eraserPendingGate.lastX);
    canvasWrapEl.scrollTop -= (t.clientY - eraserPendingGate.lastY);
    eraserPendingGate.lastX = t.clientX; eraserPendingGate.lastY = t.clientY;
    return;
  }
  if (isRealTouch(e) && remoteCursor && remoteCursor.tool==='eraser'){
    if (e.evt && e.evt.cancelable) e.evt.preventDefault();
    const rawPos = rawTouchStagePos(e);
    if (!rawPos) return;
    scheduleRemoteCursorMove(rawPos); // met à jour la pointe visée + effacement continu (rAF)
    return;
  }
  if ((activeTool==='cut-rect' && cutRectStart) || (activeTool==='eraser' && isErasing)){
    if (e.evt && e.evt.cancelable) e.evt.preventDefault();
  }
  const pos = stage.getPointerPosition();
  if (!pos) return;
  if (activeTool==='cut-rect' && cutRectStart){ drawCutPreview(pos); }
  // gomme : l'aperçu du trait est mis à jour par updateGhost (v2.1-97), rien à effacer pendant le glissement
});
stage.on('mouseup touchend touchcancel', (e)=>{
  if (isRealTouch(e) && (activeTool==='cut-rect' || activeTool==='cut-point')) return;
  if (isRealTouch(e) && eraserPendingGate){
    const wasPanning = eraserPendingGate.panning;
    clearTimeout(eraserPendingGate.timer);
    eraserPendingGate = null;
    if (!wasPanning){
      // Relâché rapidement, sans avoir assez bougé ni assez attendu : comportement
      // d'origine, un petit point de gomme là où le doigt vient de se lever.
      const ct = e.evt.changedTouches && e.evt.changedTouches[0];
      if (ct){
        const rawPos = clientPointToStage(ct.clientX, ct.clientY);
        startEraseAt(rawPos);
        if (eraseStart) finishErase(eraseStart); // appui bref : une tache à la taille de la gomme
        remoteCursor = null; drawRemoteCursor();
      }
    }
    return;
  }
  const usingRemoteCursor = isRealTouch(e) && remoteCursor && remoteCursor.tool==='eraser';
  const pos = usingRemoteCursor ? remoteCursor.tip : stage.getPointerPosition();
  if (!pos){
    // sur certains appareils, la position du dernier point touché n'est plus disponible
    // après touchend : on annule proprement plutôt que de planter.
    if (activeTool==='eraser' && isErasing) finishErase(null); // dernière position connue, sinon simple tache
    cutRectStart = null;
    if (usingRemoteCursor){ remoteCursor = null; drawRemoteCursor(); }
    return;
  }
  if (activeTool==='cut-rect' && cutRectStart){
    const rectPts = [
      {x:Math.min(cutRectStart.x,pos.x), y:Math.min(cutRectStart.y,pos.y)},
      {x:Math.max(cutRectStart.x,pos.x), y:Math.min(cutRectStart.y,pos.y)},
      {x:Math.max(cutRectStart.x,pos.x), y:Math.max(cutRectStart.y,pos.y)},
      {x:Math.min(cutRectStart.x,pos.x), y:Math.max(cutRectStart.y,pos.y)},
    ];
    cutRectStart = null;
    const w = Math.abs(rectPts[2].x-rectPts[0].x), h = Math.abs(rectPts[2].y-rectPts[0].y);
    if (w>4 && h>4) showCutConfirm(rectPts);
    else { ghostGroup.destroyChildren(); uiLayer.batchDraw(); }
  } else if (activeTool==='eraser' && isErasing){
    finishErase(pos);
  }
  if (usingRemoteCursor){ remoteCursor = null; drawRemoteCursor(); }
});
stage.on('click tap', (e)=>{
  if (activeTool==='cut-point' && !pendingCutPolygon){
    if (isRealTouch(e)) return; // le tactile passe par le curseur déporté générique (touchstart/touchmove/touchend)
    if (e.target !== stage && e.target.getLayer() !== planLayer) return;
    const pos = stage.getPointerPosition();
    if (!pos) return;
    if (cutPoints.length===0){
      const targetNode = planNodeAt(pos);
      if (!targetNode){ toast('Cliquez sur un plan pour le découper.'); return; }
      cutTargetPlanId = targetNode.id();
    }
    cutPoints.push([pos.x,pos.y]);
    drawCutPreview(pos);
    updatePointCutBar();
  }
});
// Replie une barre flottante (position:fixed : validation de découpe, barre de points,
// bouton de validation de texte…) pour qu'elle reste toujours entièrement visible à
// l'écran, quels que soient le défilement/zoom du plan ou la taille de l'écran. Sans
// cela, une barre calculée près d'un bord (ou masquée sous le bandeau du haut) pourrait
// apparaître partiellement, voire totalement, hors de la zone visible.
function keepFixedBarInViewport(el){
  const topbar = document.getElementById('topbar');
  const topLimit = (topbar ? topbar.getBoundingClientRect().bottom : 0) + 8;
  const margin = 8;
  const r = el.getBoundingClientRect();
  let dx = 0, dy = 0;
  if (r.right > window.innerWidth - margin) dx = (window.innerWidth - margin) - r.right;
  if (r.left + dx < margin) dx = margin - r.left;
  if (r.bottom > window.innerHeight - margin) dy = (window.innerHeight - margin) - r.bottom;
  if (r.top + dy < topLimit) dy = topLimit - r.top;
  if (dx || dy){
    const curLeft = parseFloat(el.style.left) || 0;
    const curTop = parseFloat(el.style.top) || 0;
    el.style.left = (curLeft + dx) + 'px';
    el.style.top = (curTop + dy) + 'px';
  }
}
function updatePointCutBar(){
  const bar = document.getElementById('pointCutBar');
  if (activeTool!=='cut-point' || cutPoints.length===0 || pendingCutPolygon){
    bar.style.display = 'none';
    updateCanvasBottomReserve();
    return;
  }
  document.getElementById('pointCutCount').textContent = cutPoints.length + (cutPoints.length>1?' points':' point');
  document.getElementById('pointCutClose').disabled = cutPoints.length<3;
  bar.style.display = 'flex'; // position gérée entièrement par CSS (toujours ancrée en bas de l'écran)
  updateCanvasBottomReserve();
}
document.getElementById('pointCutUndo').addEventListener('click', ()=>{
  cutPoints.pop();
  redrawCutPointsOnly();
  updatePointCutBar();
});
document.getElementById('pointCutCancel').addEventListener('click', ()=>{
  cutPoints = [];
  ghostGroup.destroyChildren(); uiLayer.batchDraw();

});
document.getElementById('pointCutClose').addEventListener('click', ()=>{
  if (cutPoints.length>2){
    showCutConfirm(cutPoints.map(p=>({x:p[0],y:p[1]})));
    cutPoints=[];

});
function showCutConfirm(polygonPts){
  pendingCutPolygon = polygonPts;
  ghostGroup.destroyChildren();
  // assombrit tout le plan sauf la zone sélectionnée (trace fantôme de la découpe)
  const overlay = new Konva.Shape({
    listening:false,
    sceneFunc:(ctx, shapeNode)=>{
      ctx.beginPath();
      ctx.rect(0,0,stage.width(),stage.height());
      polygonPts.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y); });
      ctx.closePath();
      ctx.fillStyle = 'rgba(20,26,40,0.5)';
      ctx.fill('evenodd');
    }
  });
  ghostGroup.add(overlay);
  ghostGroup.add(new Konva.Line({
    points: polygonPts.flatMap(p=>[p.x,p.y]), closed:true,
    stroke:'#0E6FA8', strokeWidth:2, dash:[6,4], listening:false
  }));
  uiLayer.batchDraw();
  const bar = document.getElementById('cutConfirmBar');
  bar.style.display = 'flex'; // position gérée entièrement par CSS (toujours ancrée en bas de l'écran)
  updateCanvasBottomReserve();
}
function hideCutConfirm(){
  pendingCutPolygon = null;
  const bar = document.getElementById('cutConfirmBar');
  if (bar) bar.style.display = 'none';
  updateCanvasBottomReserve();
  ghostGroup.destroyChildren(); uiLayer.batchDraw();
  updatePointCutBar();
}
document.getElementById('cutConfirmYes').addEventListener('click', ()=>{
  if (pendingCutPolygon) applyCutPolygon(pendingCutPolygon);
  hideCutConfirm();
});
document.getElementById('cutConfirmNo').addEventListener('click', ()=>{
  hideCutConfirm();
  // Découpe annulée : si l'outil ciseaux est resté sélectionné, on réaffiche aussitôt le
  // curseur déporté pour permettre de recommencer sans repasser par l'icône.
  if (activeTool==='cut-rect' && isTouchCapableDevice()){ remoteCursor = { tool:'cut-rect', phase:'start', tip: viewportCenterStagePos() }; drawRemoteCursor(); }
  else if (activeTool==='cut-point' && isTouchCapableDevice()){ remoteCursor = { tool:'cut-point', tip: viewportCenterStagePos() }; drawRemoteCursor(); }
});
function applyCutPolygon(pointsStage){
  const planNode = planImageNodes.get(cutTargetPlanId);
  const canvas = planNaturalCanvases.get(cutTargetPlanId);
  const pl = findPlanById(cutTargetPlanId);
  if (!planNode || !canvas || !pl){ toast('Sélectionnez un plan avant de découper.'); return; }
  const { sx, sy } = planPixelScale(planNode);
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.globalCompositeOperation = 'destination-in';
  ctx.beginPath();
  let localMinX=Infinity, localMinY=Infinity, localMaxX=-Infinity, localMaxY=-Infinity;
  pointsStage.forEach((pt,i)=>{
    const local = toLocal(planNode, pt.x, pt.y);
    localMinX = Math.min(localMinX, local.x); localMaxX = Math.max(localMaxX, local.x);
    localMinY = Math.min(localMinY, local.y); localMaxY = Math.max(localMaxY, local.y);
    const px = local.x*sx, py = local.y*sy;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Le cadre (position/taille utilisées pour la sélection et les poignées de
  // redimensionnement) est réajusté sur la zone réellement découpée, au lieu de rester aux
  // dimensions de l'image d'origine : sinon un grand cadre invisible (zone transparente)
  // continuait d'occuper l'espace et de répondre au clic/redimensionnement.
  localMinX = Math.max(0, localMinX); localMinY = Math.max(0, localMinY);
  localMaxX = Math.min(planNode.width(), localMaxX); localMaxY = Math.min(planNode.height(), localMaxY);
  const newW = Math.max(1, localMaxX-localMinX), newH = Math.max(1, localMaxY-localMinY);
  const srcX = Math.round(localMinX*sx), srcY = Math.round(localMinY*sy);
  const srcW = Math.max(1, Math.round(newW*sx)), srcH = Math.max(1, Math.round(newH*sy));
  const newAbsPos = planNode.getAbsoluteTransform().point({x:localMinX, y:localMinY});

  const cropped = document.createElement('canvas');
  cropped.width = srcW; cropped.height = srcH;
  cropped.getContext('2d').drawImage(canvas, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);

  pl.x = newAbsPos.x;
  pl.y = newAbsPos.y;
  pl.width = newW;
  pl.height = newH;
  pl.dataURL = cropped.toDataURL('image/png');
  setPlanCanvas(cutTargetPlanId, cropped, pl.dataURL); // image pleine définition + copie réduite pour l'écran
  planNode._forceRefresh = true;
  pushHistory(); render();
  if (activeTool==='cut-rect' || activeTool==='cut-point') setTool(activeTool); // désactive l'outil actif (bascule vers aucun outil)
  toast('Découpe appliquée : le cadre a été ajusté à la zone découpée.');
}

/* ---------------------------- Gomme ------------------------------------------- */
let isErasing = false;
let eraseTargetPlanId = null; // plan visé par le tracé de gomme en cours (déterminé au premier contact)
// ---------------------------------------------------------------------------------------------------
// Gomme en TRAIT (v2.1-97) : début au premier contact, effacement au relâchement.
let eraserShape = 'square';       // 'square' | 'round'
let eraseStart = null;            // début du trait (coordonnées feuille) pendant un appui
let eraseEnd = null;              // dernier point visé (après accroche), pour un relâchement sans position
const ERASE_SNAP_DEG = 2;         // accroche horizontale / verticale à ± 2° (v2.1-98 : était 5°, trop large)
function eraserBrush(){ return parseInt(document.getElementById('rngEraserSize').value,10); }
// Accroche H/V : si le trait est à moins de ERASE_SNAP_DEG d'une direction horizontale ou verticale, il s'y cale.
function snapEraseEnd(a, b){
  const dx = b.x-a.x, dy = b.y-a.y;
  if (!dx && !dy) return b;
  const ang = Math.atan2(dy, dx)*180/Math.PI;
  const nearest = Math.round(ang/90)*90;
  if (Math.abs(ang-nearest) <= ERASE_SNAP_DEG) return (nearest%180===0) ? {x:b.x, y:a.y} : {x:a.x, y:b.y};
  return b;
}
// Enveloppe convexe (chaîne monotone) : le balayage d'un carré le long d'un segment = enveloppe des deux carrés d'extrémité.
function convexHull(P){
  const seen = new Set();
  P = P.filter(p=>{ const k = p[0]+','+p[1]; if (seen.has(k)) return false; seen.add(k); return true; }); // points doublons (tache : a == b) écartés
  P = P.sort((p,q)=>p[0]-q[0] || p[1]-q[1]);
  const cross = (o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo = []; for (const p of P){ while (lo.length>=2 && cross(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  const up = []; for (let i=P.length-1;i>=0;i--){ const p=P[i]; while (up.length>=2 && cross(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Efface le trait a -> b (coordonnées feuille) sur le plan visé ; a == b donne une simple tache.
function eraseStroke(a, b){
  if (!eraseTargetPlanId) return;
  const planNode = planImageNodes.get(eraseTargetPlanId);
  const canvas = planNaturalCanvases.get(eraseTargetPlanId);
  if (!planNode || !canvas) return;
  const { sx, sy } = planPixelScale(planNode);
  const la = toLocal(planNode, a.x, a.y), lb = toLocal(planNode, b.x, b.y);
  const A = {x:la.x*sx, y:la.y*sy}, B = {x:lb.x*sx, y:lb.y*sy};
  const brush = eraserBrush(), hw = (brush*sx)/2, hh = (brush*sy)/2;
  // La gomme peint avec la couleur de la pipette (bucketColor), pour se fondre dans le fond du plan.
  const paint = (ctx, k)=>{
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = bucketColor; ctx.strokeStyle = bucketColor;
    if (eraserShape === 'round'){
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2*hw*k;
      ctx.beginPath(); ctx.moveTo(A.x*k, A.y*k); ctx.lineTo(B.x*k, B.y*k); ctx.stroke();
      ctx.beginPath(); ctx.arc(A.x*k, A.y*k, hw*k, 0, 2*Math.PI); ctx.fill();
      ctx.beginPath(); ctx.arc(B.x*k, B.y*k, hw*k, 0, 2*Math.PI); ctx.fill();
    } else {
      const hull = convexHull([A,B].flatMap(p=>[[p.x-hw,p.y-hh],[p.x+hw,p.y-hh],[p.x+hw,p.y+hh],[p.x-hw,p.y+hh]]));
      ctx.beginPath(); hull.forEach((q,i)=> i ? ctx.lineTo(q[0]*k, q[1]*k) : ctx.moveTo(q[0]*k, q[1]*k)); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  };
  paint(canvas.getContext('2d'), 1);
  // L'écran affiche la copie RÉDUITE (makeDisplayCanvas) : même tracé à l'échelle ; elle est régénérée
  // proprement depuis l'image pleine définition à la fin (commitPlanPixelEdit).
  const dispCanvas = planDisplayCanvases.get(eraseTargetPlanId);
  if (dispCanvas && dispCanvas !== canvas) paint(dispCanvas.getContext('2d'), dispCanvas.width/canvas.width);
  planLayer.batchDraw();
}
// Aperçu : forme de la gomme sous le pointeur, ou trait du point de départ jusqu'au pointeur pendant un appui.
function renderEraserGhost(tip){
  ghostGroup.destroyChildren();
  const brush = eraserBrush(), h = brush/2;
  const common = { fill:bucketColor, opacity:0.55, stroke:'#C0392B', strokeWidth:1.5, dash:[4,3], listening:false };
  const shapeAt = (p)=> eraserShape==='round'
    ? new Konva.Circle(Object.assign({x:p.x, y:p.y, radius:h}, common))
    : new Konva.Rect(Object.assign({x:p.x-h, y:p.y-h, width:brush, height:brush}, common));
  if (isErasing && eraseStart){
    const end = snapEraseEnd(eraseStart, tip); eraseEnd = end;
    if (eraserShape === 'round'){
      ghostGroup.add(new Konva.Line({points:[eraseStart.x,eraseStart.y,end.x,end.y], stroke:bucketColor, strokeWidth:brush, lineCap:'round', opacity:0.55, listening:false}));
      ghostGroup.add(shapeAt(eraseStart)); ghostGroup.add(shapeAt(end));
    } else {
      const hull = convexHull([eraseStart,end].flatMap(p=>[[p.x-h,p.y-h],[p.x+h,p.y-h],[p.x+h,p.y+h],[p.x-h,p.y+h]]));
      ghostGroup.add(new Konva.Line(Object.assign({points:hull.flat(), closed:true}, common)));
    }
    ghostGroup.add(new Konva.Line({points:[eraseStart.x,eraseStart.y,end.x,end.y], stroke:'#C0392B', strokeWidth:1, listening:false}));
  } else {
    ghostGroup.add(shapeAt(tip));
  }
  uiLayer.batchDraw();
}
// Relâchement : on efface le trait (ou une tache si le pointeur n'a pas bougé), puis un seul pushHistory.
function finishErase(pos){
  if (!isErasing) return;
  isErasing = false;
  if (eraseStart){
    let end = pos ? snapEraseEnd(eraseStart, pos) : (eraseEnd || eraseStart);
    if (pos && Math.hypot(pos.x-eraseStart.x, pos.y-eraseStart.y) < 3) end = eraseStart; // simple clic = tache
    eraseStroke(eraseStart, end);
  }
  eraseStart = null; eraseEnd = null;
  closeAllTileDrawers(); // v2.1-101 : le tiroir se replie dès qu'on utilise la gomme
  ghostGroup.destroyChildren(); uiLayer.batchDraw();
  const canvas = planNaturalCanvases.get(eraseTargetPlanId);
  const pl = findPlanById(eraseTargetPlanId);
  if (canvas && pl) commitPlanPixelEdit(eraseTargetPlanId);
}
// Réglages de la gomme (forme, taille avec − / + et témoin) — v2.1-97.
function updateEraserUI(){
  const brush = eraserBrush();

  document.getElementById('btnEraserSquare').classList.toggle('active', eraserShape==='square');

}
document.getElementById('toolResetCuts').addEventListener('click', async ()=>{

/* ---------------------------- Import du/des plan(s) --------------------------- */
document.getElementById('toolImportPlan').addEventListener('click', ()=>document.getElementById('fileInputPlan').click());
document.getElementById('fileInputPlan').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  const dataURL = await fileToDataURL(file);
  await importPlanImageFromDataURL(dataURL, file.name);
  toast(file.name+' importé.');
  e.target.value='';
});
// Réutilisée à la fois par l'import via bouton et par le collage (Ctrl/Cmd+V) d'une image
// copiée ailleurs (clic droit "Copier l'image", capture d'écran, etc.). Ajoute un NOUVEAU
// plan à la page courante à chaque appel (un import ne remplace plus les plans déjà
// présents) : on peut ainsi accumuler autant de plans que nécessaire sur une même page.
async function importPlanImageFromDataURL(dataURL, fileName){
  const imgEl = await loadImage(dataURL);
  const maxW = stage.width()*0.85, maxH = stage.height()*0.85;
  const ratio = Math.min(maxW/imgEl.width, maxH/imgEl.height, 1);
  const canvas = document.createElement('canvas');
  canvas.width = imgEl.width; canvas.height = imgEl.height;
  canvas.getContext('2d').drawImage(imgEl,0,0);
  // Petit décalage en cascade si plusieurs plans se superposent, pour qu'ils restent tous
  // repérables et attrapables individuellement dès l'import, avant tout réarrangement manuel.
  const offset = (model.plans.length % 6) * 24;
  const pl = {
    id: nextId('plan-'), dataURL, originalDataURL: dataURL,
    x:(stage.width()-imgEl.width*ratio)/2 + offset, y:(stage.height()-imgEl.height*ratio)/2 + offset,
    width:imgEl.width*ratio, height:imgEl.height*ratio, rotation:0, locked:false,
    brightness:0, contrast:0, saturation:0, hue:0,
    name: fileName ? cleanFileName(fileName.replace(/\.[^.]+$/,'')) : '' // v2.1-81 : sert à pré-remplir le nom du document
  };
  pl.originalX = pl.x; pl.originalY = pl.y;
  pl.originalWidth = pl.width; pl.originalHeight = pl.height;
  model.plans.push(pl);
  setPlanCanvas(pl.id, canvas, dataURL); // image pleine définition (export) + copie réduite (écran)
  await autoInsertCompanyLogo();
  await autoInsertClientLogoPlaceholder();
  selectedId = pl.id;
  pushHistory(); render();
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = rej;
    img.src = src;
  });
}
// Collage (Cmd+V sur Mac, Ctrl+V sur PC) d'une image copiée ailleurs (clic droit → Copier
// l'image, capture d'écran, etc.) : importée directement comme nouveau plan de la page
// courante, exactement comme avec le bouton d'import. Ignoré si le focus est dans un champ
// de texte, pour ne pas gêner un collage de texte normal (renommage de pastille, saisie…).
window.addEventListener('paste', async (e)=>{
  const active = document.activeElement;
  const typing = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
  if (typing) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let imageItem = null;
  for (const item of items){ if (item.type && item.type.startsWith('image/')){ imageItem = item; break; } }
  if (!imageItem) return;
  e.preventDefault();
  const blob = imageItem.getAsFile();
  if (!blob) return;
  try{
    const dataURL = await fileToDataURL(blob);
    await importPlanImageFromDataURL(dataURL);
    toast('Image collée importée comme plan.');
  } catch(err){ toast("Impossible d'importer l'image collée."); }
});
// Recharge le(s) canevas pixel (pipette/pot/gomme/découpe) depuis les dataURL du modèle :
// appelée pour un plan précis (id fourni), ou pour TOUS les plans de la page si omis
// (chargement d'un document, restauration de session…).
async function rehydratePlanCanvas(onlyId){
  const targets = onlyId ? model.plans.filter(p=>p.id===onlyId) : model.plans;
  await Promise.all(targets.map(async pl=>{
    // Image inchangée depuis le dernier chargement (même dataURL) : on garde le canevas déjà
    // prêt. Avant, CHAQUE annulation/rétablissement redécodait tous les plans de la page
    // (plusieurs centaines de ms par grosse image sur téléphone), même pour un simple
    // déplacement de pastille annulé (v2.1-64).
    if (planNaturalCanvases.has(pl.id) && planCanvasSource.get(pl.id) === pl.dataURL) return;
    const img = await loadImage(pl.dataURL);
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img,0,0);
    setPlanCanvas(pl.id, canvas, pl.dataURL);
  }));
  if (!onlyId){
    // Nettoie les canevas de plans qui n'existent plus (ex. après un undo/redo).
    const validIds = new Set(model.plans.map(p=>p.id));
    for (const id of [...planNaturalCanvases.keys()]) if (!validIds.has(id)) deletePlanCanvases(id);
  }
}

// "Placement classique" est l'outil PAR DÉFAUT (v2.1-68) : sélectionné à l'ouverture, pour
// chaque nouveau projet, et rétabli dès qu'un autre outil se termine ou est décoché — il y a
// toujours un outil actif. (Pour sélectionner, déplacer ou tourner le plan : outil « Déplacer le plan ».)
const DEFAULT_TOOL = 'place-classic';
// Tuile (tiroir) choisie en dernier : le repli sur "Placement classique" ne vaut que pour la tuile
// Pastille (v2.1-69). Choisir une AUTRE tuile (Page, Vue, Plan, Texte…) désactive les outils de
// pose de pastilles, sinon ils continuaient à coller des pastilles pendant qu'on travaillait ailleurs.
let activeTileId = null; // v2.1-101 : AUCUNE tuile active au démarrage (une seule tuile active à la fois ensuite)
function ensureDefaultTool(){ activeTileId = null; if (activeTool !== null) setTool(activeTool); } // ouverture / nouveau projet : aucune tuile, aucun outil
function onTileChosen(tileId){
  const oldTile = activeTileId;
  activeTileId = tileId; // posé AVANT setTool() : plus de repli automatique sur Placement classique pour l'ancienne tuile
  if (oldTile !== tileId){
    // v2.1-101 : une seule tuile active — les outils de l'ancienne tuile (gomme, pipette, pose…) sont désactivés.
    const cats = oldTile && TILE_TOOL_CATEGORIES[oldTile];
    if (cats && activeTool && cats.includes(activeTool)) setTool(activeTool);
  }
  // v2.1-83/85 : hors de la tuile Plan, un plan resté sélectionné ne doit plus afficher son cadre bleu,
  // ses mains ni la bulle − / + ; il est alors figé.
  if (tileId !== 'plan' && selectedId && findPlanById(selectedId)) selectNode(null, null);
  const isPlacing = activeTool==='place-classic' || activeTool==='place-remote';
  if (tileId === 'pastille' && !isPlacing) setTool(DEFAULT_TOOL); // entrée dans Pastille : Placement classique (ou le déporté s'il était choisi)
  updateMobileTileActiveState();
}
function setTool(name){
  hideBubble(); // une bulle de message ne survit pas à un changement d'outil
  activeTool = (activeTool===name) ? null : name;
  if (activeTool === null && name !== '__none__' && activeTileId === 'pastille') activeTool = DEFAULT_TOOL;
  remoteAnchor = null; cutPoints=[]; cutRectStart=null; isErasing=false;
  remoteCursorDragActive = false; remoteCursorDragOnHandle = false;
  if (remoteCursorRAF){ cancelAnimationFrame(remoteCursorRAF); remoteCursorRAF = null; }
  pendingRemoteCursorPos = null;
  // Les outils de découpe (ciseaux) affichent leur curseur déporté dès leur sélection,
  // avant même tout contact au doigt, pour permettre de bien viser la pointe au tactile ;
  // un simple glisser du cercle blanc suffit ensuite à l'amener au bon endroit.
  if (activeTool==='cut-rect' && isTouchCapableDevice()){ remoteCursor = { tool:'cut-rect', phase:'start', tip: viewportCenterStagePos() }; }
  else if (activeTool==='cut-point' && isTouchCapableDevice()){ remoteCursor = { tool:'cut-point', tip: viewportCenterStagePos() }; }
  else { remoteCursor = null; }
  drawRemoteCursor();
  hideCutConfirm();
  document.querySelectorAll('.tb-icon, .pop-tool-btn').forEach(b=>b.classList.remove('active'));
  // Ce nettoyage retire aussi la surbrillance d'icônes qui ne sont pas des outils (orientation,
  // légende) : on la rétablit ici (v2.1-68), sinon elle disparaissait à chaque changement d'outil.
  updateOrientButtons();
  document.getElementById('toolToggleLegend').classList.toggle('active', model.legend.visible);
  const map = {
    'pipette':'toolPipette','paint-bucket':'toolPaintBucket','eraser':'toolEraser',
    'cut-rect':'toolCutRect','cut-point':'toolCutPoint',
    'place-classic':'toolPlaceClassic','place-remote':'toolPlaceRemote'
  };
  if (activeTool && map[activeTool]) document.getElementById(map[activeTool]).classList.add('active');
  // La grille sert de point d'ancrage au placement déporté : elle apparaît automatiquement
  // (au premier plan, au-dessus du plan/des pastilles) tant que cet outil est actif, et se
  // remasque en le quittant — sauf si l'utilisateur l'a lui-même affichée via son icône.
  if (activeTool === 'place-remote'){
    if (!gridVisible){ gridVisible = true; gridAutoShown = true; }
  } else if (gridAutoShown){
    gridVisible = false; gridAutoShown = false;
  }
  document.getElementById('btnGrid').classList.toggle('active', gridVisible);
  updateGridButton();
  setGridVisible(gridVisible);
  if (activeTool !== 'paint-bucket') document.getElementById('bucketToleranceRow').style.display='none';
  if (activeTool !== 'eraser') document.getElementById('eraserSizeRow').style.display='none';
  if (activeTool==='paint-bucket'){ document.getElementById('bucketToleranceRow').style.display='flex'; }
  if (activeTool==='eraser'){ document.getElementById('eraserSizeRow').style.display='flex'; updateEraserUI(); }
  const container = document.getElementById('konvaContainer');
  container.classList.toggle('pipette-active', activeTool==='pipette');
  container.classList.toggle('cutting-active', ['cut-rect','cut-point','eraser'].includes(activeTool));
  ghostGroup.destroyChildren(); uiLayer.batchDraw();
  renderPlan(); // recalcule si le plan doit rester draggable selon l'outil actif
  if (typeof updateRotateIcons === 'function') updateRotateIcons(); // mains et bulle − / + selon l'outil actif (v2.1-82)
  // layoutHeader() recalcule juste la hauteur du bandeau (peut changer selon l'outil actif) ;
  // fitZoom() a été retiré d'ici : changer d'outil ne doit JAMAIS réinitialiser le zoom en
  // cours (c'était très gênant en pratique, ex. en renommant plusieurs pastilles à la
  // suite, le zoom retombait à chaque fois à son niveau le plus large).
  layoutHeader();
  if (typeof updateMobileTileActiveState === 'function') updateMobileTileActiveState();
  // v2.1-100 : Gomme et Pot ont des réglages (forme, taille, tolérance) : le tiroir Plan reste ouvert pour
  // les régler, et se referme seul après 5 s d'inactivité.
  if ((activeTool==='eraser' || activeTool==='paint-bucket') && document.querySelector('.tb-group[data-tile="plan"].mobile-open')){
    schedulePastilleDrawerClose();
  } else if (typeof closeAllTileDrawers === 'function') closeAllTileDrawers();
}

async function handleLogoFile(e, which){
  const file = e.target.files[0]; if (!file) return;
  const dataURL = await fileToDataURL(file);
  const img = await loadImage(dataURL);
  const maxW = which==='entreprise' ? 240 : 160, maxH = which==='entreprise' ? 150 : 100;
  const ratio = Math.min(maxW/img.width, maxH/img.height, 1);
  // Un remplacement manuel retire l'ancien logo de la même catégorie plutôt que de
  // s'ajouter à côté : on ne veut jamais deux logos "entreprise" superposés, et un logo
  // client réel doit remplacer le placeholder "logo Cie" plutôt que de s'y ajouter.
  const old = model.logos.find(l=>l.which===which);
  const sheetW = model.orientation==='portrait' ? SHEET_W : SHEET_H;
  const x = old ? old.x : (which==='client' ? sheetW-160-40 : 40);
  const y = old ? old.y : 40;
  const locked = old ? !!old.locked : true; // verrouillé par défaut, comme les autres éléments de coin (voir createEmptyModel)
  model.logos = model.logos.filter(l=>l.which!==which);
  model.logos.push({ id: nextId('logo-'), which, dataURL, x, y, width:img.width*ratio, height:img.height*ratio, rotation:0, locked });
  pushHistory(); render();
  e.target.value='';
}
