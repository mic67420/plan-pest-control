    card.style.top = ((r && r.height ? r.bottom : 58) + 6)+'px';
    card.innerHTML = '<div style="font-weight:700;">Quelle page du PDF importer ?</div>';
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff7e6;border-radius:8px;padding:8px;max-height:50vh;overflow:auto;';
    const done = (v)=>{ card.remove(); resolve(v); };
    for (let i=1; i<=doc.numPages; i++){
      const b = document.createElement('button'); b.type = 'button'; b.dataset.page = i;
      b.style.cssText = 'font:inherit;border:1px solid #d8dce3;background:#fff;border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;';
      const cv = document.createElement('canvas'); cv.width = 90; cv.height = 120; cv.style.cssText = 'width:90px;height:120px;background:#eee;';
      const lb = document.createElement('span'); lb.textContent = 'Page '+i;
      b.append(cv, lb); b.addEventListener('click', ()=>done(i)); grid.appendChild(b);
    }
    card.appendChild(grid);
    const row = document.createElement('div'); row.style.cssText = 'display:flex;justify-content:flex-end;';
    const no = document.createElement('button'); no.type = 'button'; no.textContent = 'Annuler';
    no.style.cssText = 'font:inherit;padding:8px 14px;border:none;border-radius:8px;background:#fff7e6;color:#1c2230;';
    no.addEventListener('click', ()=>done(null)); row.appendChild(no); card.appendChild(row);
    document.body.appendChild(card);
    // vignettes dessinées l'une après l'autre (sans bloquer l'affichage de la fenêtre)
    (async()=>{
      for (let i=1; i<=doc.numPages && card.isConnected; i++){
        try{
          const pg = await doc.getPage(i), v1 = pg.getViewport({ scale:1 });
          const k = Math.min(90/v1.width, 120/v1.height), cv = grid.children[i-1].querySelector('canvas');
          cv.width = Math.round(v1.width*k); cv.height = Math.round(v1.height*k);
          await pg.render({ canvasContext:cv.getContext('2d'), viewport:pg.getViewport({ scale:k }) }).promise;
        } catch(e){ /* vignette manquante : sans conséquence */ }
      }
    })();
  });
}
// v2.1-132 : le premier import télécharge pdf.js (~1 Mo) : sans message, on croyait que « rien ne se passait ». Une bulle
// « Lecture du PDF… » reste affichée pendant le chargement, et les erreurs disent POURQUOI (réseau, fichier protégé…).
async function pdfToImageDataURL(file, choosePage){
  showBubble('Lecture du PDF…');
  let doc;
  try{
    // v2.1-133 : le fichier est lu TOUT DE SUITE, avant le téléchargement de pdf.js. Sur Android, le fichier choisi
    // (document Drive, Téléchargements…) devient illisible au bout de quelques secondes : relu après le chargement de
    // la bibliothèque, il arrivait « vide, taille zéro octet » (constaté par Mic).
    const buf = new Uint8Array(await file.arrayBuffer());
    if (!buf.length) throw new Error('fichier vide : choisissez-le depuis « Téléchargements » ou téléchargez-le d\'abord sur le téléphone');
    const lib = await loadPdfLib();
    try{
      doc = await lib.getDocument({ data:buf.slice() }).promise; // copie : pdf.js « transfère » (vide) le tampon qu'on lui donne
    } catch(e1){
      // 2e voie, sans transfert de tampon : le PDF est donné par adresse locale (blob:), lue par pdf.js lui-même (v2.1-135)
      console.warn('Import PDF, 1re voie :', e1);
      const u = URL.createObjectURL(new Blob([buf], { type:'application/pdf' }));
      try{ doc = await lib.getDocument({ url:u }).promise; } finally { setTimeout(()=>URL.revokeObjectURL(u), 60000); }
    }
  } catch(err){
    hideBubble();
    console.warn('Import PDF :', err);
    const msg = (err && err.name === 'PasswordException') ? 'PDF protégé par mot de passe.'
      : (/réseau|Failed to fetch|NetworkError|indisponible/i.test(String(err && err.message))) ? 'PDF : bibliothèque de lecture non téléchargée (vérifiez le réseau).'
      : 'PDF illisible : '+String(err && err.message || err).slice(0,80)+' [v2.1-135, '+(file.size|0)+' o]';
    throw Object.assign(new Error(msg), { userMessage: msg });
  }
  hideBubble();
  let n = 1;
  if (choosePage && doc.numPages > 1){ n = await askPdfPage(doc); if (!n) throw new ImportCancelled('annulé'); }
  showBubble('Création du plan…');
  try{
    return await renderPdfPage(doc, n);
  } finally { hideBubble(); }
}
async function renderPdfPage(doc, n){
  const page = await doc.getPage(n), v1 = page.getViewport({ scale:1 });
  const k = Math.min(4, 2400/Math.max(v1.width, v1.height));
  const vp = page.getViewport({ scale:k });
  const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
  return cv.toDataURL('image/png');
}
let heicLibPromise = null;
function loadHeicLib(){
  if (window.heic2any) return Promise.resolve(window.heic2any);
  if (!heicLibPromise) heicLibPromise = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    sc.onload = ()=>window.heic2any ? res(window.heic2any) : rej(new Error('heic2any absent'));
    sc.onerror = ()=>{ heicLibPromise = null; rej(new Error('heic2any indisponible (réseau ?)')); };
    document.head.appendChild(sc);
  });
  return heicLibPromise;
}
function canvasToDataURL(img, w, h, mime){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  if (mime === 'image/jpeg'){ x.fillStyle = '#ffffff'; x.fillRect(0,0,w,h); } // pas de transparence en JPEG
  x.drawImage(img, 0, 0, w, h);
  return c.toDataURL(mime, 0.92);
}
async function svgToPngDataURL(file){
  let text = await file.text();
  const root = /<svg\b[^>]*>/i.exec(text);
  if (!root) throw new Error('SVG invalide');
  const tag = root[0];
  const num = (re)=>{ const m = re.exec(tag); return m ? parseFloat(m[1]) : NaN; };
  let w = num(/\swidth\s*=\s*["']?([\d.]+)/i), h = num(/\sheight\s*=\s*["']?([\d.]+)/i);
  const vb = /viewBox\s*=\s*["']\s*[-\d.]+[ ,]+[-\d.]+[ ,]+([\d.]+)[ ,]+([\d.]+)/i.exec(tag);
  if ((!(w>0) || !(h>0)) && vb){ w = parseFloat(vb[1]); h = parseFloat(vb[2]); }
  if (!(w>0) || !(h>0)){ w = 1000; h = 1000; }
  // Sans width/height explicites, certains navigateurs donnent une taille nulle : on les impose dans la balise.
  if (!/\swidth\s*=/i.test(tag) || !/\sheight\s*=/i.test(tag)){
    text = text.replace(/<svg\b/i, '<svg width="'+w+'" height="'+h+'"');
  }
  const url = URL.createObjectURL(new Blob([text], { type:'image/svg+xml' }));
  try{
    const img = await loadImage(url);
    const k = Math.min(10, 2000/Math.max(w,h)); // ~2000 px sur le grand côté, sans dépasser x10
    return canvasToDataURL(img, Math.max(1,Math.round(w*k)), Math.max(1,Math.round(h*k)), 'image/png');
  } finally { URL.revokeObjectURL(url); }
}
async function fileToImageDataURL(file, opts){
  const name = (file.name||'').toLowerCase(), type = (file.type||'').toLowerCase();
  if (type === 'application/pdf' || name.endsWith('.pdf')) return pdfToImageDataURL(file, !!(opts && opts.pdfChoose));
  if (type === 'image/svg+xml' || name.endsWith('.svg')) return svgToPngDataURL(file);
  const isHeic = /hei[cf]/.test(type) || /\.(heic|heif)$/.test(name);
  let dataURL = await fileToDataURL(file);
  if (!isHeic && (type === 'image/png' || type === 'image/jpeg' || /^data:image\/(png|jpeg);/.test(dataURL))) return dataURL; // déjà dans un format intégrable
  try{
    const img = await loadImage(dataURL); // le navigateur sait lire ce format
    return canvasToDataURL(img, img.naturalWidth, img.naturalHeight, isHeic ? 'image/jpeg' : 'image/png');
  } catch(err){
    if (!isHeic) throw err;
  }
  const heicBlob = await (await fetch(dataURL)).blob(); // copie en mémoire : le fichier d'origine peut devenir illisible pendant le chargement de la bibliothèque (Android)
  const heic2any = await loadHeicLib();
  const out = await heic2any({ blob:heicBlob, toType:'image/jpeg', quality:0.92 });
  const blob = Array.isArray(out) ? out[0] : out;
  return fileToDataURL(blob);
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = rej;
    img.src = src;
  });
}
// Collage (Cmd+V sur Mac, Ctrl+V sur PC) d'une image copiée ailleurs (clic droit → Copier
// l'image, capture d'écran, etc.) : importée directement comme nouveau plan de la page
// courante, exactement comme avec le bouton d'import. Ignoré si le focus est dans un champ
// de texte, pour ne pas gêner un collage de texte normal (renommage de pastille, saisie…).
window.addEventListener('paste', async (e)=>{
  const active = document.activeElement;
  const typing = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
  if (typing) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let imageItem = null;
  for (const item of items){ if (item.type && item.type.startsWith('image/')){ imageItem = item; break; } }
  if (!imageItem) return;
  e.preventDefault();
  const blob = imageItem.getAsFile();
  if (!blob) return;
  try{
    const dataURL = await fileToImageDataURL(blob);
    await importPlanImageFromDataURL(dataURL);
    toast('Image collée importée comme plan.');
  } catch(err){ toast("Impossible d'importer l'image collée."); }
});
// Recharge le(s) canevas pixel (pipette/pot/gomme/découpe) depuis les dataURL du modèle :
// appelée pour un plan précis (id fourni), ou pour TOUS les plans de la page si omis
// (chargement d'un document, restauration de session…).
async function rehydratePlanCanvas(onlyId){
  const targets = onlyId ? model.plans.filter(p=>p.id===onlyId) : model.plans;
  await Promise.all(targets.map(async pl=>{
    // Image inchangée depuis le dernier chargement (même dataURL) : on garde le canevas déjà
    // prêt. Avant, CHAQUE annulation/rétablissement redécodait tous les plans de la page
    // (plusieurs centaines de ms par grosse image sur téléphone), même pour un simple
    // déplacement de pastille annulé (v2.1-64).
    if (planNaturalCanvases.has(pl.id) && planCanvasSource.get(pl.id) === pl.dataURL) return;
    const img = await loadImage(pl.dataURL);
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img,0,0);
    setPlanCanvas(pl.id, canvas, pl.dataURL);
  }));
  if (!onlyId){
    // Nettoie les canevas de plans qui n'existent plus (ex. après un undo/redo).
    const validIds = new Set(model.plans.map(p=>p.id));
    for (const id of [...planNaturalCanvases.keys()]) if (!validIds.has(id)) deletePlanCanvases(id);
  }
}

/* ---------------------------- Outils (sélection unique, style radio) ---------- */
// "Placement classique" est l'outil PAR DÉFAUT (v2.1-68) : sélectionné à l'ouverture, pour
// chaque nouveau projet, et rétabli dès qu'un autre outil se termine ou est décoché — il y a
// toujours un outil actif. (Pour sélectionner, déplacer ou tourner le plan : outil « Déplacer le plan ».)
const DEFAULT_TOOL = 'place-classic';
// Tuile (tiroir) choisie en dernier : le repli sur "Placement classique" ne vaut que pour la tuile
// Pastille (v2.1-69). Choisir une AUTRE tuile (Page, Vue, Plan, Texte…) désactive les outils de
// pose de pastilles, sinon ils continuaient à coller des pastilles pendant qu'on travaillait ailleurs.
let activeTileId = null; // v2.1-101 : AUCUNE tuile active au démarrage (une seule tuile active à la fois ensuite)
function ensureDefaultTool(){ activeTileId = null; if (activeTool !== null) setTool(activeTool); } // ouverture / nouveau projet : aucune tuile, aucun outil
function onTileChosen(tileId){
  const oldTile = activeTileId;
  activeTileId = tileId; // posé AVANT setTool() : plus de repli automatique sur Placement classique pour l'ancienne tuile
  if (oldTile !== tileId){
    // v2.1-101 : une seule tuile active — les outils de l'ancienne tuile (gomme, pipette, pose…) sont désactivés.
    const cats = oldTile && TILE_TOOL_CATEGORIES[oldTile];
    if (cats && activeTool && cats.includes(activeTool)) setTool(activeTool);
  }
  // v2.1-83/85 : hors de la tuile Plan, un plan resté sélectionné ne doit plus afficher son cadre bleu,
  // ses mains ni la bulle − / + ; il est alors figé.
  if (tileId !== 'plan' && selectedId && findPlanById(selectedId)) selectNode(null, null);
  const isPlacing = activeTool==='place-classic' || activeTool==='place-remote';
  if (tileId === 'pastille' && !isPlacing) setTool(DEFAULT_TOOL); // entrée dans Pastille : Placement classique (ou le déporté s'il était choisi)
  updateMobileTileActiveState();
}
function setTool(name){
  hideBubble(); // une bulle de message ne survit pas à un changement d'outil
  activeTool = (activeTool===name) ? null : name;
  if (activeTool === null && name !== '__none__' && activeTileId === 'pastille') activeTool = DEFAULT_TOOL;
  remoteAnchor = null; cutPoints=[]; cutRectStart=null; isErasing=false; drawStart=null;
  remoteCursorDragActive = false; remoteCursorDragOnHandle = false;
  if (remoteToolPendingGate){ clearTimeout(remoteToolPendingGate.timer); remoteToolPendingGate = null; } // v2.1-166
  if (remoteCursorRAF){ cancelAnimationFrame(remoteCursorRAF); remoteCursorRAF = null; }
  pendingRemoteCursorPos = null;
  // Les outils de découpe (ciseaux) affichent leur curseur déporté dès leur sélection,
  // avant même tout contact au doigt, pour permettre de bien viser la pointe au tactile ;
  // un simple glisser du cercle blanc suffit ensuite à l'amener au bon endroit.
  if (activeTool==='cut-rect' && isTouchCapableDevice()){ remoteCursor = { tool:'cut-rect', phase:'start', tip: viewportCenterStagePos() }; }
  else if (activeTool==='cut-point' && isTouchCapableDevice()){ remoteCursor = { tool:'cut-point', tip: viewportCenterStagePos() }; }
  else if ((isDrawTool(activeTool) || activeTool === SELECT_TOOL) && isTouchCapableDevice()){ remoteCursor = { tool:activeTool, phase:'start', tip: viewportCenterStagePos() }; } // v2.1-168 / 174
  else { remoteCursor = null; }
  drawRemoteCursor();
  if (!isDrawTool(activeTool)){ ghostGroup.destroyChildren(); }
  shapeNodes.forEach(n=>n.listening(!isDrawTool(activeTool))); updateShapeHandles(); // v2.1-168
  if (typeof syncDrawWin === 'function') syncDrawWin();
  hideCutConfirm();
  document.querySelectorAll('.tb-icon, .pop-tool-btn').forEach(b=>b.classList.remove('active'));
  // Ce nettoyage retire aussi la surbrillance d'icônes qui ne sont pas des outils (orientation,
  // légende) : on la rétablit ici (v2.1-68), sinon elle disparaissait à chaque changement d'outil.
  updateOrientButtons();
  document.getElementById('toolToggleLegend').classList.toggle('active', model.legend.visible);
  const map = {
    'pipette':'toolPipette','paint-bucket':'toolPaintBucket','eraser':'toolEraser',
    'cut-rect':'toolCutRect','cut-point':'toolCutPoint',
    'place-classic':'toolPlaceClassic','place-remote':'toolPlaceRemote'
  };
  if (activeTool && map[activeTool]) document.getElementById(map[activeTool]).classList.add('active');
  // La grille sert de point d'ancrage au placement déporté : elle apparaît automatiquement
  // (au premier plan, au-dessus du plan/des pastilles) tant que cet outil est actif, et se
  // remasque en le quittant — sauf si l'utilisateur l'a lui-même affichée via son icône.
  if (activeTool === 'place-remote'){
    if (!gridVisible){ gridVisible = true; gridAutoShown = true; }
  } else if (gridAutoShown){
    gridVisible = false; gridAutoShown = false;
  }
  document.getElementById('btnGrid').classList.toggle('active', gridVisible);
  updateGridButton();
  setGridVisible(gridVisible);
  if (activeTool !== 'paint-bucket') document.getElementById('bucketToleranceRow').style.display='none';
  if (activeTool !== 'eraser') document.getElementById('eraserSizeRow').style.display='none';
  if (activeTool==='paint-bucket'){ document.getElementById('bucketToleranceRow').style.display='flex'; }
  if (activeTool==='eraser'){ document.getElementById('eraserSizeRow').style.display='flex'; updateEraserUI(); }
  const container = document.getElementById('konvaContainer');
  container.classList.toggle('pipette-active', activeTool==='pipette');
  container.classList.toggle('cutting-active', ['cut-rect','cut-point','eraser'].includes(activeTool));
  ghostGroup.destroyChildren(); uiLayer.batchDraw();
  renderPlan(); // recalcule si le plan doit rester draggable selon l'outil actif
  if (typeof updateRotateIcons === 'function') updateRotateIcons(); // mains et bulle − / + selon l'outil actif (v2.1-82)
  // layoutHeader() recalcule juste la hauteur du bandeau (peut changer selon l'outil actif) ;
  // fitZoom() a été retiré d'ici : changer d'outil ne doit JAMAIS réinitialiser le zoom en
  // cours (c'était très gênant en pratique, ex. en renommant plusieurs pastilles à la
  // suite, le zoom retombait à chaque fois à son niveau le plus large).
  layoutHeader();
  if (typeof updateMobileTileActiveState === 'function') updateMobileTileActiveState();
  // v2.1-100 : Gomme et Pot ont des réglages (forme, taille, tolérance) : le tiroir Plan reste ouvert pour
  // les régler, et se referme seul après 5 s d'inactivité.
  if ((activeTool==='eraser' || activeTool==='paint-bucket') && document.querySelector('.tb-group[data-tile="plan"].mobile-open')){
    schedulePastilleDrawerClose();
  } else if (typeof closeAllTileDrawers === 'function') closeAllTileDrawers();
}

async function handleLogoFile(e, which){
  const file = e.target.files[0]; if (!file) return;
  let dataURL, img;
  try{ dataURL = await fileToImageDataURL(file); img = await loadImage(dataURL); }
  catch(err){ if (!(err instanceof ImportCancelled)) toast(err.userMessage || ('Format non pris en charge ou fichier illisible : '+file.name)); e.target.value=''; return; }
  const maxW = which==='entreprise' ? 240 : 160, maxH = which==='entreprise' ? 150 : 100;
  const ratio = Math.min(maxW/img.width, maxH/img.height, 1);
  // Un remplacement manuel retire l'ancien logo de la même catégorie plutôt que de
  // s'ajouter à côté : on ne veut jamais deux logos "entreprise" superposés, et un logo
  // client réel doit remplacer le placeholder "logo Cie" plutôt que de s'y ajouter.
  const old = model.logos.find(l=>l.which===which);
  const sheetW = model.orientation==='portrait' ? SHEET_W : SHEET_H;
  const x = old ? old.x : (which==='client' ? sheetW-160-40 : 40);
  const y = old ? old.y : 40;
  const locked = old ? !!old.locked : true; // verrouillé par défaut, comme les autres éléments de coin (voir createEmptyModel)
  model.logos = model.logos.filter(l=>l.which!==which);
  model.logos.push({ id: nextId('logo-'), which, dataURL, x, y, width:img.width*ratio, height:img.height*ratio, rotation:0, locked });
  pushHistory(); render();
  e.target.value='';
}

/* ---------------------------- Edition de texte (double-clic) ------------------ */
function openTextEditor(t, node){
  const area = document.getElementById('textEditArea');
  const confirmBtn = document.getElementById('textEditConfirm');
  const rect = sheetShadowHostEl.getBoundingClientRect();
  const box = node.getClientRect({relativeTo:stage});
  area.style.left = (rect.left + box.x*zoom) + 'px';
  area.style.top = (rect.top + box.y*zoom) + 'px';
  area.style.width = Math.max(120, box.width*zoom) + 'px';
  area.style.height = Math.max(30, box.height*zoom) + 'px';
  area.style.fontSize = Math.max(16, t.fontSize*zoom) + 'px'; // jamais sous 16px : Safari iOS zoome sinon la page entière au focus
  area.style.fontFamily = APP_FONT;
  area.style.color = t.color;
  area.style.textAlign = t.align || 'left';
  area.value = t.text;
  area.style.display = 'block';
  confirmBtn.style.left = (rect.left + box.x*zoom) + 'px';
  confirmBtn.style.top = (rect.top + (box.y+box.height)*zoom + 8) + 'px';
  confirmBtn.style.display = 'block';
  keepFixedBarInViewport(confirmBtn);
  area.focus(); area.select();
  let done = false;
  function commit(){
    if (done) return; done = true;
    t.text = area.value || ' ';
    area.style.display='none';
    confirmBtn.style.display='none';
    area.removeEventListener('blur', onBlur);
    confirmBtn.removeEventListener('click', onConfirmClick);
    // le texte reste sélectionné : la case est de nouveau librement déplaçable/redimensionnable
    selectedId = t.id;
    pushHistory(); render();
  }
  function onBlur(){
    // laisse un court instant pour qu'un clic sur "Valider" soit bien pris en compte
    // avant que le blur ne déclenche sa propre validation.
    setTimeout(()=>{ if (!done) commit(); }, 120);
  }
  function onConfirmClick(){ commit(); }
  area.addEventListener('blur', onBlur);
  confirmBtn.addEventListener('click', onConfirmClick);
}

function escapeAttr(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function starPolygonPoints(numPoints, cx, cy, outerR, innerR){
  const pts=[]; const step = Math.PI/numPoints;
  for(let i=0;i<numPoints*2;i++){
    const r = i%2===0?outerR:innerR;
    const a = i*step - Math.PI/2;
    pts.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}
// v2.1-176 : dessin SVG d'une forme de pastille (échantillons des listes ET aperçu du crayon) ; label optionnel (centré, plus bas dans un triangle).
function shapeSvgInner(shape, size, col, sw){
  const c = size/2;
  const st = `fill="${col}" stroke="#000" stroke-width="${sw}" stroke-linejoin="round"`;
  switch (shape){
    case 'burst': return `<polygon points="${starPolygonPoints(10, c, c, size*0.48, size*0.34)}" ${st}/>`;
    case 'square': return `<rect x="${size*0.1}" y="${size*0.1}" width="${size*0.8}" height="${size*0.8}" ${st}/>`;
    case 'rounded': return `<rect x="${size*0.1}" y="${size*0.1}" width="${size*0.8}" height="${size*0.8}" rx="${size*0.22}" ${st}/>`;
    case 'diamond': return `<polygon points="${c},${size*0.04} ${size*0.96},${c} ${c},${size*0.96} ${size*0.04},${c}" ${st}/>`;
    case 'triangle': return `<polygon points="${c},${size*0.08} ${size*0.95},${size*0.9} ${size*0.05},${size*0.9}" ${st}/>`;
    default: return `<circle cx="${c}" cy="${c}" r="${size*0.42}" ${st}/>`;
  }
}
function shapeSwatchHTML(type, size){
  size = size||20;
  const sw = size >= 30 ? 2 : 1.5;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${shapeSvgInner(type.shape, size, type.color || '#0E6FA8', sw)}</svg>`;
}
let lastTypeListSig = null; // évite de reconstruire le HTML de la liste si rien n'a changé (appelé à chaque rendu)
// v2.1-149 : taille d'un poste = taille par défaut de ses pastilles (et celle des pastilles déjà posées sur la page affichée).
function typeSizeOf(t){ return Math.round((t && t.defaultRadius) || currentPastilleRadius); }
function setTypeSize(typeId, r){
  r = Math.max(6, Math.min(60, Math.round(r)));
  pages.forEach(pg=>{ const t = pg.deviceTypes.find(x=>x.id===typeId); if (t) t.defaultRadius = r; });
  // v2.1-153 : la taille du poste ne concerne QUE les prochaines pastilles posées (les existantes : fenêtre « Tailles »)
  return r;
}
function refreshTypeList(){

  else if (!model.deviceTypes.find(t=>t.id===prev)){ selectedTypeId = model.deviceTypes[0].id; }
  else { selectedTypeId = prev; }

  // render() appelle cette fonction très souvent (chaque déplacement de pastille, chaque

  // reconstruire tout son HTML à chaque fois était un gaspillage inutile.
  const sig = JSON.stringify(model.deviceTypes.map(t=>[t.id,t.code,t.name,t.color,t.shape,t.noNumber,t.textColor||''])) + '|' + selectedTypeId;

        <button class="dd-item-btn" data-act="down" title="Descendre dans la liste" ${idx===model.deviceTypes.length-1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="dd-item-btn" data-act="edit" title="Modifier le nom / code"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 20l.9-3.6L15.5 6l3.1 3.1L8 19.6 4 20.5Z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg></button>

    row.addEventListener('click', (e)=>{

  addRow.addEventListener('click', (e)=>{

function updateTypePreview(){

  const auto = document.getElementById('newTypeTextAuto').checked;
  const tcol = auto ? autoTextColor(col) : document.getElementById('newTypeTextColor').value;
  // v2.1-176 : la forme réelle (étoile comprise) ; sa taille suit le curseur « Taille » (24 à 64 px pour un rayon de 6 à 40)
  const r = parseInt(document.getElementById('newTypeRadius').value, 10) || 16;
  const size = Math.round(24 + (Math.max(6, Math.min(40, r)) - 6) * (40/34));
  const label = document.getElementById('newTypeNoNumber').checked ? '' : ((document.getElementById('newTypeCode').value || 'E').slice(0,3));
  const n = label.length;
  const fs = size * (newTypeShape === 'triangle' ? (n > 1 ? 0.23 : 0.3) : newTypeShape === 'diamond' ? (n > 1 ? 0.25 : 0.32) : (n > 2 ? 0.26 : n > 1 ? 0.32 : 0.4));

}

// Taille réellement utilisée pour la PROCHAINE pastille : un poste peut imposer sa propre taille
// par défaut (souris, rat…), sinon c'est le réglage du curseur.
function effectiveNextRadius(){
  const type = model.deviceTypes.find(t=>t.id===selectedTypeId);
  return (type && type.defaultRadius) ? type.defaultRadius : currentPastilleRadius;
}
// Bouton maintenu = répétition de plus en plus rapide (appui bref = 1 cran). Utilisé pour − et +.
// "step" : +1 ou −1 ; "read"/"write" : lecture et écriture de la valeur ; "onEnd" : appelé UNE fois à
// la fin du geste (ex. enregistrer dans l'historique).
function bindStepper(btn, step, read, write, onEnd){
  let delayTimer = null, repeatTimer = null, changed = false;
  function doStep(){ if (write(read()+step)) changed = true; keepPastilleDrawerOpen(); }
  function stop(){
    clearTimeout(delayTimer); clearInterval(repeatTimer); delayTimer = repeatTimer = null;
    if (changed){ changed = false; if (onEnd) onEnd(); }
  }
  btn.addEventListener('pointerdown', (e)=>{
    e.preventDefault(); e.stopPropagation();
    try{ btn.setPointerCapture(e.pointerId); }catch(err){ /* sans conséquence */ }
    stop(); doStep();
    window.addEventListener('pointerup', stop, { once:true }); // filet si le bouton est retiré du DOM en plein appui
    delayTimer = setTimeout(()=>{
      let n = 0;
      repeatTimer = setInterval(()=>{
        doStep(); n++;
        if (n === 8){ clearInterval(repeatTimer); repeatTimer = setInterval(doStep, 45); } // accélère après quelques crans
      }, 110);
    }, 380);
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', e=>e.preventDefault());
}
// Un tiroir de tuile se referme après 5 s sans activité : un appui long sur − / + compte comme activité.
function keepPastilleDrawerOpen(){
  if (pastilleDrawerTimer){ schedulePastilleDrawerClose(); return; } // v2.1-86 : minuteur de 2 s du tiroir Pastille
  if (typeof tileRepeatCloseTimer !== 'undefined' && tileRepeatCloseTimer){
    clearTimeout(tileRepeatCloseTimer);
    tileRepeatCloseTimer = setTimeout(closeAllTileDrawers, TILE_REPEAT_CLICK_DELAY_MS);
  }
}
// v2.1-109 : transforme un <input type=range> en barre « modèle B » (voir CSS .rngB). La valeur affichée dans la
// poignée est tenue à jour par l'événement 'input' ET par un intercepteur de la propriété .value (le code
// modifie parfois .value directement, sans événement).
function buildRangeB(input, opts){
  opts = opts || {};
  const wrap = document.createElement('div'); wrap.className = 'rngB';
  const track = document.createElement('div'); track.className = 'rngB-track';
  const fill = document.createElement('div'); fill.className = 'rngB-fill'; track.appendChild(fill);
  const handle = document.createElement('div'); handle.className = 'rngB-handle';
  input.parentNode.insertBefore(wrap, input);
  wrap.append(track, handle, input); input.classList.add('rngB-input');
  let valEl = null; // valeur chiffrée à droite (v2.1-110), créée avec les boutons − / +
  const sync = ()=>{
    const min = parseFloat(input.min), max = parseFloat(input.max), v = parseFloat(input.value);
    const pct = max > min ? Math.max(0, Math.min(1, (v-min)/(max-min))) : 0;
    const x = 'calc(8px + (100% - 16px) * '+pct+')';
    fill.style.width = x; handle.style.left = x;
    if (valEl) valEl.textContent = Math.round(v);
  };
  const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  Object.defineProperty(input, 'value', { get(){ return desc.get.call(this); }, set(v){ desc.set.call(this, v); sync(); }, configurable:true });
  input.addEventListener('input', sync);
  if (opts.buttons){
    const mk = (txt, dir)=>{
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sqB'; b.textContent = txt; b.setAttribute('aria-label', dir<0 ? 'Diminuer' : 'Augmenter');
      const write = (v)=>{ const nv = Math.max(parseFloat(input.min), Math.min(parseFloat(input.max), Math.round(v))); if (nv === parseFloat(input.value)) return false; input.value = nv; input.dispatchEvent(new Event('input', { bubbles:true })); return true; };
      bindStepper(b, dir, ()=>parseFloat(input.value), write, ()=>input.dispatchEvent(new Event('change', { bubbles:true })));
      return b;
    };
    const minus = mk('−', -1), plus = mk('+', +1);
    wrap.parentNode.insertBefore(minus, wrap);
    wrap.parentNode.insertBefore(plus, wrap.nextSibling);
    if (!opts.noValue){ valEl = document.createElement('span'); valEl.className = 'rngE-val'; plus.parentNode.insertBefore(valEl, plus.nextSibling); } // v2.1-112 : pas de valeur chiffrée pour les réglages d'image
  }
  sync();
  return wrap;
}

(function(){
  const setRange = (inputEl)=>(v)=>{
    const min = parseFloat(inputEl.min), max = parseFloat(inputEl.max);
    const nv = Math.max(min, Math.min(max, Math.round(v)));
    if (nv === parseFloat(inputEl.value)) return false;
    inputEl.value = nv;
    inputEl.dispatchEvent(new Event('input', { bubbles:true }));
    return true;
  };
  // Tiroir "Pastille" : taille de la prochaine pastille.
  // Gomme : forme et taille (v2.1-97).
  const er = document.getElementById('rngEraserSize');
  bindStepper(document.getElementById('btnEraserSizeMinus'), -1, ()=>parseFloat(er.value), setRange(er));
  bindStepper(document.getElementById('btnEraserSizePlus'), +1, ()=>parseFloat(er.value), setRange(er));
  er.addEventListener('input', updateEraserUI);
  document.getElementById('btnEraserSquare').addEventListener('click', ()=>{ eraserShape='square'; updateEraserUI(); });
  document.getElementById('btnEraserRound').addEventListener('click', ()=>{ eraserShape='round'; updateEraserUI(); });
  updateEraserUI();
  // Barre de sélection : taille de la pastille sélectionnée (historique enregistré à la fin du geste).
  const sel = document.getElementById('selSize');
  const endSel = ()=>sel.dispatchEvent(new Event('change', { bubbles:true }));
  bindStepper(document.getElementById('selSizeMinus'), -1, ()=>parseFloat(sel.value), setRange(sel), endSel);
  bindStepper(document.getElementById('selSizePlus'), +1, ()=>parseFloat(sel.value), setRange(sel), endSel);
})();

// v2.1-149 : une fenêtre (ex. « Nouveau poste ») qui dépasserait le bas de l'écran reçoit une hauteur maximale + un défilement.
function fitFloatingHeight(el){
  const r = el.getBoundingClientRect();
  el.style.maxHeight = Math.max(160, window.innerHeight - r.top - 8) + 'px';
  el.style.overflowY = 'auto';
}
function positionFloating(trigger, el){
  const rect = trigger.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 6;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  requestAnimationFrame(()=>{
    const elRect = el.getBoundingClientRect();
    let newLeft = left, newTop = top;
    if (elRect.right > window.innerWidth - 8) newLeft = Math.max(8, window.innerWidth - elRect.width - 8);
    // v2.1-152 : jamais par-dessus les tuiles (la bande des tuiles reste toujours visible) : si ça ne tient pas en dessous, on
    // remonte au plus haut juste sous les tuiles et fitFloatingHeight() limite la hauteur (défilement).
    const tilesBottom = document.getElementById('mobileTileBar').getBoundingClientRect().bottom + 6;
    if (elRect.bottom > window.innerHeight - 8) newTop = Math.max(tilesBottom, Math.min(newTop, window.innerHeight - 8 - elRect.height));
    newTop = Math.max(newTop, tilesBottom);
    el.style.left = newLeft + 'px';
    el.style.top = newTop + 'px';
    fitFloatingHeight(el);
  });
}

// autres, sauf celle de la famille « keep » ('popover' | 'drawer' | 'sizeAll' | 'nudge' | 'settings').

  if (keep !== 'drawer' && keep !== 'popover') closeAllTileDrawers(); // un menu s'ouvre DEPUIS un tiroir : celui-ci reste ouvert (sinon son bouton disparaît et le menu ne sait plus où se placer)

  if (keep !== 'nudge' && nudgeOpen){ nudgeOpen = false; syncPastilleDrawer(); }
}
// v2.1-158 : contrôle des séries de numéros. Pour chaque lettre (code du poste), toutes pages confondues : numéros posés,
// numéros qui MANQUENT dans la suite 1…max (trous) et numéros en DOUBLE. « Renuméroter » remet la lettre en suite continue
// 1…n (ordre des pages puis ordre de pose), annulable.
function numberSeries(){
  const by = new Map();
  pages.forEach((pg, pi)=>pg.pastilles.forEach(p=>{
    const m = /^(.*?)(\d+)$/.exec(p.label||''); if (!m || !m[1]) return;
    const o = by.get(m[1]) || { code:m[1], nums:new Map(), total:0 };
    const n = parseInt(m[2],10); o.nums.set(n, (o.nums.get(n)||0)+1); o.total++; by.set(m[1], o);
  }));
  return [...by.values()].sort((a,b)=>a.code.localeCompare(b.code)).map(o=>{
    const max = Math.max(...o.nums.keys());
    const missing = []; for (let i=1;i<=max;i++) if (!o.nums.has(i)) missing.push(i);
    const dups = [...o.nums.entries()].filter(([,c])=>c>1).map(([n])=>n).sort((a,b)=>a-b);
    return { code:o.code, total:o.total, max, missing, dups };
  });
}
function renumberCode(code){
  let n = 0;
  const re = /^(.*?)(\d+)$/;
  pages.forEach(pg=>pg.pastilles.forEach(p=>{ const m = re.exec(p.label||''); if (m && m[1]===code) p.label = code + (++n); }));
  return n;
}

function fillCtrlWin(){
  const list = document.getElementById('ctrlList'); list.innerHTML = '';
  const series = numberSeries();
  if (!series.length){ list.innerHTML = '<div class="cw-row">Aucune pastille numérotée.</div>'; return; }
  const fmt = (a)=>a.join(', ');
  series.forEach(se=>{
    const row = document.createElement('div'); row.className = 'cw-row';
    const bad = se.missing.length || se.dups.length;
    row.innerHTML = '<div class="cw-head"><span>'+escapeAttr(se.code)+'</span><span style="font-weight:500;font-size:12px;">'+se.total+' pastille'+(se.total>1?'s':'')+'</span></div>'
      + (bad ? '' : '<div class="cw-ok">✓ série complète 1 → '+se.max+'</div>')
      + (se.missing.length ? '<div class="cw-miss">Manque : '+fmt(se.missing.map(n=>se.code+n))+'</div>' : '')
      + (se.dups.length ? '<div class="cw-dup">En double : '+fmt(se.dups.map(n=>se.code+n))+'</div>' : '');
    if (bad){
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cw-btn'; b.textContent = 'Renuméroter 1 → '+se.total;
      b.addEventListener('click', async ()=>{
        if (!(await askYesNo('Renuméroter toutes les pastilles « '+se.code+' » de 1 à '+se.total+' ?'))) return;
        renumberCode(se.code); pushHistory(); resetContentNodeCaches(); render(); fillCtrlWin();
      });
      row.querySelector('.cw-head').appendChild(b);
    }
    list.appendChild(row);
  });
}

// v2.1-168 : fenêtre « Dessin ». Outil actif = un des 4 tracés ; style (couleur, épaisseur, pointillé, remplissage) pour les NOUVEAUX dessins et,
// quand un dessin est sélectionné, pour ce dessin (la fenêtre reflète alors son style).
function syncDrawWin(){
  const win = document.getElementById('drawWin');
  win.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool === activeTool));
  document.getElementById('drawSelect').classList.toggle('active', activeTool === SELECT_TOOL);
  win.classList.toggle('no-target', !isDrawTool(activeTool) && !selectedShape()); // réglages sans effet : estompés
  win.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('active', +b.dataset.w === drawStyle.width));
  document.getElementById('drawDash').classList.toggle('active', drawStyle.dash);
  document.getElementById('drawFill').classList.toggle('active', drawStyle.fill);
  document.getElementById('drawColor').value = drawStyle.color;
  document.getElementById('btnDraw').classList.toggle('active', win.classList.contains('show'));
  // Consigne affichée DANS la fenêtre (les bulles s'afficheraient au même endroit et la cacheraient)
  let hint = '';
  if (activeTool === SELECT_TOOL) hint = isTouchCapableDevice() ? 'Placez la pointe rouge sur un dessin puis tapotez le cercle.' : 'Cliquez un dessin pour le sélectionner.';
  else if (!isDrawTool(activeTool)) hint = selectedShape() ? 'Dessin sélectionné : réglages ci-dessous, poignées pour le modifier.' : 'Touchez un dessin pour le modifier, ou un outil pour tracer.';
  else if (!isTouchCapableDevice()) hint = 'Glissez sur le plan pour tracer.';
  else hint = drawStart ? '2e point : placez le curseur puis tapotez le cercle.' : '1er point : placez le curseur puis tapotez le cercle.';
  document.getElementById('drawHint').textContent = hint;
}

function bindPopover(triggerId, popId){
  const trigger = document.getElementById(triggerId);
  const pop = document.getElementById(popId);
  trigger.addEventListener('click', (e)=>{

/* ---------------------------- Barre du haut : orientation / zoom / grille ------- */
// En changeant d'orientation, la largeur et la hauteur de la feuille s'échangent : un
// élément ancré à un bord (ex. le logo client à droite, la légende en bas à droite) se
// retrouvait donc décalé, voire carrément hors feuille, si sa position n'était pas
// réajustée. Un ancien essai (v2.1-22) réinitialisait ces éléments à une position par
// défaut fixe — corrigé depuis (v2.1-24) car ça écrasait un ajustement manuel déjà fait.
// La bonne approche : préserver la MARGE actuelle de chaque élément par rapport au bord
// auquel il est ancré (calculée avant le changement, réappliquée après), plutôt qu'une
// position fixe — ça respecte un ajustement manuel (une marge plus grande ou plus petite
// que la valeur par défaut reste identique) tout en s'adaptant correctement au nouveau
// format. Le logo entreprise (ancré en haut à gauche) n'a besoin d'aucun ajustement : x et
// y ne dépendent ni de la largeur ni de la hauteur de la feuille.
function adjustCornerElementsForOrientationSwitch(oldW, oldH, newW, newH){
  const clientLogo = model.logos.find(l=>l.which==='client');
  if (clientLogo){
    const marginRight = oldW - (clientLogo.x + clientLogo.width);
    clientLogo.x = newW - clientLogo.width - marginRight;
  }
  if (model.legend){
    // Largeur/hauteur réellement affichées à l'écran (dépendent du nombre de postes
    // listés) recalculées avec la même formule que le rendu de la légende, pour que la
    // marge préservée soit celle réellement visible plutôt qu'une estimation approximative.
    const usedIds = new Set(model.pastilles.map(p=>p.typeId));
    let types = model.deviceTypes;
    if (model.legend.onlyUsed) types = types.filter(t=>usedIds.has(t.id));
    const scale = model.legend.scale || 1;
    const legendW = 300 * scale;
    const legendH = (34 + 14*2 + Math.max(types.length,0)*30) * scale;
    const marginRight = oldW - (model.legend.x + legendW);
    const marginBottom = oldH - (model.legend.y + legendH);
    model.legend.x = newW - legendW - marginRight;
    model.legend.y = newH - legendH - marginBottom;
  }
  const dateText = model.textes.find(t=>t.text && t.text.startsWith('Mise à jour le'));
  if (dateText){
    const h = dateText.height || 26;
    const marginBottom = oldH - (dateText.y + h);
    dateText.y = newH - h - marginBottom;
  }
}
// v2.1-96 : les 4 éléments de coin sont-ils encore EXACTEMENT sur le préréglage de cette orientation ?
function cornerElementsAtPreset(orient){
  const P = CORNER_PRESETS[orient], near = (a,b)=>Math.abs(a-b) < 1;
  const co = model.logos.find(l=>l.which==='entreprise'), cl = model.logos.find(l=>l.which==='client');
  const dt = model.textes.find(t=>t.text && t.text.startsWith('Mise à jour le')), ad = model.textes.find(t=>t.id==='text-client-address');
  if (co && !(near(co.x,P.companyLogo.x) && near(co.y,P.companyLogo.y) && near(co.width,P.companyLogo.width))) return false;
  if (cl && !(near(cl.x,P.clientLogo.x) && near(cl.y,P.clientLogo.y))) return false;
  if (dt && !(near(dt.x,P.date.x) && near(dt.y,P.date.y))) return false;
  if (ad && !(near(ad.x,P.address.x) && near(ad.y,P.address.y))) return false;
  if (model.legend && !(near(model.legend.x,P.legend.x) && near(model.legend.y,P.legend.y))) return false;
  return true;
}
function applyCornerPreset(orient){
  const P = CORNER_PRESETS[orient];
  const co = model.logos.find(l=>l.which==='entreprise'), cl = model.logos.find(l=>l.which==='client');
  const dt = model.textes.find(t=>t.text && t.text.startsWith('Mise à jour le')), ad = model.textes.find(t=>t.id==='text-client-address');
  if (co){ const ratio = co.height/co.width; co.x = P.companyLogo.x; co.y = P.companyLogo.y; co.width = P.companyLogo.width; co.height = P.companyLogo.width*ratio; }
  if (cl){ cl.x = P.clientLogo.x; cl.y = P.clientLogo.y; }
  if (dt){ dt.x = P.date.x; dt.y = P.date.y; }
  if (ad){ ad.x = P.address.x; ad.y = P.address.y; }
  if (model.legend){ model.legend.x = P.legend.x; model.legend.y = P.legend.y; }
}
// Bascule d'orientation : préréglage de la nouvelle orientation si rien n'a été déplacé à la main, sinon marges préservées.
function switchOrientationWithCorners(newOrient){
  const oldOrient = model.orientation;
  const pristine = cornerElementsAtPreset(oldOrient);
  if (pristine) applyCornerPreset(newOrient);
  else if (newOrient === 'portrait') adjustCornerElementsForOrientationSwitch(SHEET_H, SHEET_W, SHEET_W, SHEET_H);
  else adjustCornerElementsForOrientationSwitch(SHEET_W, SHEET_H, SHEET_H, SHEET_W);
  model.orientation = newOrient;
}

// "lite" = pendant un pincement à deux doigts (v2.1-62) : on ne change que le zoom CSS (très
// léger). Tout ce qui doit garder une taille constante à l'écran (icônes de rotation, cadenas,
// zone de saisie de la pastille, curseur déporté) est recalé UNE seule fois à la fin du geste
// (settleZoom), au lieu d'être redessiné à chaque image du pincement.
function setZoom(z, lite){
  zoom = Math.max(0.2, Math.min(3, z));
  document.getElementById('zoomLabel').textContent = Math.round(zoom*100)+'%';
  applySheetSize();
  if (!lite) settleZoom();
}
// v2.1-131 : finesse du dessin à l'écran. Le canevas est dessiné à 'Konva.pixelRatio' fois la taille de la feuille puis agrandi
// ou réduit en CSS par le zoom : sur un PC (écran à 1 pixel par pixel) le plafond de 2 et le ratio fixe donnaient une image
// floue dès qu'on zoomait (le PDF exporté, lui, est dessiné à ratio 2 sans zoom, donc net). Le ratio suit maintenant
// « densité de l'écran × zoom », avec un plancher (celui d'avant sur téléphone ; 2 sur ordinateur) et un plafond de MÉMOIRE
// (nombre de pixels par couche) pour ne jamais alourdir un téléphone au-delà de l'ancien comportement.
function computeRenderRatio(){
  const dpr = window.devicePixelRatio || 1;
  const desk = document.body.classList.contains('desk');
  const floor = desk ? 2 : Math.min(dpr, 2);
  const budget = Math.sqrt((desk ? 10e6 : 6e6) / (stage.width()*stage.height()));
  const r = Math.min(Math.max(floor, dpr*zoom), budget, 4);
  return Math.max(1, Math.round(r*4)/4); // par pas de 0,25 : pas de reconstruction à chaque micro-zoom
}
function applyRenderRatio(){
  const r = computeRenderRatio();
  if (Math.abs(r - Konva.pixelRatio) < 0.01) return;
  Konva.pixelRatio = r;
  [planLayer, contentLayer, gridLayer, uiLayer].forEach(l=>l.getCanvas().setPixelRatio(r));
  planImageNodes.forEach(n=>{ n._forceRefresh = true; }); // plans filtrés : image mise en cache refaite à la nouvelle finesse
  resetContentNodeCaches(); // pastilles et légende mises en cache bitmap à l'ancienne finesse
  render();
}
function settleZoom(){
  applyRenderRatio();
  if (!planRotate.active) updateLockIndicator(); // met à jour aussi les icônes de rotation : taille constante à l'écran
  if (selectedId){ // zone de saisie de la pastille sélectionnée : taille constante à l'écran
    const pp = model.pastilles.find(x=>x.id===selectedId), g = pp && pastilleNodes.get(pp.id);
    if (g){ syncPastilleSelection(g, true, pp.radius); contentLayer.batchDraw(); }
  }
  if (remoteCursor) drawRemoteCursor(); // le décalage écran doigt→pointe doit rester constant au zoom
}
function fitZoom(){

// Attend que toutes les images des logos actuellement affichés aient fini de se charger.
// Nécessaire car un logo est recréé (voir renderContent -> logos) à chaque page visitée
// pendant l'export multi-pages (les nodes sont réinitialisés entre deux pages, voir
// resetContentNodeCaches) : sans attendre ce chargement, la capture pouvait intervenir
// AVANT que l'image ne soit prête (le décodage d'une image, même encodée directement dans
// le fichier, reste asynchrone) — laissant le logo entreprise et/ou client manquant à
// l'export de façon imprévisible, selon lequel des deux finissait de charger à temps.
function waitForLogoImages(){
  const pending = [];
  logoNodes.forEach(node=>{
    const img = node.image();
    if (img && !img.complete){
      pending.push(new Promise(resolve=>{
        img.onload = ()=>{ contentLayer.batchDraw(); resolve(); };
        img.onerror = resolve; // ne bloque jamais l'export si une image est invalide
      }));
    }
  });
  return pending.length ? Promise.all(pending) : Promise.resolve();
}
function withCleanStage(fn){
  const wasSelected = selectedId;
  selectedId = null; transformer.nodes([]);
  updateShapeHandles(); // v2.1-168 : jamais de poignées dans l'image exportée
  updateLockIndicator(); // masque aussi les icônes de rotation et le cadenas : jamais dans l'image exportée
  setGridVisible(false); ghostGroup.visible(false); uiLayer.batchDraw();
  const result = fn();
  setGridVisible(gridVisible); ghostGroup.visible(true);
  selectedId = wasSelected; render();
  return result;
}
// Avant une capture d'export (v2.1-64) : chaque plan est redessiné depuis son image PLEINE
// définition (et non la copie réduite de l'écran), et ceux qui ont un réglage d'image
// (luminosité, contraste…) sont recalculés à la finesse de l'export. Les nodes sont marqués
// "à rafraîchir" : le render() qui suit la capture (withCleanStage) les remet à l'état d'écran.
function prepareStageForExport(){
  model.plans.forEach(p=>{
    const node = planImageNodes.get(p.id), natural = planNaturalCanvases.get(p.id);
    if (!node || !natural) return;
    node.image(natural);
    if (node.isCached()){
      node.clearCache();
      node.cache({ pixelRatio: Math.max(2, Konva.pixelRatio) });
    }
    node._forceRefresh = true;
  });
}
// Capture de la feuille pour l'EXPORT. La couche "fond blanc" n'existe plus à l'écran
// (v2.1-62) : le blanc est donc ajouté ici, derrière l'image, avant l'encodage. Le résultat est
// identique à l'ancien (feuille opaque, fond blanc) ; mêmes pixelRatio et qualité qu'avant.
function exportStageDataURL(mimeType, quality, pixelRatio){
  const cv = stage.toCanvas({ pixelRatio, x:SHEET_MARGIN, y:SHEET_MARGIN, width:sheetW(), height:sheetH() }); // feuille seule, sans la marge (v2.1-118)
  const out = document.createElement('canvas');
  out.width = cv.width; out.height = cv.height;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(cv, 0, 0);
  return out.toDataURL(mimeType, quality);
}
// Parcourt toutes les pages du document, capture une image de chacune (dans son
// orientation propre), puis restaure la page affichée avant l'export. Utilisé pour les
// exports multi-pages (PDF). Les exports PNG/JPEG/PPTX ci-dessous restent, eux, limités
// à la page actuellement affichée à l'écran.
// v2.1-127 : choix des pages à exporter (la page « Récapitulatif », si elle existe, est décochée par défaut : le client n'en
// a pas besoin). Un seul étage = aucune question. Résultat : liste d'indices, ou null si Mic annule.
// v2.1-159 : miniatures de toutes les pages (aperçu avant export). Même parcours que la capture d'export, mais en très petit
// (ratio 0,3) ; la page affichée est restaurée ensuite.
async function buildPageThumbs(){
  const originalIndex = currentPageIndex, was = selectedId;
  const thumbs = [];
  bitmapCacheEnabled = false;
  try{
    for (let i=0; i<pages.length; i++){
      if (i !== currentPageIndex || !thumbs.length){
        currentPageIndex = i; model = pages[i];
        selectedId = null; transformer.nodes([]);
        resetContentNodeCaches();
        await rehydratePlanCanvas();
        render();
        await waitForLogoImages();
      }
      thumbs.push(withCleanStage(()=>exportStageDataURL('image/jpeg', 0.7, 0.3)));
    }
  } finally { bitmapCacheEnabled = true; }
  currentPageIndex = originalIndex; model = pages[originalIndex];
  resetContentNodeCaches();
  await rehydratePlanCanvas();
  selectedId = was;
  render(); updateOrientButtons(); updatePageIndicator();
  return thumbs;
}

    const mk = (txt, bg, fg, fn)=>{ const b = document.createElement('button'); b.type='button'; b.textContent = txt; b.style.cssText = 'font:inherit;padding:8px 14px;border:none;border-radius:8px;background:'+bg+';color:'+fg+';'; b.addEventListener('click', fn); return b; };
    const done = (v)=>{ card.remove(); resolve(v); };
    row.append(mk('Annuler','#fff7e6','#1c2230',()=>done(null)), mk('Exporter','#1c2230','#fff',()=>{
      const idx = boxes.map((cb,i)=>cb.checked ? i : -1).filter(i=>i>=0);
      if (!idx.length){ toast('Cochez au moins une page.'); return; }
      done(idx);
    }));
    card.appendChild(row);
    document.body.appendChild(card);
  });
}
async function captureAllPagesAsImages(mimeType, quality){
  const wanted = await askPagesToExport();
  if (!wanted) return null; // export annulé
  const originalIndex = currentPageIndex;
  const images = [];
  // Pendant la capture, les pastilles et la légende sont redessinées en VECTORIEL (pas depuis
  // leur image mise en cache) : netteté maximale à l'export (v2.1-65).
  bitmapCacheEnabled = false;
  try{
  for (let i=0; i<pages.length; i++){
    if (!wanted.includes(i)) continue; // page non cochée
    currentPageIndex = i;
    model = pages[i];
    selectedId = null; transformer.nodes([]);
    resetContentNodeCaches();
    await rehydratePlanCanvas();
    render();
    await waitForLogoImages(); // sans ça, un logo pouvait manquer à la capture (voir waitForLogoImages)
    const dataUrl = withCleanStage(()=>{ prepareStageForExport(); return exportStageDataURL(mimeType, quality, 2); });
    images.push({ dataUrl, orientation: model.orientation });
  }
  } finally { bitmapCacheEnabled = true; }
  currentPageIndex = originalIndex;
  model = pages[originalIndex];
  resetContentNodeCaches();
  await rehydratePlanCanvas();
  render(); updateOrientButtons(); updatePageIndicator();
  return images;
}
// Télécharge un seul fichier, ou regroupe plusieurs pages dans un .zip : sur mobile
// (Safari iOS en particulier), déclencher plusieurs téléchargements séparés à la suite
// est peu fiable (souvent bloqués au-delà du premier) ; un unique fichier .zip est le
// moyen le plus sûr de récupérer toutes les pages en une fois.
async function downloadImagesAsFileOrZip(images, ext, baseName){
  if (images.length === 1){
    downloadDataURL(images[0].dataUrl, baseName+'.'+ext);
    return;
  }
  const zip = new JSZip();
  images.forEach((img, i)=>{
    const base64 = img.dataUrl.split(',')[1];
    zip.file(baseName+'-page'+(i+1)+'.'+ext, base64, {base64:true});
  });
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = baseName+'.zip';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('btnExportPPTX').addEventListener('click', async ()=>{
  closeAllPopovers();
  const base = await ensureDocName(); if (!base) return;
  const images = await captureAllPagesAsImages('image/png'); if (!images) return;
  const pptx = new window.PptxGenJS();
  // Le format du diaporama (calque) est fixé sur l'orientation de la page 1 ; les pages
  // suivantes, si elles ont une orientation différente, sont insérées à leur échelle
  // réelle, centrées, sans être déformées.
  const baseIsPortrait = images[0].orientation === 'portrait';
  const layoutW = baseIsPortrait ? (A4_W_MM/25.4) : (A4_H_MM/25.4);
  const layoutH = baseIsPortrait ? (A4_H_MM/25.4) : (A4_W_MM/25.4);
  pptx.defineLayout({name:'A4', width:layoutW, height:layoutH});
  pptx.layout = 'A4';
  images.forEach(img=>{
    const slide = pptx.addSlide();
    const imgIsPortrait = img.orientation === 'portrait';
    const pageW = imgIsPortrait ? (A4_W_MM/25.4) : (A4_H_MM/25.4);
    const pageH = imgIsPortrait ? (A4_H_MM/25.4) : (A4_W_MM/25.4);
    const scale = Math.min(layoutW/pageW, layoutH/pageH, 1);
    const w = pageW*scale, h = pageH*scale;
    slide.addImage({data:img.dataUrl, x:(layoutW-w)/2, y:(layoutH-h)/2, w, h});
  });
  pptx.writeFile({fileName:base+'.pptx'});
  toast('PPTX exporté ('+images.length+' page'+(images.length>1?'s':'')+').');
});

const APP_VERSION_RE = /<title>[^<]*?(v\d+\.\d+-\d+)/;

async function applyUpdate(){

async function checkForUpdate(){
  if (updateReady || !/^https?:$/.test(location.protocol) || !navigator.onLine) return;
  try{
    const res = await fetch('./index.html', { cache:'no-store' });
    if (!res.ok) return;
    const txt = await res.text();
    const mine = (document.title.match(/v\d+\.\d+-\d+/)||[])[0];
    const last = (txt.match(APP_VERSION_RE)||[])[1];
    if (mine && last && mine !== last){ updateReady = true; showUpdateBubble(); }
  } catch(e){ /* pas de réseau : on réessaiera plus tard */ }
}

// v2.1-92 : libellés COURTS (une seule ligne sous l'icône) ; l'infobulle (title) garde le texte complet.

{

// Un seul écouteur "resize" (regroupé sur requestAnimationFrame), au lieu de 4 séparés :
// évite de refaire 4 fois le travail de mise en page à chaque frame d'un redimensionnement
// continu (rotation d'écran, ouverture du clavier virtuel, redimensionnement de fenêtre…).
let resizeRAF = null;
let lastResizeWidth = window.innerWidth; // v2.1-122 : le clavier virtuel ne change que la HAUTEUR
window.addEventListener('resize', ()=>{
  if (resizeRAF) return;
  resizeRAF = requestAnimationFrame(()=>{
    resizeRAF = null;
    // Sur mobile, ouvrir le clavier virtuel déclenche aussi un "resize" (la fenêtre visible
    // rétrécit) : si on est en train de saisir du texte, ce n'est pas une rotation d'écran,
    // et fermer les popovers à cet instant précis fermait le formulaire sous les yeux de
    // l'utilisateur dès qu'il touchait un champ pour y taper. On ne ferme donc les popovers
    // que si le focus n'est pas dans un champ de saisie.
    const typing = document.activeElement && (document.activeElement.tagName==='INPUT' || document.activeElement.tagName==='TEXTAREA');
    if (!typing) closeAllPopovers();
    layoutHeader(); // met aussi à jour les bandes de défilement
    // Sur mobile, ouvrir le CLAVIER VIRTUEL (ex. pour taper un renommage) déclenche aussi
    // cet événement "resize" (la fenêtre visible rétrécit) : ce n'est pas une vraie rotation
    // d'écran ni un redimensionnement de fenêtre, donc pas une raison de réinitialiser le
    // zoom — c'était très gênant en pratique (le zoom retombait dès qu'on touchait un champ
    // de saisie, ex. pour renommer une pastille).
    // v2.1-122 : à la FERMETURE du clavier (fin d'un renommage), le champ n'a déjà plus le focus : « typing » est faux et
    // le zoom retombait. Seul un changement de LARGEUR (rotation d'écran, fenêtre PC) est une vraie raison de recadrer.
    const widthChanged = window.innerWidth !== lastResizeWidth;
    lastResizeWidth = window.innerWidth;
    if (!typing && widthChanged) fitZoom();
  });
});

// Ajoute les nouveaux postes "par défaut" (souris/rat) aux documents déjà existants qui ont
// été créés avant leur introduction (sauvegarde automatique restaurée, projet .json ouvert
// depuis un ancien fichier) : sans cela, ils n'apparaissent que dans un tout nouveau projet.
// Convertit l'ancien format à un seul plan par page ("plan": {...} ou null) vers le
// nouveau format à plusieurs plans ("plans": [...]) — nécessaire pour ouvrir sans perte
// un document sauvegardé (autosave ou fichier .json) avant l'introduction des plans
// multiples par page.
function migratePlanFormat(pg){
  if (pg.plans) return;
  pg.plans = pg.plan ? [{...pg.plan, id: pg.plan.id || nextId('plan-')}] : [];
  delete pg.plan;
}
function ensureDefaultDeviceTypes(){
  // Appelée à chaque rendu (donc très souvent) : on ne vérifie que la page AFFICHÉE plutôt
  // que de reboucler sur toutes les pages à chaque fois. Chaque page reçoit de toute façon
  // cette vérification dès qu'on l'affiche (switchToPage -> render()).
  const defaults = [
    { id: 'type-souris', code: 'MU', name: 'Poste rongeur souris', color: '#E31C1C', shape: 'circle', noNumber: true, defaultRadius: 10 },
    { id: 'type-rat', code: 'RA', name: 'Poste rongeurs rat', color: '#E31C1C', shape: 'circle', noNumber: true, defaultRadius: 20 },
  ];
  defaults.forEach(d=>{
    if (!model.deviceTypes.some(t=>t.id===d.id)) model.deviceTypes.push({...d});
  });
}
(async function initApp(){
  // Le canevas dessine avec la police du moment : si IBM Plex Sans n'est pas encore chargée
  // au premier rendu, tout s'afficherait avec une police de secours (et les étiquettes des
  // pastilles, mises en cache, la garderaient). On attend donc son chargement — au maximum
  // 2,5 s, pour ne jamais bloquer l'ouverture hors connexion (police alors indisponible).
  try{
    if (document.fonts && document.fonts.load){
      await Promise.race([
        Promise.all([document.fonts.load("400 16px 'IBM Plex Sans'"), document.fonts.load("700 16px 'IBM Plex Sans'")]),
        new Promise(r=>setTimeout(r, 2500))
      ]);
    }
  } catch(err){ /* sans conséquence : rendu avec la police de secours */ }
  const saved = await idbLoad();
  if (saved && Array.isArray(saved.pages) && saved.pages.length){
    pages = saved.pages;
    pages.forEach(migratePlanFormat);
    currentPageIndex = Math.min(saved.currentPageIndex||0, pages.length-1);
    docName = saved.docName || null;
    docId = saved.docId || newDocId(); // ancien format : identifiant créé maintenant
    model = pages[currentPageIndex];
    idCounter = 100000; // évite toute collision d'ID avec la session restaurée
    ensureDefaultDeviceTypes();
    await rehydratePlanCanvas();
    const t = saved.savedAt ? new Date(saved.savedAt) : null;
    setAutoSaveIndicator('Sauvegardé à '+(t? t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—'), false);
    toast('Session précédente restaurée automatiquement.');
    // v2.1-160 : rappel à l'ouverture si le fichier .json n'a pas été enregistré depuis plus de 3 jours (ou jamais, pour un document déjà fourni)
    updateFileDot();
  } else {
    await autoInsertCompanyLogo(); // logo entreprise déjà présent dès l'ouverture de l'application (page 1)
    await autoInsertClientLogoPlaceholder(); // idem pour le placeholder "logo Cie", en haut à droite
  }
  history = [cloneDoc()]; historyIndex = 0;
  ensureDefaultTool(); // à l'ouverture : "Placement classique" déjà sélectionné (avant les mises à jour de boutons : setTool réinitialise leur surbrillance)
  updateOrientButtons();
  updateHistoryButtons();
  updatePageIndicator();
  document.getElementById('toolToggleLegend').classList.toggle('active', model.legend.visible);
  updateMobileTileActiveState();
  fitZoom();
  render();
  scheduleAutoSave();
})();
// Mode hors ligne + mise à jour automatique (v2.1-66) : le "service worker" (fichier sw.js)
// garde l'application en mémoire pour qu'elle s'ouvre sans réseau, et redemande à chaque
// lancement (si le réseau est là) la dernière version publiée. Inactif quand on ouvre le
// fichier directement depuis le PC (adresse file://) : il faut une adresse https.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Mode hors ligne indisponible :', err));
  });
}
