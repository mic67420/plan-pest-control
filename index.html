<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PLAN PEST CONTROL v2.1-176 — Éditeur de plans de lutte antiparasitaire</title>
<!-- Application installable sur l'écran d'accueil du téléphone (v2.1-66) -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E6FA8">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan PC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/konva@9.3.6/konva.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette "plan technique" : encre graphite, bleu cyanotype (calque de plan), ambre
       balisage terrain en accent secondaire — sobre, lisible en extérieur / plein soleil. */
    --bg:#EEF1F0;
    --ink:#182029;
    --ink-dim:#5C6672;
    --line:#D7DCE1;
    --panel-bg:#101826;
    --panel-bg-soft:#1B2536;
    --panel-fg:#EEF1F6;
    --panel-fg-dim:#9AA5B8;
    --accent:#0E6FA8;
    --accent-ink:#08425f;
    --accent-soft:#E4F1F8;
    --field:#C7791F;
    --field-soft:#FBF0E2;
    --danger:#C0392B;
    --danger-soft:#FBEAE8;
    --sheet-shadow: 0 18px 45px -12px rgba(16,24,38,.35), 0 4px 10px rgba(16,24,38,.12);
    --radius:10px;
    --topbar-h:56px;
    --trigger-w:14px;
    --panel-w:280px;
    font-family:"IBM Plex Sans",sans-serif; /* police libre (SIL OFL) uniquement, plus de polices propriétaires en secours */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .icon{width:20px;height:20px;flex:none;display:block;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}

  /* ---------- Barre superieure unique (fine, une seule largeur d'ecran) ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:var(--topbar-h);
    /* Décale le contenu du bandeau sous l'encoche / l'île dynamique d'un iPhone (sans effet
       sur Android, où cette valeur vaut 0). */
    padding-top:env(safe-area-inset-top);
    background:#ffffff;border-bottom:1px solid #d8dce3;
    display:flex;align-items:center;gap:6px;padding-left:12px;padding-right:12px;
    z-index:500;overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  }
  #topbar::-webkit-scrollbar{height:4px;}
  html, body{
    /* Empêche le rebond élastique (overscroll) propre à Safari iOS : sans ça, un
       glissement un peu rapide sur les bords du plan faisait "rebondir" toute la page
       plutôt que de rester dans la zone de défilement prévue par l'app. Sans effet sur
       Android/Chrome. */
    overscroll-behavior:none;
  }
  #topbar .brand{font-weight:600;font-size:14px;letter-spacing:.2px;color:var(--ink);white-space:nowrap;flex:none;display:flex;align-items:center;gap:7px;}
  #topbar .brand span{color:var(--accent);}
  #saveBadge{font-size:10px;font-weight:600;color:#2e8b57 !important;white-space:nowrap;} /* v2.1-126 : « ✓ 14:32 » toujours visible */
  #saveBadge.err{color:#c0392b !important;}
  #topbar .brand .ver{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid rgba(14,111,168,.28);border-radius:5px;padding:2px 5px;letter-spacing:.02em;}
  .tb-group{display:flex;align-items:center;gap:3px;flex:none;}
  .sep{width:1px;height:26px;background:#e3e6eb;flex:none;margin:0 2px;}
  .tb-icon{
    height:38px;min-width:38px;border-radius:8px;border:1px solid transparent;background:transparent;
    display:flex;align-items:center;justify-content:center;font-size:17px;color:#2a3142;flex:none;
  }
  .tb-icon:hover{background:#f0f2f6;}
  .tb-icon.active{background:var(--accent);color:#fff;}
  .tb-icon:disabled{opacity:.35;cursor:not-allowed;}
  .tb-icon:disabled:hover{background:transparent;}
  #zoomLabel{font-size:12px;color:#6a7386;width:40px;text-align:center;flex:none;}
  #fileInputPlan,#fileInputLogoA,#fileInputLogoB,#fileInputProject{
    position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;
  }
  /* Réglage de taille des pastilles (v2.1-68) : − | curseur | + sur une ligne, grosses cibles
     tactiles ; pastille témoin dans un cadre pointillé de taille fixe. */
  .size-ctl{display:flex;flex-direction:column;gap:3px;flex:none;padding:0 4px;}
  .size-ctl-row{display:flex;align-items:center;gap:6px;}
  .size-ctl-row input[type=range]{width:120px;height:30px;accent-color:var(--accent);}
  .size-ctl-row .val{width:22px;text-align:center;font-size:12px;color:#5c6478;}
  .step-btn{
    width:46px;height:46px;flex:none;border-radius:10px;border:1px solid #d8dce3;background:#f6f7f9;
    color:#2a3142;font-size:26px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  /* v2.1-110 — MODÈLE E (fin et discret) pour tous les réglages à valeur : trait fin dont la partie orange montre la
     valeur, petite poignée ronde, boutons − / + en petits cercles clairs au signe orange, valeur en petit à droite.
     (Le modèle B de v2.1-109, jugé trop massif, est abandonné.) Le vrai <input type=range> reste là, transparent
     et par-dessus : glisser au doigt, clavier et événements d'origine inchangés. */
  .rngB{position:relative;flex:1 1 auto;min-width:90px;height:34px;}
  .rngB-track{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:#dfe3e9;}
  .rngB-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#F59E0B;}
  .rngB-handle{position:absolute;top:9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:2px solid #F59E0B;box-sizing:border-box;pointer-events:none;}
  input.rngB-input{position:absolute !important;inset:0;width:100% !important;height:100% !important;margin:0;opacity:0;cursor:pointer;touch-action:none;}
  .sqB, .step-btn{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid #d8dce3;background:#fff;color:#D98400;font-size:17px;font-weight:700;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  .sqB:active, .step-btn:active{background:#fff3d6;border-color:#F59E0B;color:#D98400;}
  .rngE-val, .size-ctl-row .val, #eraserSizeLabel{width:30px;text-align:right;font-size:13px;font-weight:600;color:#1c2230;flex:none;}
  .size-ctl .rngB{flex:none;width:150px;}
  .size-preview{
    flex:none;width:52px;height:52px;border:none;background:transparent; /* v2.1-94 : plus de cadre pointillé */
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  }
  #btnEraserSquare.active, #btnEraserRound.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .size-preview-shape{display:flex;align-items:center;justify-content:center;}
  .size-preview-note{display:none;position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:9.5px;color:#8890a0;line-height:1.1;pointer-events:none;}
  .tb-check{display:flex;align-items:center;gap:4px;font-size:11px;color:#5c6478;flex:none;white-space:nowrap;}

  /* ---------- Popovers (reglages secondaires, ouverts au clic sur une icone) ---------- */
  .pop-wrap{position:relative;flex:none;}
  .popover{
    position:fixed;min-width:230px;max-width:calc(100vw - 16px);box-sizing:border-box;
    background:#fff;border:1px solid #d8dce3;border-radius:10px;box-shadow:0 12px 30px rgba(20,26,40,.22);
    z-index:1000;padding:10px;display:none;
  }
  .popover.open{display:block;}
  /* v2.1-165 : fenêtre « poste » (ajout / crayon) : carte blanche sous les tuiles, 2 colonnes, champs grands, aperçu en direct */
  body.mobile-mode #popAddType{ left:50% !important; right:auto !important; transform:translateX(-50%); width:min(420px, calc(100vw - 16px)); max-width:none; padding:12px; z-index:1001; }
  body.mobile-mode #popAddType.open{ display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; align-items:center; }
  /* v2.1-170 : réglages du poste EN LIGNES (libellé à gauche, réglage à droite), dans l'ordre : Code, Nom, Couleur, Police, Taille, Numéro */
  #popAddType .tf{ grid-column:1 / -1; display:flex; flex-direction:row; align-items:center; gap:12px; min-width:0; }
  #popAddType .tf > label:first-child{ flex:0 0 74px; font-size:13px; font-weight:600; color:#5c6478; }
  #popAddType .tf > input[type=text], #popAddType .tf > .tf-ctl, #popAddType .tf > .chip{ flex:1 1 auto; min-width:0; }
  #popAddType .tf input[type=text]{ width:100%; box-sizing:border-box; height:42px; font-size:16px; padding:6px 10px; border:1px solid #c9ced8; border-radius:8px; background:#fff; color:#1c2230; }
  #popAddType .tf-shapes{ gap:6px; }
  #popAddType .tf-shapes button{ flex:1 1 0; min-width:0; height:42px; border:2px solid #c9ced8; border-radius:10px; background:#fff; padding:0; display:flex; align-items:center; justify-content:center; }
  #popAddType .tf-shapes button.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; background:#eaf3fb; }
  #popAddType .tf-ctl{ display:flex; align-items:center; gap:10px; height:42px; }
  #popAddType .tf-ctl input[type=color]{ width:52px; height:42px; padding:2px; border:1px solid #c9ced8; border-radius:8px; background:#fff; flex:none; } /* (Police) */
  #popAddType .tf-ctl input[type=range]{ flex:1 1 auto; min-width:0; height:30px; accent-color:var(--accent); }
  #popAddType .tf-ctl .mono{ width:24px; text-align:right; font-size:13px; font-weight:600; color:#1c2230; }
  /* v2.1-176 : la forme réelle du poste EST le réglage de couleur (le sélecteur transparent la recouvre) ; sa taille suit le curseur « Taille » */
  #popAddType .tf-preview{ height:68px; }
  #popAddType .type-preview{ position:relative; width:64px; height:64px; flex:none; display:flex; align-items:center; justify-content:center; }
  #popAddType .type-preview #pvShape{ display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #popAddType .type-preview input[type=color]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; padding:0; border:none; cursor:pointer; }
  #popAddType .tf-hint{ font-size:11.5px; color:#5c6478; line-height:1.25; }
  body.night-mode #popAddType .tf-hint{ color:#9aa4b6; }
  #popAddType .chip{ display:flex; align-items:center; gap:8px; height:42px; padding:0 12px; border:1px solid #c9ced8; border-radius:8px; background:#fff; color:#1c2230; font-size:13.5px; cursor:pointer; box-sizing:border-box; }
  #popAddType .chip input{ width:20px; height:20px; margin:0; flex:none; }
  #popAddType .tf-wide{ grid-column:1 / -1; }
  #popAddType:not(.editing) #btnDelType{ display:none; }
  #popAddType #btnDelType{ color:#D6493E; font-weight:600; }
  #popAddType:not(.editing) #btnCancelType{ grid-column:1 / -1; }
  #popAddType .pop-btn{ min-height:44px; }
  #popAddType #btnAddType{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  body.night-mode #popAddType .tf > label:first-child{ color:#9aa4b6; }
  body.night-mode #popAddType .tf-ctl .mono{ color:#e9edf4; }
  /* Menus d'options en pleine largeur (v2.1-55) : étalés horizontalement sur tout l'écran,
     leurs réglages répartis en colonnes côte à côte (autant que la largeur le permet),
     au lieu d'une liste verticale étroite qui descendait loin sur le plan. Les titres de
     section, séparateurs et astuces occupent toute la largeur pour garder la lisibilité. */
  body.mobile-mode .popover{
    left:8px !important; right:8px; max-width:none; min-width:0;
    max-height:none; overflow:visible;
  }
  body.mobile-mode .popover.open{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    column-gap:12px; row-gap:4px; align-items:center;
  }
  body.mobile-mode .popover .pop-section-title,
  body.mobile-mode .popover .pop-divider,
  body.mobile-mode .popover .pop-row{ margin:3px 0; }
  body.mobile-mode .popover .pop-btn{ margin-top:3px; }
  .pop-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:11.5px;color:#5c6478;flex-wrap:wrap;}
  .pop-row label{width:82px;flex:none;}
  .pop-row label.ico, body.mobile-mode .pop-row label.ico{width:28px;display:flex;align-items:center;justify-content:center;} /* v2.1-111 : icône à la place du mot (Luminosité, Contraste, Saturation, Teinte) */
  .pop-row input[type=range]{flex:1;accent-color:var(--accent);}
  .pop-row input[type=text]{border:1px solid #d8dce3;border-radius:6px;padding:5px 7px;font-size:16px;color:#2a3142;}
  .pop-btn{
    width:100%;background:#f6f7f9;border:1px solid #d8dce3;color:#2a3142;border-radius:7px;
    padding:7px 8px;font-size:12px;margin-top:6px;text-align:left;
  }
  .pop-btn:hover{background:#eef2fb;border-color:var(--accent);}
  .pop-btn.danger:hover{background:#fbeaea;border-color:var(--danger);color:var(--danger);}
  .pop-section-title{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#8890a0;font-weight:700;margin:2px 0 6px;}
  .pop-divider{height:1px;background:#e3e6eb;margin:10px 0;}
  .pop-tool-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:#f6f7f9;border:1px solid #d8dce3;color:#2a3142;border-radius:8px;
    padding:8px 6px;font-size:10.5px;min-height:44px;justify-content:center;
  }
  .pop-tool-btn:hover{background:#eef2fb;border-color:var(--accent);}
  .pop-tool-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---------- Menu deroulant du poste actif (couleur + forme visibles) ---------- */
  .dd-wrap{position:relative;flex:none;}
  .dd-btn{
    display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #d8dce3;border-radius:8px;
    padding:5px 9px;font-size:12.5px;color:#2a3142;min-width:190px;max-width:230px;height:38px;
  }
  .dd-btn:hover{border-color:var(--accent);}
  .dd-label{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dd-caret{color:#8890a0;font-size:10px;}
  .dd-cap{display:none;}
  .dd-swatch{width:20px;height:20px;flex:none;}
  .dd-list{
    /* Largeur adaptée au nom le plus long (plus de noms coupés par « … ») et hauteur libre :
       tous les postes visibles d'un coup, sans défilement. Plafonds de sécurité seulement
       pour ne jamais dépasser l'écran (le défilement ne réapparaît que si l'écran est trop
       petit pour tout afficher). */
    position:fixed;min-width:270px;width:max-content;max-width:calc(100vw - 16px);
    max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow-y:auto; /* v2.1-162 : dvh = hauteur réelle visible sur iPhone (barre Safari) */
    background:#fff;border:1px solid #d8dce3;border-radius:10px;box-shadow:0 12px 30px rgba(20,26,40,.22);
    z-index:1000;display:none;padding:5px;box-sizing:border-box;
  }
  .dd-list.open{display:block;}
  .dd-item{display:flex;align-items:center;gap:9px;padding:8px 9px;font-size:12.5px;color:#2a3142;border-radius:7px;cursor:pointer;}
  .dd-item:hover{background:#eef2fb;}
  /* v2.1-154 : poste choisi = confirmation visuelle nette : pastille ✓ verte à gauche + barre bleue + nom en gras */
  .dd-item.selected{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent);font-weight:600;}
  .dd-item{position:relative;padding-left:22px;}
  .dd-item.flash{animation:ddFlash .28s ease-out;}
  @keyframes ddFlash{0%{background:#2E9E6B;transform:scale(1.03);}100%{background:#bfe8d3;transform:scale(1);}}
  .dd-item.selected::before{content:'✓';position:absolute;left:3px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;background:#2E9E6B;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .dd-item .code{font-weight:700;min-width:30px;flex:none;text-align:center;}
  /* Nom complet : sur une seule ligne si la place le permet, sinon renvoyé à la ligne
     (petit écran) — jamais tronqué. */
  .dd-item .nm{flex:1;white-space:nowrap;}
  @media (max-width:520px){ .dd-item .nm{white-space:normal;} }
  /* v2.1-149 : taille de chaque poste directement dans la liste (− n +), nom sur 2 lignes si besoin */
  .dd-item .nm{ line-height:1.2; }
  .dd-item .dd-col{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; } /* nom sur 2 lignes max. + taille du poste dessous */
  .dd-item .dd-col .nm{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .dd-item .sz-ctl{ display:flex; align-items:center; gap:2px; flex:none; }
  .dd-item .sz-ctl button{ width:26px; height:26px; border-radius:50%; border:1px solid #d8dce3; background:#fff; color:#D98400; font-size:16px; font-weight:700; line-height:1; padding:0; cursor:pointer; touch-action:none; }
  .dd-item .sz-ctl .sz-n{ min-width:22px; text-align:center; font-size:12px; font-weight:700; color:#1c2230; }
  body.night-mode .dd-list{ background:#1b2230; border-color:#394258; }
  body.night-mode .dd-item.selected{ background:#1f4468; color:#fff; } /* v2.1-164 : fond clair + texte clair = illisible la nuit */
  body.night-mode .dd-item:hover{ background:#26324a; }
  body.night-mode .dd-item{ color:#e9edf4; } body.night-mode .dd-item:hover{ background:#242c3c; } body.night-mode .dd-item .sz-ctl .sz-n{ color:#e9edf4; }
  .dd-item-actions{display:flex;align-items:center;gap:1px;flex:none;}
  .dd-item-btn{flex:none;width:22px;height:22px;border:none;background:transparent;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#7a8496;cursor:pointer;padding:0;}
  .dd-item-btn:hover{background:#dfe4ee;color:#1c2230;}
  .dd-item-btn:disabled{opacity:.3;cursor:default;}
  .dd-item-btn:disabled:hover{background:transparent;}
  .dd-item-btn[data-act="edit"]{color:#C0392B;border:1.5px solid #C0392B;background:#FBEAE8;margin-left:3px;}
  .dd-item-btn[data-act="edit"]:hover{background:#C0392B;color:#fff;}

  /* ---------- Canvas area ---------- */
  #canvasWrap{
    position:fixed;top:52px;left:0;right:0;bottom:0;
    display:flex;overflow:auto;overscroll-behavior:contain;
  }
  /* v2.1-118 : la zone de dessin (#konvaContainer) déborde de SHEET_MARGIN autour de la feuille, pour que cadre,
     mains et poignées du plan restent visibles et utilisables hors de la page. #sheetBox = zone de dessin entière
     (c'est elle qui défile et se centre) ; #sheetShadowHost = la feuille blanche seule, avec son ombre. */
  #sheetBox{position:relative;margin:auto;flex:none;}
  #sheetShadowHost{position:absolute;box-shadow:var(--sheet-shadow);background:#fff;}
  /* Pendant un pincement à deux doigts, l'ombre (grand flou) est retirée : la repeindre à
     chaque image sur une feuille agrandie coûtait cher (v2.1-62). */
  #sheetShadowHost.pinching{box-shadow:none;}
  #konvaContainer{position:absolute;left:0;top:0;touch-action:none;}
  #konvaContainer.cutting-active, #konvaContainer.pipette-active{cursor:crosshair;}
  /* On masque la scrollbar native du navigateur : la navigation passe désormais par les
     bandeaux ci-dessous, plus larges et plus fiables au doigt qu'un appui prolongé. */
  #canvasWrap{scrollbar-width:none;}
  #canvasWrap::-webkit-scrollbar{display:none;}

  /* ---------- Bandeaux de défilement (bas / droite), à faire glisser ---------- */
  :root{ --scrollband-size:40px; }
  body.mobile-mode{ --scrollband-size:52px; }
  .scroll-band{
    position:fixed;z-index:450;background:rgba(28,34,48,.07);
    display:none;touch-action:none;
  }
  .scroll-band.visible{display:block;}
  .scroll-band-h{ left:0;right:var(--scrollband-size);bottom:0;height:var(--scrollband-size); }
  .scroll-band-v{ top:var(--topbar-h);right:0;bottom:var(--scrollband-size);width:var(--scrollband-size); }
  .scroll-thumb{
    position:absolute;background:rgba(14,111,168,.45);border-radius:999px;
    pointer-events:none;transition:background .15s;
  }
  .scroll-band-h .scroll-thumb{ top:6px;bottom:6px; }
  .scroll-band-v .scroll-thumb{ left:6px;right:6px; }
  .scroll-band:active .scroll-thumb{ background:rgba(14,111,168,.7); }

  /* ---------- Mode mobile Android : barre de tuiles compacte ---------- */
  /* Test demandé : au lieu d'étaler tous les boutons (quitte à déborder sur plusieurs
     lignes), le bandeau mobile devient une seule ligne de TUILES pleine largeur. Un appui
     bref sur une tuile déroule ses options juste en dessous (en tiroir flottant, sans
     agrandir le bandeau) ; un second appui sélectionne la fonction. La tuile reste
     visiblement active tant que l'outil correspondant est utilisé. Objectif : un bandeau
     minimal pour garder un maximum de visibilité sur le plan lui-même. */
  body.mobile-mode #topbar{
    height:auto; min-height:0; gap:0; padding:4px 6px 6px; flex-direction:column;
    align-items:stretch; flex-wrap:nowrap; overflow:visible; white-space:normal;
  }
  body.mobile-mode .topbar-row1{ display:flex; align-items:center; }
  body.mobile-mode #topbar > .tb-group,
  body.mobile-mode #topbar > .sep:not(:first-of-type){ display:none; }
  #mobileTileBar{ display:none; }
  body.mobile-mode #mobileTileBar{
    display:flex; width:100%; gap:3px;
  }
  body.mobile-mode #mobileTileBar .mtile{
    flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; padding:7px 2px 6px; border-radius:9px;
    background:#F1F3F6; border:none; cursor:pointer; color:var(--ink); font-family:inherit;
  }
  body.mobile-mode #mobileTileBar .mtile .icon{ width:21px; height:21px; }
  body.mobile-mode #mobileTileBar .mtile .lbl{
    font-size:10px; font-weight:600; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; max-width:100%;
  }
  /* v2.1-126 (essai) : 7e tuile coupée en deux, Annuler | Rétablir, toujours à portée du pouce */
  body.mobile-mode #mobileTileBar .mtile-split{ flex:1.5 1 0; min-width:0; display:flex; gap:2px; }
  body.mobile-mode #mobileTileBar .mtile-split button{
    flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; padding:7px 0 6px;
    background:#F1F3F6; border:none; border-radius:9px; cursor:pointer; color:var(--ink);
  }
  body.mobile-mode #mobileTileBar .mtile-split button .icon{ width:22px; height:22px; }
  body.mobile-mode #mobileTileBar .mtile-split button:active{ background:var(--accent-soft); }
  body.mobile-mode #mobileTileBar .mtile-split button:disabled{ opacity:.55; cursor:default; } /* v2.1-167 : inactif mais lisible (.35 -> .55) */
  /* "en cours d'utilisation" : soit le tiroir de cette tuile est ouvert, soit (si aucun
     tiroir n'est ouvert) un outil de sa catégorie est actuellement sélectionné. Une seule
     tuile à la fois peut être active (voir updateMobileTileActiveState). */
  body.mobile-mode #mobileTileBar .mtile.active{ background:var(--accent); color:#fff; }
  /* Le tiroir d'une tuile réutilise le même groupe de boutons que la version PC (aucune
     logique dupliquée) : on le fait juste flotter en pleine largeur sous la barre de
     tuiles au lieu de l'étaler dans le bandeau. */
  /* v2.1-94 : tous les tiroirs ont la hauteur du plus haut (--drawer-h, voir equalizeDrawerHeights). */
  body.mobile-mode .tb-group.mobile-open{
    box-sizing:border-box; min-height:var(--drawer-h, 0px);
  }
  /* v2.1-106 : tiroir Pastille — toutes les cases alignées sur la même ligne médiane */
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open{ align-items:center; }
  body.mobile-mode .tb-group.mobile-open{
    display:flex !important; position:fixed; left:6px; right:6px; z-index:900;
    background:#fff; border-radius:12px; box-shadow:0 16px 36px rgba(20,26,40,.3);
    padding:10px; flex-wrap:wrap; row-gap:8px; max-height:none; overflow:visible;
    max-width:none;
  }
  /* v2.1-117 — ESSAI : fond des tiroirs réglable par le curseur « Fond » (tuile Vue), net, sans flou.
     --drawer-alpha = opacité du blanc (1 = opaque, 0 = transparent) ; l'ombre disparaît quand le fond s'allège. */
  body.mobile-mode .tb-group.mobile-open{ background:rgba(255,255,255,var(--drawer-alpha,1)); }
  body.mobile-mode .tb-group.mobile-open, body.mobile-mode .popover{ -webkit-backdrop-filter:none; backdrop-filter:none; }
  body.drawer-ghost.mobile-mode .tb-group.mobile-open, body.drawer-ghost .popover{ box-shadow:none; border:1px solid rgba(255,255,255,.6); }
  body.mobile-mode .popover{ background:rgba(255,255,255,var(--drawer-alpha,1)); }
  body.mobile-mode .tb-icon{
    height:auto; min-height:54px; width:64px; min-width:64px; font-size:22px; border-radius:10px;
    flex-direction:column; gap:3px; padding:6px 2px 5px; box-sizing:border-box;
  }
  /* v2.1-92 : UNE seule ligne de texte sous l'icône, boutons de taille identique dans tous les tiroirs. */
  body.mobile-mode .tb-icon .tb-icon-label{
    font-size:9.5px; font-weight:600; line-height:1.15; text-align:center; color:inherit;
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  body.mobile-mode .tb-icon .icon{width:22px;height:22px;}
  /* v2.1-139 : cadenas à deux dessins (fermé / ouvert) : la classe is-open du bouton choisit lequel s'affiche */
  .pop-btn .pop-ico{display:inline-block;vertical-align:middle;margin-right:10px;}
  .pop-tool-btn .icon{flex:none;}
  /* v2.1-167 : TOUS les contours d'icônes (tuiles, tiroirs, menus) en noir pur et un peu plus épais (largeur constante à l'écran, quelle que
     soit la taille du dessin d'origine) : les contours bleu nuit fin paraissaient gris. */
  svg.icon [fill="#222331"], svg.icon [fill="#25212D"], svg.icon [fill="#25284F"], svg.icon [fill="#1F1A35"]{ fill:#000; stroke:#000; stroke-width:.7px; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  svg.icon [stroke="#25212D"], svg.icon [stroke="#222331"], svg.icon [stroke="#08425f"]{ stroke:#000; }
  .tb-icon .lock-open{display:none;}
  /* v2.1-163 : point orange discret = le fichier .json n'est pas à jour */
  #btnSave.file-stale, #mobileTileBar .mtile.file-stale{ position:relative; }
  #btnSave.file-stale::after, #mobileTileBar .mtile.file-stale::after{ content:''; position:absolute; top:4px; right:5px; width:10px; height:10px; border-radius:50%; background:#F59E0B; border:2px solid #fff; box-sizing:content-box; }
  .tb-icon.is-open .lock-open{display:inline;}
  .tb-icon.is-open .lock-closed{display:none;}
  /* v2.1-138 : pastille blanche derrière l'icône d'un bouton ACTIF (le contour sombre des nouvelles icônes se voyait mal sur le fond bleu) */
  body.mobile-mode .tb-icon.active .icon{background:#fff;border-radius:7px;padding:2px;box-sizing:content-box;}
  body.mobile-mode .sep{height:36px;}
  /* v2.1-129 : icônes de chaque tiroir sur UNE ligne en portrait (largeur partagée, plus de 64 px fixes). Les conteneurs
     .pop-wrap deviennent « transparents » pour que leurs boutons se partagent la ligne ; le menu déroulant garde sa position fixe. */
  body.mobile-mode .tb-group.mobile-open{ gap:2px; padding:8px 6px; }
  body.mobile-mode .tb-group.mobile-open .pop-wrap{ display:contents; }
  body.mobile-mode .tb-group.mobile-open > .tb-icon, body.mobile-mode .tb-group.mobile-open .pop-wrap > .tb-icon{ flex:1 1 0; width:auto; min-width:34px; padding-left:1px; padding-right:1px; }
  body.mobile-mode .tb-group.mobile-open .tb-icon .tb-icon-label{ font-size:9px; letter-spacing:-.1px; }
  body.mobile-mode .tb-group.mobile-open .sep{ margin:0; }
  body.mobile-mode .tb-group.mobile-open #zoomLabel{ width:34px; font-size:11px; }
  body.mobile-mode .tb-group.mobile-open #pageIndicator{ min-width:0 !important; flex:1 1 0; padding:0 !important; font-size:11px !important; }
  body.mobile-mode #autoSaveIndicator{ display:none !important; } /* l'heure de sauvegarde est affichée dans le bandeau (✓ hh:mm) */
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .dd-wrap{ flex:1 1 120px; min-width:0; }
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .dd-btn{ min-width:0; width:100%; }
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .size-preview{ flex:none; }
  body.mobile-mode .dd-btn{height:52px;min-width:170px;font-size:14px;}
  body.mobile-mode .dd-swatch{width:24px;height:24px;}
  body.mobile-mode .tb-check{font-size:12.5px;}
  body.mobile-mode .brand{font-size:16px;}
  body.mobile-mode .popover{min-width:260px;padding:14px;}
  body.mobile-mode .pop-row{font-size:13px;margin:10px 0;}
  body.mobile-mode .pop-row label{width:96px;}
  body.mobile-mode .pop-btn{padding:11px 10px;font-size:13.5px;}
  /* ---------- Contextual floating mini toolbar for selection ---------- */
  /* Ces 3 barres (sélection, validation de découpe rectangle/point par point) sont
     désormais TOUJOURS ancrées en bas de l'écran, quel que soit le mode PC/mobile actif :
     positionnées près de l'élément concerné, elles pouvaient atterrir en plein milieu du
     plan et rester figées là par-dessus le contenu, sans aucun moyen de les déplacer. */
  /* v2.1-151 : l'ancienne barre sombre n'est plus jamais affichée ; elle ne sert que de réserve (cachée) aux contrôles avant leur passage dans un tiroir / une fenêtre */
  #selectionBar{display:none !important;}
  /* v2.1-107 : options du texte dans le tiroir Texte (style clair, comme le reste du tiroir) */
  #textOptions{display:none;flex-basis:100%;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 4px 2px;margin-top:2px;border-top:1px solid #e3e6ec;}
  #textOptions.has-text{display:flex;}
  #textOptions button{background:#F1F3F6;border:1px solid #d8dce3;color:#1c2230;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;}
  #textOptions button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  #textOptions #selBgNone{display:none !important;} /* v2.1-108 : ∅ retiré du tiroir Texte */
  #textOptions label{font-size:11px;color:#5c6478 !important;}

  #textOptions input[type=range]{width:100px;}
  /* v2.1-124 : fenêtre de réglages ouverte par l'icône bleue d'une pastille / de la légende (même style que « Outils image ») */
  #popSelSettings .sel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  #popSelSettings .sel-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5c6478;}
  #selSettingsClose{width:30px;height:30px;border-radius:50%;border:1px solid #d8dce3;background:#fff;color:#2B3242;font-size:16px;line-height:1;padding:0;cursor:pointer;}
  #selSettingsBody{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;} /* v2.1-125 : une seule ligne sur smartphone */
  #selSettingsBody > *{display:inline-flex;}
  #selSettingsBody button{background:#F1F3F6;border:1px solid #d8dce3;color:#1c2230;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;}
  #selSettingsBody button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  #selSettingsBody label{font-size:11px;color:#5c6478 !important;}
  #selSettingsBody button.sqB{width:26px;height:26px;padding:0;border-radius:50%;background:#fff;border:1px solid #d8dce3;color:#D98400;font-size:17px;}
  #selSettingsBody #selSizeMinus, #selSettingsBody #selSizePlus{display:none !important;} /* remplacés par la barre − / + (buildRangeB) */
  #selSettingsBody input[type=color]{width:34px;height:32px;border:none;padding:0;border-radius:4px;background:none;}
  #selSettingsBody #selLabel{background:#fff !important;color:#1c2230 !important;border:1px solid #c9ced8 !important;}
  /* v2.1-130 : adaptations AUTOMATIQUES à l'ordinateur (souris + écran large, classe body.desk posée par applyDeviceClass) :
     barre de tuiles, tiroirs et fenêtres de réglages restent dans une colonne centrée au lieu de s'étaler sur tout l'écran. */
  body.desk #mobileTileBar{ max-width:620px; margin:0 auto; }
  body.desk .topbar-row1{ justify-content:center; }
  body.desk.mobile-mode .tb-group.mobile-open{ left:max(6px, calc(50% - 310px)); right:max(6px, calc(50% - 310px)); }
  body.desk.mobile-mode .popover{ left:max(8px, calc(50% - 310px)) !important; right:auto; width:min(460px, calc(100vw - 16px)); max-width:none; min-width:0; }
  body.desk .tb-icon{ max-width:92px; }
  /* v2.1-149 : tiroir Vue = UNE seule ligne (icônes + curseur « Fond » compact) pour limiter la hauteur de la fenêtre */
  body.mobile-mode .tb-group[data-tile="vue"].mobile-open{ flex-wrap:nowrap; align-items:center; }
  body.mobile-mode .tb-group[data-tile="vue"].mobile-open #zoomLabel{ display:none; }
  #drawerAlphaRow{ display:flex; flex-direction:column; align-items:stretch; flex:0 0 76px; padding:0 4px; }
  #drawerAlphaRow > span{ font-size:9px; font-weight:700; color:#5c6478; text-align:center; line-height:1; }
  #drawerAlphaRow .rngB{ min-width:0; width:100%; flex:none; }
  body.night-mode #drawerAlphaRow > span{ color:#b8c1d1; }
  /* v2.1-148 : tiroir Pastille en 2 LIGNES, comme le tiroir Texte : ligne 1 = icônes avec libellés (placement classique / déporté,
     grille, flèches, verrouillage de tout, taille d'un poste) ; ligne 2 = poste actif + taille de la prochaine pastille (curseur
     pleine largeur) — qui règle aussi la pastille sélectionnée. */
  #btnAddTypeMenu{ display:none; }
  .tb-group #btnUndo, .tb-group #btnRedo{ display:none; } /* v2.1-148 : doublon avec la tuile Annuler | Rétablir (les boutons restent dans la page : raccourcis, icônes de la tuile) */
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open{ flex-wrap:wrap; align-items:center; gap:2px; padding:8px 6px; }
  /* v2.1-152 : UNE seule ligne : 6 icônes + liste des postes (la taille se règle dans la liste) */
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .dd-wrap{ flex:0 0 50px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; }
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .tb-icon .tb-icon-label{ font-size:8.5px; letter-spacing:-.25px; } /* 7 icônes + liste sur une ligne */
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .dd-cap{ display:block; font-size:9px; font-weight:600; line-height:1.15; color:inherit; }
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .dd-btn{ min-width:0; width:100%; padding:0 6px; gap:4px; height:34px; justify-content:center; }
  body.mobile-mode .tb-group[data-tile="pastille"].mobile-open .dd-label{ flex:none; max-width:30px; }
  /* v2.1-148 : « taille d'un poste » (fenêtre orange sous les tuiles) */
  #sizeAllWin{ position:fixed; left:50%; top:calc(var(--topbar-h, 96px) + 8px); transform:translateX(-50%); z-index:790; display:none; flex-direction:column; gap:8px;
    width:min(340px, calc(100vw - 16px)); box-sizing:border-box; background:#F59E0B; color:#1c2230; border-radius:14px; padding:12px; font-size:13px; font-weight:500; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  #sizeAllWin.show{ display:flex; }
  #sizeAllWin .sz-cur{ font:inherit; font-size:14px; padding:6px 10px; border:none; border-radius:8px; background:#fff; color:#1c2230; width:100%; display:flex; align-items:center; gap:9px; text-align:left; }
  #sizeAllWin .sz-cur .nm, #sizeAllWin .sz-item .nm{ flex:1; line-height:1.2; white-space:normal; }
  #sizeAllWin .sz-cur .code, #sizeAllWin .sz-item .code{ font-weight:700; min-width:26px; text-align:center; }
  #sizeAllWin .sz-list{ display:none; flex-direction:column; background:#fff; border-radius:8px; padding:4px; max-height:200px; overflow-y:auto; }
  #sizeAllWin .sz-list.open{ display:flex; }
  #sizeAllWin .sz-item{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:6px; font-size:13px; color:#1c2230; cursor:pointer; }

  #sizeAllWin .sz-row input[type=range]{ flex:1 1 auto; min-width:0; accent-color:#1c2230; }

  #sizeAllWin .sz-btns button{ font:inherit; padding:8px 14px; border:none; border-radius:8px; background:#1c2230; color:#fff; }
  /* v2.1-158 : « Contrôle des numéros » (trous et doublons dans les séries E1, E2…) — même fenêtre orange sous les tuiles */
  /* v2.1-168 : fenêtre « Dessin » : orange, minimaliste, sous les tuiles */
  #drawWin{ position:fixed; left:50%; top:calc(var(--topbar-h, 96px) + 8px); transform:translateX(-50%); z-index:790; display:none; flex-direction:column; gap:8px;
    width:min(340px, calc(100vw - 16px)); box-sizing:border-box; background:#F59E0B; color:#1c2230; border-radius:14px; padding:10px; box-shadow:0 4px 14px rgba(0,0,0,.3); }

  #drawWin .dw-w{ display:block; width:60%; background:#1c2230; border-radius:2px; }
  /* v2.1-175 : les OUTILS (1re rangée) s'allument en plein sombre ; les RÉGLAGES (2e rangée : épaisseur, pointillé, remplissage) s'indiquent par un simple
     cadre sombre, pour ne plus ressembler à un outil resté actif. En mode Sélection sans dessin choisi, les réglages sont estompés (ils ne

  #ctrlWin{ position:fixed; left:50%; top:calc(var(--topbar-h, 96px) + 8px); transform:translateX(-50%); z-index:790; display:none; flex-direction:column; gap:8px;

  /* v2.1-145 : fenêtres de découpe = fenêtres flottantes ORANGE sous les tuiles (comme les autres), plus de barre sombre en bas */

  body #cutConfirmBar > span, body #pointCutBar > span{ flex:1 1 100%; }
  body #cutConfirmBar button, body #pointCutBar button{ background:#fff7e6; border:none; color:#1c2230; border-radius:8px; padding:9px 12px; font-size:13px; }
  body #cutConfirmBar button:hover, body #pointCutBar button:hover{ background:#fff0d0; }
  body #cutConfirmBar #cutConfirmYes, body #pointCutBar #pointCutClose{ background:#1c2230; color:#fff; }
  body #cutConfirmBar #cutConfirmYes:hover, body #pointCutBar #pointCutClose:hover:not(:disabled){ background:#2c3650; }
  /* v2.1-146 : flèches de déplacement fin = fenêtre orange flottante SOUS LES TUILES (comme les autres), ouverte par l'icône « déplacement fin »
     du tiroir Pastille ; elle porte aussi une croix pour la refermer. */
  #selNudge{ position:fixed; left:50%; top:calc(var(--topbar-h, 96px) + 8px); transform:translateX(-50%); z-index:790; display:none; align-items:center; gap:8px;
    background:#F59E0B; padding:8px 10px; border-radius:24px; box-shadow:0 2px 8px rgba(0,0,0,.25); touch-action:none; user-select:none; -webkit-user-select:none; }
  #selNudge.show{ display:flex; }
  body #selNudge button{ width:44px; height:40px; border:none; border-radius:20px; background:#1c2230; color:#fff; font-size:20px; line-height:1; font-weight:700; touch-action:none; }
  body #selNudge button:active{ background:#2c3650; }
  body #selNudge button.nudge-close{ width:36px; background:#fff7e6; color:#1c2230; font-size:16px; }
  /* v2.1-143 : tuiles plus visibles en mode JOUR (proposition D choisie par Mic) : fond blanc, bordure grise, ombre légère et liseré
     de couleur par tuile. Les modes Soleil et Nuit gardent leurs propres règles (d'où le :not). */
  body.mobile-mode:not(.night-mode) #mobileTileBar .mtile,
  body.mobile-mode:not(.night-mode) #mobileTileBar .mtile-split button{ background:#fff; border:1px solid #BFC7D4; border-bottom-width:5px; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  body.mobile-mode.night-mode #mobileTileBar .mtile, body.mobile-mode.night-mode #mobileTileBar .mtile-split button{ border-style:solid; border-width:1px 1px 5px; border-top-color:#394258; border-left-color:#394258; border-right-color:#394258; } /* v2.1-155 : liserés de couleur aussi la nuit */
  body #mobileTileBar .mtile[data-tile="page"]{ border-bottom-color:#2B3242; }
  body.night-mode #mobileTileBar .mtile[data-tile="page"]{ border-bottom-color:#8A94AA; } /* sombre sur sombre : éclairci la nuit */
  body #mobileTileBar .mtile[data-tile="vue"]{ border-bottom-color:#2AA6B0; }
  body #mobileTileBar .mtile[data-tile="historique"]{ border-bottom-color:#0E6FA8; }
  body #mobileTileBar .mtile[data-tile="plan"]{ border-bottom-color:#7A5AD8; }
  body #mobileTileBar .mtile[data-tile="pastille"]{ border-bottom-color:#D6493E; }
  body #mobileTileBar .mtile[data-tile="texte"]{ border-bottom-color:#E8A83C; }
  body #mobileTileBar #mtileUndo, body #mobileTileBar #mtileRedo{ border-bottom-color:#2E9E6B; } /* v2.1-154 : liseré de couleur aussi pour Annuler / Rétablir */
  body:not(.night-mode) #mobileTileBar .mtile.active{ background:var(--accent); }
  /* v2.1-142 : bouton d'affichage à 3 états (Jour / Soleil / Nuit) : seul le dessin du mode actif est visible */
  #btnSun .th-night{ display:none; }
  body.night-mode #btnSun .th-day{ display:none; }
  body.night-mode #btnSun .th-night{ display:block; }
  /* v2.1-142 : mode « nuit » — barre, tuiles, tiroirs et fenêtres sombres, feuille inchangée (blanche). Les icônes ont un contour
     sombre : elles gardent une petite pastille claire derrière elles pour rester lisibles sur le fond sombre. */
  body.night-mode{ --ink:#e9edf4; --ink-dim:#9aa4b6; --bg:#0d1017; }
  body.night-mode #topbar{ background:#161b26; border-bottom:1px solid #2a3243; }
  body.night-mode #topbar .brand{ color:#e9edf4; }
  body.night-mode #mobileTileBar .mtile, body.night-mode #mobileTileBar .mtile-split button{ background:#242c3c; color:#e9edf4; }
  body.night-mode #mobileTileBar .mtile-split button:disabled{ opacity:.85; } /* v2.1-155 : Annuler / Rétablir inactifs restent proches des autres tuiles */
  body.night-mode #mobileTileBar .mtile.active{ background:#0E6FA8; color:#fff; }
  body.night-mode #mobileTileBar .mtile .icon, body.night-mode #mobileTileBar .mtile-split .icon, body.night-mode .tb-icon .icon{ background:#eef1f6; border-radius:7px; padding:2px; box-sizing:content-box; }
  body.night-mode .tb-icon{ color:#e9edf4; }
  body.night-mode .tb-icon .tb-icon-label{ color:#e9edf4; }
  body.night-mode .tb-icon:hover{ background:#2a3243; }
  body.night-mode.mobile-mode .tb-group.mobile-open, body.night-mode .popover{ background:rgba(22,27,38,var(--drawer-alpha,1)) !important; color:#e9edf4; }
  body.night-mode .pop-btn, body.night-mode .pop-tool-btn, body.night-mode .doc-row{ background:#242c3c; color:#e9edf4; border-color:#394258; }
  body.night-mode .doc-row .doc-name{ color:#e9edf4; } body.night-mode .doc-row .doc-meta{ color:#9aa4b6; }
  body.night-mode .pop-row, body.night-mode .pop-row label, body.night-mode .pop-section-title, body.night-mode #popSelSettings .sel-title, body.night-mode #zoomLabel, body.night-mode #pageIndicator{ color:#b8c1d1 !important; }
  body.night-mode .rngB-track{ background:#394258; }
  body.night-mode .sqB, body.night-mode .step-btn, body.night-mode #selSettingsClose, body.night-mode #selNudge button{ background:#242c3c; border-color:#394258; }
  body.night-mode #selNudge button{ color:#e9edf4; }
  body.night-mode .rngE-val, body.night-mode .size-ctl-row .val, body.night-mode .doc-empty{ color:#e9edf4; }
  body.night-mode #canvasWrap{ background:#0d1017; }
  body.night-mode #saveBadge{ color:#6fd49a !important; }
  /* v2.1-126 : liste « Mes documents » */
  #docsList{display:flex;flex-direction:column;gap:8px;}
  .doc-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e3e6ec;border-radius:10px;background:#fff;}
  .doc-row.current{border-color:var(--accent);background:var(--accent-soft);}
  .doc-row .doc-info{flex:1 1 auto;min-width:0;}
  .doc-row .doc-name{font-size:13.5px;font-weight:600;color:#1c2230;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-row .doc-meta{font-size:11px;color:#5c6478;}
  .doc-row button{border:1px solid #d8dce3;background:#F1F3F6;color:#1c2230;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none;}
  .doc-row button.open{background:var(--accent);border-color:var(--accent);color:#fff;}
  .doc-empty{font-size:12.5px;color:#5c6478;padding:6px 2px;}
  #selNudge button{width:34px;height:36px;border-radius:9px;border:1px solid #d8dce3;background:#F1F3F6;color:#1c2230;font-size:17px;font-weight:700;line-height:1;padding:0;cursor:pointer;touch-action:manipulation;}
  #selNudge button:active{background:var(--accent-soft);border-color:var(--accent);}
  #selSettingsBody .rngE-val{display:none;} /* gagne de la place : la taille se voit sur la pastille */
  #selSettingsBody #selSizeWrap{flex:1 1 auto;min-width:0;}
  #selSettingsBody .rngB{min-width:56px;}
  #selSettingsBody #selLabel{width:62px !important;min-width:0;}
  #selSettingsBody #selColorLabel{display:none;} /* le carré de couleur suffit : gagne de la place */

  /* v2.1-151 : base commune des fenêtres de découpe (l'aspect orange et la position sont dans « body #cutConfirmBar, body #pointCutBar » plus haut) */
  #cutConfirmBar, #pointCutBar{ position:fixed; z-index:470; display:none; gap:8px; align-items:center; flex-wrap:wrap; box-sizing:border-box; }
  #pointCutBar button:disabled{ opacity:.4; cursor:not-allowed; }

  /* Text edit overlay */
  #textEditArea{
    position:fixed;z-index:460;display:none;resize:none;border:2px solid var(--accent);
    background:rgba(255,255,255,.96);outline:none;padding:2px;border-radius:2px;
  }
  #textEditConfirm{
    position:fixed;z-index:461;display:none;background:var(--accent);color:#fff;border:none;
    border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.3);
  }
  #textEditConfirm:hover{background:#2559c9;}

  /* Toast */
  /* v2.1-150 : plus de bandeau sombre en bas — même fenêtre flottante orange que la bulle, sous les tuiles */
  #toast{
    position:fixed;top:calc(var(--topbar-h,96px) + 8px);left:50%;transform:translateX(-50%) translateY(-10px);
    max-width:calc(100vw - 32px);background:#F59E0B;color:#1c2230;padding:8px 16px;border-radius:18px;
    font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.25);text-align:center;
    opacity:0;transition:all .25s ease;z-index:900;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* Bulle flottante (v2.1-71) : notification qui reste affichée jusqu'à hideBubble() */
  #bubble{
    position:fixed;top:calc(var(--topbar-h, 96px) + 8px);left:50%;transform:translateX(-50%) translateY(-10px); /* v2.1-156 : sous les tuiles (64 px les recouvrait) */
    max-width:calc(100vw - 32px);background:#F59E0B;color:#1c2230;padding:8px 16px;
    border-radius:18px;font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.25);
    opacity:0;transition:all .25s ease;z-index:800;pointer-events:none;text-align:center;
  }
  #bubble.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #bubble.tappable{pointer-events:auto;cursor:pointer;}
</style>

/* ---------------------------- Sauvegarde automatique (IndexedDB) ---------------- */
// On utilise IndexedDB (et non localStorage, limité à ~5 Mo) car les plans importés
// sont des images encodées en base64 qui peuvent peser plusieurs Mo par page.
// Le document entier (toutes les pages) est réécrit après chaque modification
// (avec un léger anti-rebond), afin qu'une fermeture accidentelle de l'onglet ou
// du navigateur ne fasse jamais perdre le travail en cours.
const IDB_NAME = 'PlanPestControlDB';
const IDB_STORE = 'autosave';
const IDB_IMG_STORE = 'images'; // v2.1-105 : les grosses images (plans, logos) sont enregistrées UNE SEULE FOIS, à part
const IDB_SNAP_STORE = 'snaps'; // v2.1-161 : « Restaurer » = SNAP_KEEP versions automatiques (une toutes les SNAP_EVERY_MS), mêmes images à part
const SNAP_KEEP = 5, SNAP_EVERY_MS = 10*60*1000;
let lastSnapAt = 0;
const IDB_DOCS_STORE = 'docs';   // v2.1-126 : « Mes documents » = les DOC_KEEP derniers documents (version légère, images à part)
const DOC_KEEP = 5;
const IDB_KEY = 'currentDoc';
let idbPromise = null;
function openIDB(){
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if (!window.indexedDB){ reject(new Error('IndexedDB indisponible')); return; }
    const req = indexedDB.open(IDB_NAME, 4); // v2 : magasin d'images ; v3 : magasin « docs » (les anciennes sauvegardes restent lisibles)
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if (!db.objectStoreNames.contains(IDB_IMG_STORE)) db.createObjectStore(IDB_IMG_STORE);
      if (!db.objectStoreNames.contains(IDB_DOCS_STORE)) db.createObjectStore(IDB_DOCS_STORE);
      if (!db.objectStoreNames.contains(IDB_SNAP_STORE)) db.createObjectStore(IDB_SNAP_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return idbPromise;
}
// Avant (v2.1-104 et plus ancien) : à CHAQUE sauvegarde, tout le document était recopié, y compris les images
// de plan (plusieurs Mo, en double : image affichée + image d'origine). Maintenant : le document ne contient plus
// que des références {__img:clé} vers les grosses images, écrites une seule fois par contenu (clé = empreinte +
// longueur) ; une sauvegarde ordinaire n'écrit donc que quelques Ko. Les images devenues inutiles sont supprimées.
const IDB_BIG_STRING = 4000;
const imgKeyCache = new Map();   // dataURL -> clé (l'empreinte d'une chaîne de plusieurs Mo n'est calculée qu'une fois)
const storedImgKeys = new Set(); // clés déjà présentes dans IndexedDB pendant cette session
function imgKeyFor(str){
  let k = imgKeyCache.get(str);
  if (k) return k;
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  k = 'img-' + (h>>>0).toString(36) + '-' + str.length;
  if (imgKeyCache.size > 60) imgKeyCache.clear(); // évite l'accumulation d'anciennes images en mémoire
  imgKeyCache.set(str, k);
  return k;
}
// Copie légère des pages : seules les propriétés porteuses d'images sont remplacées par des références.
function pagesWithImageRefs(srcPages, needed){
  const ref = (v)=>{
    if (typeof v === 'string' && v.length > IDB_BIG_STRING){ const k = imgKeyFor(v); needed.set(k, v); return { __img:k }; }
    return v;
  };
  return srcPages.map(pg=>Object.assign({}, pg, {
    plans: (pg.plans||[]).map(pl=>Object.assign({}, pl, { dataURL:ref(pl.dataURL), originalDataURL:ref(pl.originalDataURL) })),
    logos: (pg.logos||[]).map(lg=>Object.assign({}, lg, { dataURL:ref(lg.dataURL) })),
  }));
}

function imgRefsOf(snap){
  const keys = new Set();
  const scan = (v)=>{ if (v && typeof v === 'object' && v.__img) keys.add(v.__img); };
  ((snap && snap.pages) || []).forEach(pg=>{ (pg.plans||[]).forEach(pl=>{ scan(pl.dataURL); scan(pl.originalDataURL); }); (pg.logos||[]).forEach(lg=>scan(lg.dataURL)); });
  return keys;
}
// Un document mérite une place dans « Mes documents » seulement s'il contient quelque chose (un projet vide ne doit pas
// chasser un vrai document de la liste de 5).
function docHasContent(pgs){ return (pgs||[]).some(pg=>(pg.plans||[]).length || (pg.pastilles||[]).length); }
// Entretien après chaque sauvegarde : ne garde que les DOC_KEEP documents les plus récents, puis supprime les images que
// plus aucun document (courant ou liste) n'utilise. Une seule transaction, requêtes chaînées.
function idbMaintain(db){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction([IDB_STORE, IDB_IMG_STORE, IDB_DOCS_STORE, IDB_SNAP_STORE], 'readwrite');
    const docs = tx.objectStore(IDB_DOCS_STORE), imgs = tx.objectStore(IDB_IMG_STORE), snaps = tx.objectStore(IDB_SNAP_STORE);
    const sAll = snaps.getAll(), sKeys = snaps.getAllKeys(); // v2.1-161 : versions automatiques (même ménage)
    const all = docs.getAll(), allKeys = docs.getAllKeys(); // `all` est servi avant `allKeys` : les deux sont prêts dans allKeys.onsuccess
    allKeys.onsuccess = ()=>{
      const rows = (all.result||[]).map((d,i)=>({ key:allKeys.result[i], doc:d }));
      rows.sort((a,b)=>(b.doc.savedAt||0)-(a.doc.savedAt||0));
      const kept = rows.slice(0, DOC_KEEP);
      rows.slice(DOC_KEEP).forEach(r=>docs.delete(r.key));
      const cur = tx.objectStore(IDB_STORE).get(IDB_KEY);
      cur.onsuccess = ()=>{
        const needed = new Set(imgRefsOf(cur.result));
        kept.forEach(r=>imgRefsOf(r.doc).forEach(k=>needed.add(k)));
        const srows = (sAll.result||[]).map((d,i)=>({ key:sKeys.result[i], doc:d })).sort((a,b)=>(b.doc.savedAt||0)-(a.doc.savedAt||0));
        srows.slice(SNAP_KEEP).forEach(r=>snaps.delete(r.key));
        srows.slice(0, SNAP_KEEP).forEach(r=>imgRefsOf(r.doc).forEach(k=>needed.add(k)));
        const ks = imgs.getAllKeys();
        ks.onsuccess = ()=>{ (ks.result||[]).forEach(k=>{ if (!needed.has(k)){ imgs.delete(k); storedImgKeys.delete(k); } }); };
      };
    };
    tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error); tx.onabort = ()=>reject(tx.error);
  });
}
async function idbSave(data){
  try{
    const db = await openIDB();
    const needed = new Map();
    const light = Object.assign({}, data, { pages: pagesWithImageRefs(data.pages, needed), imgRefs:true });
    const fresh = [...needed.keys()].filter(k=>!storedImgKeys.has(k));
    await new Promise((resolve, reject)=>{
      const tx = db.transaction([IDB_STORE, IDB_IMG_STORE, IDB_DOCS_STORE, IDB_SNAP_STORE], 'readwrite');
      const imgs = tx.objectStore(IDB_IMG_STORE);
      fresh.forEach(k=>imgs.put(needed.get(k), k));
      tx.objectStore(IDB_STORE).put(light, IDB_KEY);
      if (data.docId && docHasContent(data.pages)) tx.objectStore(IDB_DOCS_STORE).put(light, data.docId); // même document léger, rangé dans la liste
      if (docHasContent(data.pages) && Date.now() - lastSnapAt >= SNAP_EVERY_MS){ tx.objectStore(IDB_SNAP_STORE).put(light, 'snap-'+data.savedAt); lastSnapAt = Date.now(); } // v2.1-161
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
      tx.onabort = ()=>reject(tx.error);
    });
    fresh.forEach(k=>storedImgKeys.add(k));
    await idbMaintain(db);
    return true;
  } catch(err){ console.warn('Sauvegarde automatique impossible :', err); return false; }
}
// Remet les images d'un document léger (références {__img}) ; un ancien document (images en clair) est rendu tel quel.
async function idbHydrate(db, snap){
  if (!snap || !snap.imgRefs) return snap;
  const keys = imgRefsOf(snap);
  const imgs = {};
  await new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_IMG_STORE, 'readonly');
    const st = tx.objectStore(IDB_IMG_STORE);
    keys.forEach(k=>{ const r = st.get(k); r.onsuccess = ()=>{ imgs[k] = r.result; }; });
    tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
  });
  const back = (v)=>(v && typeof v === 'object' && v.__img) ? (imgs[v.__img] || '') : v;
  snap.pages.forEach(pg=>{
    (pg.plans||[]).forEach(pl=>{ pl.dataURL = back(pl.dataURL); pl.originalDataURL = back(pl.originalDataURL); });
    (pg.logos||[]).forEach(lg=>{ lg.dataURL = back(lg.dataURL); });
  });
  keys.forEach(k=>storedImgKeys.add(k)); // déjà en base : inutile de les réécrire
  return snap;
}

async function idbLoad(){
  try{
    const db = await openIDB();
    const snap = await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>reject(req.error);
    });
    return await idbHydrate(db, snap);
  } catch(err){ return null; }
}

// reste dans « Mes documents » (ses images aussi : idbMaintain ne supprime que les images devenues inutiles).
async function idbClear(){
  try{
    const db = await openIDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete = resolve;
      tx.onerror = ()=>reject(tx.error);
    });
  } catch(err){ /* rien à faire */ }
}
// Sauvegarde automatique allégée (v2.1-63). Avant : un délai de 0,6 s après CHAQUE changement,
// PLUS une réécriture complète du document toutes les 20 s même sans aucun changement — or le
// document contient les plans en image (plusieurs Mo), recopiés à chaque fois, d'où de petits
// gels réguliers. Maintenant : on ne sauvegarde que s'il y a eu un changement ("dirty"), un peu
// plus tard (1,5 s) et, si le navigateur le permet, à un moment où il n'a rien d'autre à faire.
// Pour ne rien perdre malgré ce délai, la sauvegarde part aussitôt que la page passe en
// arrière-plan (changement d'application sur téléphone, onglet fermé…).
let autoSaveTimer = null;
let autoSaveDirty = false;
const AUTOSAVE_DELAY_MS = 1500;
function scheduleAutoSave(){
  autoSaveDirty = true;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(()=>{
    if ('requestIdleCallback' in window) requestIdleCallback(()=>doAutoSave(), { timeout: 3000 });
    else doAutoSave();
  }, AUTOSAVE_DELAY_MS);
}
function setAutoSaveIndicator(text, isError){
  const el = document.getElementById('autoSaveIndicator');
  const txt = document.getElementById('autoSaveIndicatorText');
  if (!el || !txt) return;
  txt.textContent = text;
  el.style.color = isError ? '#c0392b' : '#5c6478';
  const badge = document.getElementById('saveBadge');
  if (badge){
    const m = /(\d{2}:\d{2})/.exec(text);
    badge.textContent = isError ? '⚠ non sauvegardé' : (m ? '✓ '+m[1] : '');
    badge.classList.toggle('err', !!isError);
  }
}
async function doAutoSave(){
  if (!autoSaveDirty) return; // rien n'a changé depuis la dernière sauvegarde
  autoSaveDirty = false;
  const snapshot = { docVersion:2, pages, currentPageIndex, docName, docId, savedAt: Date.now() };
  const ok = await idbSave(snapshot);
  if (ok){
    const t = new Date(snapshot.savedAt);
    setAutoSaveIndicator('Sauvegardé à '+t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}), false);
  } else {
    autoSaveDirty = true; // échec : on réessaiera au prochain passage du filet ci-dessous
    setAutoSaveIndicator('Sauvegarde auto impossible', true);
  }
}
// Filet de sécurité : ne réessaie QUE s'il reste des modifications non sauvegardées (échec précédent).
setInterval(()=>{ if (autoSaveDirty) scheduleAutoSave(); }, 20000);
// Page passée en arrière-plan : sauvegarde immédiate des modifications en attente.
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'hidden' && autoSaveDirty){ clearTimeout(autoSaveTimer); doAutoSave(); }
});
window.addEventListener('pagehide', ()=>{ if (autoSaveDirty){ clearTimeout(autoSaveTimer); doAutoSave(); } });
// Avertit avant fermeture uniquement si la dernière sauvegarde automatique a échoué.
window.addEventListener('beforeunload', (e)=>{
  const el = document.getElementById('autoSaveIndicator');
  if (el && el.style.color === 'rgb(192, 57, 43)'){ e.preventDefault(); e.returnValue = ''; }
});
// Enregistre tout de suite les modifications en attente (avant de remplacer le document ouvert).
function flushAutoSaveNow(){ clearTimeout(autoSaveTimer); return autoSaveDirty ? doAutoSave() : Promise.resolve(); }

// --- Canevas d'un plan (v2.1-64) -------------------------------------------------
// planNaturalCanvases = la VRAIE image, pleine définition : référence unique pour la pipette,
// le pot de peinture, la gomme, la découpe ET l'export (qualité maximale, jamais réduite).
// planDisplayCanvases = copie RÉDUITE (plus grand côté <= PLAN_DISPLAY_MAX_PX) uniquement pour
// l'ÉCRAN : une photo de 4000 px redessinée à chaque image de rotation/déplacement était très
// lourde pour un téléphone, alors que l'écran ne peut de toute façon pas montrer plus de détail.

const PLAN_DISPLAY_MAX_PX = 2400;
function makeDisplayCanvas(natural){
  const longest = Math.max(natural.width, natural.height);
  if (longest <= PLAN_DISPLAY_MAX_PX) return natural;
  const k = PLAN_DISPLAY_MAX_PX / longest;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(natural.width*k));
  c.height = Math.max(1, Math.round(natural.height*k));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(natural, 0, 0, c.width, c.height);
  return c;
}
function setPlanCanvas(id, natural, dataURL){
  planNaturalCanvases.set(id, natural);
  planDisplayCanvases.set(id, makeDisplayCanvas(natural));
  if (dataURL) planCanvasSource.set(id, dataURL);
}

function refreshPlanDisplay(id, newDataURL){
  const n = planNaturalCanvases.get(id);
  if (n) planDisplayCanvases.set(id, makeDisplayCanvas(n));
  if (newDataURL) planCanvasSource.set(id, newDataURL);
}
function deletePlanCanvases(id){ planNaturalCanvases.delete(id); planDisplayCanvases.delete(id); planCanvasSource.delete(id); }

function cloneModel(m){

  return {
    orientation: m.orientation,
    plans: (m.plans||[]).map(p=>({...p})),
    deviceTypes: m.deviceTypes.map(t=>({...t})),
    pastilles: m.pastilles.map(p=>({...p})),
    anchors: m.anchors.map(a=>({...a})),
    lines: m.lines.map(l=>({...l})),
    textes: m.textes.map(t=>({...t})),
    logos: m.logos.map(l=>({...l})),
    shapes: (m.shapes||[]).map(s=>({...s})),
    legend: { ...m.legend },
  };
}

/* ---------------------------- Historique --------------------------------- */
// L'historique porte sur le document entier (toutes les pages), pas seulement
// la page affichée : un undo/redo reste cohérent même après un changement de page,
// un ajout/suppression de page, etc.
// v2.1-160 : rappel de sauvegarde du FICHIER .json (la vraie protection, surtout sur iPhone). Date du dernier fichier enregistré
// par document (localStorage) + nombre de modifications depuis. Rappel discret : 40 modifications, ou plus de 3 jours à l'ouverture.
const FILE_REMIND_CHANGES = 40, FILE_REMIND_DAYS = 3;
let changesSinceFile = 0, fileReminded = false;
function lastFileSaveOf(id){ try{ return parseInt(localStorage.getItem('ppc_filesave_'+id),10) || 0; }catch(e){ return 0; } }
function agoText(t){
  if (!t) return 'jamais';
  const m = Math.round((Date.now()-t)/60000);
  if (m < 2) return 'à l\'instant';
  if (m < 60) return 'il y a '+m+' min';
  const h = Math.round(m/60); if (h < 24) return 'il y a '+h+' h';
  const d = Math.round(h/24); return 'il y a '+d+' jour'+(d>1?'s':'');
}
// v2.1-163 : plus de bulle (jugée envahissante) : un petit point orange discret sur l'icône Enregistrer et sur la tuile Fichier tant que
// le fichier n'est pas à jour ; il disparaît à l'enregistrement.
function updateFileDot(){
  const lf = lastFileSaveOf(docId), nbP = pages.reduce((n,pg)=>n+pg.pastilles.length,0);
  const stale = docHasContent(pages) && (changesSinceFile >= FILE_REMIND_CHANGES || (lf && Date.now()-lf > FILE_REMIND_DAYS*86400000) || (!lf && nbP >= 10));
  document.getElementById('btnSave').classList.toggle('file-stale', !!stale);
  document.querySelector('#mobileTileBar .mtile[data-tile="historique"]').classList.toggle('file-stale', !!stale);
  fileReminded = !!stale;
}
function pushHistory(){
  if (++changesSinceFile === FILE_REMIND_CHANGES) updateFileDot();
  history = history.slice(0, historyIndex + 1);
  history.push(cloneDoc());
  if (history.length > HISTORY_LIMIT) history.shift();
  historyIndex = history.length - 1;
  updateHistoryButtons();
  scheduleAutoSave();
}
// Les nodes pastilles/textes/logos/légende persistent maintenant entre deux rendus (voir
// renderContent(), optimisation de fluidité) : lors d'un changement de page ou d'un
// undo/redo, on repart d'un état totalement propre plutôt que de laisser d'anciens nodes
// trainer — cause probable d'un bug où la légende ne s'affichait plus de façon fiable en
// naviguant entre les pages.
function resetContentNodeCaches(){
  pastilleNodes.forEach(n=>n.destroy()); pastilleNodes.clear();
  textNodes.forEach(n=>n.destroy()); textNodes.clear();
  logoNodes.forEach(n=>n.destroy()); logoNodes.clear();
  shapeNodes.forEach(n=>n.destroy()); shapeNodes.clear();
  if (legendGroupNode){ legendGroupNode.destroy(); legendGroupNode = null; }
  linesLayerGroup.destroyChildren();
  lastLinesSig = null;
  recapGroup.destroyChildren(); lastRecapSig = null;
}
function restoreDoc(snap){
  resetRemoteGesture(); // v2.1-166
  pages = snap.pages.map(cloneModel);
  currentPageIndex = Math.min(snap.currentPageIndex, pages.length - 1);
  model = pages[currentPageIndex];
  selectedId = null;
  resetContentNodeCaches();
  rehydratePlanCanvas().then(()=>{
    render(); updateOrientButtons(); updatePageIndicator();
  });
  scheduleAutoSave();
}
function undo(){
  if (historyIndex <= 0) return;
  historyIndex--;
  restoreDoc(history[historyIndex]);
  updateHistoryButtons();
}
function redo(){
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  restoreDoc(history[historyIndex]);
  updateHistoryButtons();
}
function updateHistoryButtons(){
  document.getElementById('btnUndo').disabled = historyIndex <= 0;
  document.getElementById('btnRedo').disabled = historyIndex >= history.length - 1;
  document.getElementById('mtileUndo').disabled = historyIndex <= 0; // v2.1-126 : tuile Annuler | Rétablir
  document.getElementById('mtileRedo').disabled = historyIndex >= history.length - 1;
}
(function(){
  const u = document.getElementById('mtileUndo'), r = document.getElementById('mtileRedo');
  u.innerHTML = document.getElementById('btnUndo').innerHTML; // mêmes icônes que le tiroir Historique
  r.innerHTML = document.getElementById('btnRedo').innerHTML;
  u.addEventListener('click', ()=>undo());
  r.addEventListener('click', ()=>redo());
})();

/* ---------------------------- Gestion des pages / étages ------------------ */

function switchToPage(index){

    render(); updateOrientButtons(); updatePageIndicator();

function addBlankPage(sourcePageIndex){
  if (pages.length >= MAX_PAGES){ toast('Nombre maximum de pages atteint ('+MAX_PAGES+').'); return; }
  const src = pages[sourcePageIndex!=null ? sourcePageIndex : 0];
  const newPage = createEmptyModel();

  // position, même taille) tout ce qui forme l'en-tête du document — logos RADICAL +
  // client, textes (adresse du site, date de mise à jour…) et réglage de la légende
  // (position/taille/style ; son contenu, lui, reflète les dispositifs propres à chaque
  // page). Seuls le plan importé, les pastilles, lignes et ancrages restent vierges, prêts
  // pour un nouvel étage.
  newPage.orientation = src.orientation;
  newPage.logos = src.logos.map(l=>({...l}));

// Demande quelle page recopier (logos, textes, légende) avant d'ajouter un étage — inutile

    <button class="pop-btn" id="btnConfirmPageCopy" style="margin-top:10px;background:var(--accent);color:#fff;border-color:var(--accent);text-align:center;font-weight:600;">Ajouter l'étage</button>

document.getElementById('btnPageRecap').addEventListener('click', ()=>addRecapPage());
// v2.1-128 : ajoute (ou affiche) la page « Récapitulatif des postes » — une seule par document, en dernière position.
function addRecapPage(){
  const existing = pages.findIndex(pg=>pg.recap);
  if (existing >= 0){ switchToPage(existing); toast('Page récapitulative déjà présente.'); return; }
  if (pages.length >= MAX_PAGES){ toast('Nombre maximum de pages atteint ('+MAX_PAGES+').'); return; }
  const src = pages[0];
  const np = createEmptyModel();
  np.recap = true;

  np.textes = src.textes.map(t=>({...t, id: nextId('text-')}));
  np.legend = { ...src.legend, visible:false };

function deleteCurrentPage(){
  resetRemoteGesture(); // v2.1-166
  if (pages.length <= 1){ toast('Impossible de supprimer la seule page restante.'); return; }
  const removedIndex = currentPageIndex;
  pages.splice(removedIndex, 1);
  // On ne réutilise pas switchToPage() ici : après un splice(), currentPageIndex peut déjà
  // correspondre numériquement au nouvel index visé, ce qui ferait croire à tort à
  // switchToPage() qu'il n'y a rien à faire (page déjà affichée) — alors que le tableau a
  // changé sous ses pieds. On force donc explicitement le rafraîchissement complet.
  currentPageIndex = Math.min(removedIndex, pages.length - 1);
  model = pages[currentPageIndex];
  selectedId = null;
  transformer.nodes([]);
  resetContentNodeCaches();
  pushHistory();
  rehydratePlanCanvas().then(()=>{
    render(); updateOrientButtons(); updatePageIndicator();
  });

// Nombre total de pastilles déjà posées pour un type de dispositif donné, toutes pages
// confondues : sert à faire continuer la numérotation (R1, R2, R3...) d'une page à l'autre.
// v2.1-113 : prochain numéro libre d'une LETTRE (code du poste), toutes pages confondues. Avant : « nombre de
// pastilles du poste + 1 », d'où des doublons (E1, E3, E3 après suppression de E2 ; un E1 par poste pour deux
// postes de même lettre ; copies « Dupliquer » portant le même numéro). Maintenant : le plus petit numéro
// non utilisé par une étiquette « CODEn » de n'importe quelle page (les trous laissés par une suppression
// sont comblés, jamais de doublon).
function nextFreeLabelNumber(code){
  const re = new RegExp('^'+code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\d+)$');
  const used = new Set();
  pages.forEach(pg=>pg.pastilles.forEach(p=>{ const m = re.exec(p.label||''); if (m) used.add(parseInt(m[1],10)); }));
  let n = 1; while (used.has(n)) n++;
  return n;
}
function nextPastilleLabel(typeId){
  const type = model.deviceTypes.find(t=>t.id===typeId);
  if (type && type.noNumber) return '';
  const code = type ? type.code : '?';
  return code + nextFreeLabelNumber(code);
}
// Déplace la page courante d'une position dans le document (elle reste affichée : seul son
// rang change), sans recharger le plan puisque le contenu affiché ne change pas.
function movePageBy(delta){
  const newIndex = currentPageIndex + delta;
  if (newIndex < 0 || newIndex >= pages.length) return;
  [pages[currentPageIndex], pages[newIndex]] = [pages[newIndex], pages[currentPageIndex]];
  currentPageIndex = newIndex;
  pushHistory();
  updatePageIndicator();
  toast('Page déplacée en position '+(currentPageIndex+1)+'.');
}
document.getElementById('btnPagePrev').addEventListener('click', ()=>switchToPage(currentPageIndex-1));

});
