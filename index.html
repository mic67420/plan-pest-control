function openTextEditor(t, node){
  const area = document.getElementById('textEditArea');
  const confirmBtn = document.getElementById('textEditConfirm');
  const rect = stage.container().getBoundingClientRect();
  const box = node.getClientRect({relativeTo:stage});
  area.style.left = (rect.left + box.x*zoom) + 'px';
  area.style.top = (rect.top + box.y*zoom) + 'px';
  area.style.width = Math.max(120, box.width*zoom) + 'px';
  area.style.height = Math.max(30, box.height*zoom) + 'px';
  area.style.fontSize = Math.max(16, t.fontSize*zoom) + 'px'; // jamais sous 16px : Safari iOS zoome sinon la page entière au focus
  area.style.fontFamily = APP_FONT;
  area.style.color = t.color;
  area.style.textAlign = t.align || 'left';
  area.value = t.text;
  area.style.display = 'block';
  confirmBtn.style.left = (rect.left + box.x*zoom) + 'px';
  confirmBtn.style.top = (rect.top + (box.y+box.height)*zoom + 8) + 'px';
  confirmBtn.style.display = 'block';
  keepFixedBarInViewport(confirmBtn);
  area.focus(); area.select();
  let done = false;
  function commit(){
    if (done) return; done = true;
    t.text = area.value || ' ';
    area.style.display='none';
    confirmBtn.style.display='none';
    area.removeEventListener('blur', onBlur);
    confirmBtn.removeEventListener('click', onConfirmClick);
    // le texte reste sélectionné : la case est de nouveau librement déplaçable/redimensionnable
    selectedId = t.id;
    pushHistory(); render();
  }
  function onBlur(){
    // laisse un court instant pour qu'un clic sur "Valider" soit bien pris en compte
    // avant que le blur ne déclenche sa propre validation.
    setTimeout(()=>{ if (!done) commit(); }, 120);
  }
  function onConfirmClick(){ commit(); }
  area.addEventListener('blur', onBlur);
  confirmBtn.addEventListener('click', onConfirmClick);
}

function escapeAttr(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function starPolygonPoints(numPoints, cx, cy, outerR, innerR){
  const pts=[]; const step = Math.PI/numPoints;
  for(let i=0;i<numPoints*2;i++){
    const r = i%2===0?outerR:innerR;
    const a = i*step - Math.PI/2;
    pts.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}
function shapeSwatchHTML(type, size){
  size = size||20;
  if (type.shape==='burst'){
    const pts = starPolygonPoints(10, size/2, size/2, size*0.48, size*0.34);
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><polygon points="${pts}" fill="${type.color}" stroke="#000" stroke-width="1.4"/></svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${size*0.42}" fill="${type.color}" stroke="#000" stroke-width="1.6"/></svg>`;
}
let lastTypeListSig = null; // évite de reconstruire le HTML de la liste si rien n'a changé (appelé à chaque rendu)
function refreshTypeList(){
  const prev = selectedTypeId;
  if (model.deviceTypes.length===0){ selectedTypeId = null; }
  else if (!model.deviceTypes.find(t=>t.id===prev)){ selectedTypeId = model.deviceTypes[0].id; }
  else { selectedTypeId = prev; }

  // render() appelle cette fonction très souvent (chaque déplacement de pastille, chaque
  // valeur de curseur…) alors que la liste des postes, elle, ne change presque jamais :
  // reconstruire tout son HTML à chaque fois était un gaspillage inutile.
  const sig = JSON.stringify(model.deviceTypes.map(t=>[t.id,t.code,t.name,t.color,t.shape,t.noNumber,t.defaultRadius])) + '|' + selectedTypeId;
  if (sig === lastTypeListSig){ updateDropdownButton(); syncColorPickerToSelectedType(); return; }
  lastTypeListSig = sig;

  const list = document.getElementById('deviceTypeDropdownList');
  list.innerHTML = '';
  model.deviceTypes.forEach((t,idx)=>{
    const row = document.createElement('div');
    row.className = 'dd-item' + (t.id===selectedTypeId ? ' selected':'');
    row.innerHTML = `${shapeSwatchHTML(t,20)}<span class="code">${escapeAttr(t.code)}</span><span class="nm">${escapeAttr(t.name)}</span>
      <span class="dd-item-actions">
        <button class="dd-item-btn" data-act="up" title="Monter dans la liste" ${idx===0?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="dd-item-btn" data-act="down" title="Descendre dans la liste" ${idx===model.deviceTypes.length-1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="dd-item-btn" data-act="edit" title="Modifier le nom / code"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 20l.9-3.6L15.5 6l3.1 3.1L8 19.6 4 20.5Z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg></button>
      </span>`;
    row.addEventListener('click', (e)=>{
      e.stopPropagation();
      const btn = e.target.closest('.dd-item-btn');
      if (btn){
        const act = btn.dataset.act;
        if (act==='up' && idx>0){
          [model.deviceTypes[idx-1], model.deviceTypes[idx]] = [model.deviceTypes[idx], model.deviceTypes[idx-1]];
          pushHistory(); lastTypeListSig=null; refreshTypeList();
        } else if (act==='down' && idx<model.deviceTypes.length-1){
          [model.deviceTypes[idx+1], model.deviceTypes[idx]] = [model.deviceTypes[idx], model.deviceTypes[idx+1]];
          pushHistory(); lastTypeListSig=null; refreshTypeList();
        } else if (act==='edit'){
          startEditType(t.id);
        }
        return;
      }
      selectedTypeId = t.id;
      closeAllPopovers();
      lastTypeListSig=null; refreshTypeList();
    });
    list.appendChild(row);
  });
  updateDropdownButton();
  syncColorPickerToSelectedType();
}

/* ---------------------------- Boutons − / + et pastille témoin (v2.1-68) ----------------- */
// Taille réellement utilisée pour la PROCHAINE pastille : un poste peut imposer sa propre taille
// par défaut (souris, rat…), sinon c'est le réglage du curseur.
function effectiveNextRadius(){
  const type = model.deviceTypes.find(t=>t.id===selectedTypeId);
  return (type && type.defaultRadius) ? type.defaultRadius : currentPastilleRadius;
}
// Pastille TÉMOIN : dessinée à la taille réelle qu'aura la prochaine pastille sur la feuille, au
// zoom actuel (diamètre = 2 × rayon × zoom), même couleur, même forme, même étiquette que la vraie.
// Si elle dépasse le cadre, elle est réduite et une mention le précise. Le contenu n'est refait
// que si quelque chose a changé (signature), car cette fonction est appelée à chaque rendu.
let lastSizePreviewSig = null;
function updateSizePreview(){
  const shapeEl = document.getElementById('pastilleSizePreviewShape');
  if (!shapeEl) return;
  const noteEl = document.getElementById('pastilleSizePreviewNote');
  const type = model.deviceTypes.find(t=>t.id===selectedTypeId);
  const r = effectiveNextRadius();
  const label = (type && type.noNumber) ? '' : (type ? type.code : '?') + (countPastillesOfType(selectedTypeId)+1);
  const MAX_D = 40;                       // diamètre maximal du témoin (px écran) — v2.1-94 : 84 -> 40 (rayon 20)
  const realD = 2*r*zoom;
  const k = realD > MAX_D ? MAX_D/realD : 1;
  const R = Math.max(2, r*zoom*k);
  const note = (type && type.defaultRadius) ? 'taille propre au poste' : (k < 1 ? 'aperçu réduit à '+Math.round(k*100)+' %' : '');
  const color = type ? type.color : '#0E6FA8';
  const shape = (type && type.shape) || 'circle';
  const sig = [color, shape, label, R.toFixed(1), note].join('|');
  if (sig === lastSizePreviewSig) return;
  lastSizePreviewSig = sig;
  const pad = 6, S = Math.ceil(2*R + 2*pad);
  const ringW = Math.max(1.6, r*0.14)*zoom*k, whiteW = Math.max(1, r*0.05)*zoom*k;
  const c = S/2;
  const shapeSvg = shape === 'burst'
    ? '<polygon points="'+starPolygonPoints(10, c, c, R, R*0.74)+'" fill="url(#pvGrad)" stroke="#ffffff" stroke-width="'+whiteW+'"/>'
      + '<polygon points="'+starPolygonPoints(10, c, c, R, R*0.74)+'" fill="none" stroke="#000" stroke-width="'+ringW+'"/>'
    : '<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="url(#pvGrad)" stroke="#ffffff" stroke-width="'+whiteW+'"/>'
      + '<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="none" stroke="#000" stroke-width="'+ringW+'"/>';
  const fs = label ? fontSizeForLabel(label, r)*zoom*k : 0;
  const text = label ? '<text x="'+c+'" y="'+c+'" fill="#fff" font-weight="700" font-size="'+fs.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-family="'+APP_FONT.replace(/'/g,'&quot;')+'">'+escapeAttr(label)+'</text>' : '';
  shapeEl.innerHTML = '<svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'">'
    + '<defs><radialGradient id="pvGrad" cx="35%" cy="35%" r="80%"><stop offset="0" stop-color="'+lighten(color,32)+'"/><stop offset="0.55" stop-color="'+color+'"/><stop offset="1" stop-color="'+darken(color,18)+'"/></radialGradient></defs>'
    + shapeSvg + text + '</svg>';
  noteEl.textContent = note;
  shapeEl.parentElement.title = 'Pastille témoin : taille réelle sur la feuille, au zoom actuel' + (note ? ' ('+note+')' : '');
}
// Bouton maintenu = répétition de plus en plus rapide (appui bref = 1 cran). Utilisé pour − et +.
// "step" : +1 ou −1 ; "read"/"write" : lecture et écriture de la valeur ; "onEnd" : appelé UNE fois à
// la fin du geste (ex. enregistrer dans l'historique).
function bindStepper(btn, step, read, write, onEnd){
  let delayTimer = null, repeatTimer = null, changed = false;
  function doStep(){ if (write(read()+step)) changed = true; keepPastilleDrawerOpen(); }
  function stop(){
    clearTimeout(delayTimer); clearInterval(repeatTimer); delayTimer = repeatTimer = null;
    if (changed){ changed = false; if (onEnd) onEnd(); }
  }
  btn.addEventListener('pointerdown', (e)=>{
    e.preventDefault(); e.stopPropagation();
    try{ btn.setPointerCapture(e.pointerId); }catch(err){ /* sans conséquence */ }
    stop(); doStep();
    delayTimer = setTimeout(()=>{
      let n = 0;
      repeatTimer = setInterval(()=>{
        doStep(); n++;
        if (n === 8){ clearInterval(repeatTimer); repeatTimer = setInterval(doStep, 45); } // accélère après quelques crans
      }, 110);
    }, 380);
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', e=>e.preventDefault());
}
// Un tiroir de tuile se referme après 5 s sans activité : un appui long sur − / + compte comme activité.
function keepPastilleDrawerOpen(){
  if (pastilleDrawerTimer){ schedulePastilleDrawerClose(); return; } // v2.1-86 : minuteur de 2 s du tiroir Pastille
  if (typeof tileRepeatCloseTimer !== 'undefined' && tileRepeatCloseTimer){
    clearTimeout(tileRepeatCloseTimer);
    tileRepeatCloseTimer = setTimeout(closeAllTileDrawers, TILE_REPEAT_CLICK_DELAY_MS);
  }
}
// v2.1-109 : transforme un <input type=range> en barre « modèle B » (voir CSS .rngB). La valeur affichée dans la
// poignée est tenue à jour par l'événement 'input' ET par un intercepteur de la propriété .value (le code
// modifie parfois .value directement, sans événement).
function buildRangeB(input, opts){
  opts = opts || {};
  const wrap = document.createElement('div'); wrap.className = 'rngB';
  const track = document.createElement('div'); track.className = 'rngB-track';
  const fill = document.createElement('div'); fill.className = 'rngB-fill'; track.appendChild(fill);
  const handle = document.createElement('div'); handle.className = 'rngB-handle';
  input.parentNode.insertBefore(wrap, input);
  wrap.append(track, handle, input); input.classList.add('rngB-input');
  let valEl = null; // valeur chiffrée à droite (v2.1-110), créée avec les boutons − / +
  const sync = ()=>{
    const min = parseFloat(input.min), max = parseFloat(input.max), v = parseFloat(input.value);
    const pct = max > min ? Math.max(0, Math.min(1, (v-min)/(max-min))) : 0;
    const x = 'calc(8px + (100% - 16px) * '+pct+')';
    fill.style.width = x; handle.style.left = x;
    if (valEl) valEl.textContent = Math.round(v);
  };
  const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  Object.defineProperty(input, 'value', { get(){ return desc.get.call(this); }, set(v){ desc.set.call(this, v); sync(); }, configurable:true });
  input.addEventListener('input', sync);
  if (opts.buttons){
    const mk = (txt, dir)=>{
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sqB'; b.textContent = txt; b.setAttribute('aria-label', dir<0 ? 'Diminuer' : 'Augmenter');
      const write = (v)=>{ const nv = Math.max(parseFloat(input.min), Math.min(parseFloat(input.max), Math.round(v))); if (nv === parseFloat(input.value)) return false; input.value = nv; input.dispatchEvent(new Event('input', { bubbles:true })); return true; };
      bindStepper(b, dir, ()=>parseFloat(input.value), write, ()=>input.dispatchEvent(new Event('change', { bubbles:true })));
      return b;
    };
    const minus = mk('−', -1), plus = mk('+', +1);
    valEl = document.createElement('span'); valEl.className = 'rngE-val';
    wrap.parentNode.insertBefore(minus, wrap);
    wrap.parentNode.insertBefore(plus, wrap.nextSibling);
    plus.parentNode.insertBefore(valEl, plus.nextSibling);
  }
  sync();
  return wrap;
}

function positionFloating(trigger, el){
  const rect = trigger.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 6;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  requestAnimationFrame(()=>{
    const elRect = el.getBoundingClientRect();
    let newLeft = left, newTop = top;
    if (elRect.right > window.innerWidth - 8) newLeft = Math.max(8, window.innerWidth - elRect.width - 8);
    if (elRect.bottom > window.innerHeight - 8) newTop = Math.max(8, rect.top - elRect.height - 6);
    el.style.left = newLeft + 'px';
    el.style.top = newTop + 'px';
  });
}
function closeAllPopovers(){

  pop.addEventListener('click', (e)=>e.stopPropagation());
}

/* ---------------------------- Barre de tuiles (mode mobile) --------------------- */
// Un appui bref sur une tuile déroule le groupe de boutons correspondant (le même que la
// version PC, juste affiché en tiroir flottant) ; un second appui sur un bouton du tiroir
// sélectionne la fonction et referme le tiroir. La tuile reste visuellement "active" tant
// que l'outil de sa catégorie est en cours d'utilisation, même une fois le tiroir refermé.
// Une seule tuile est mise en avant à la fois (jamais deux en même temps) : en priorité
// celle dont le tiroir est ouvert, sinon celle qui correspond à l'outil actuellement actif.
const TILE_TOOL_CATEGORIES = {

};
// Poignée "main rouge" : permet de glisser la barre de sélection n'importe où sur l'écran
// plutôt que de rester figée en bas au centre. Les propriétés CSS de la barre utilisent
// !important pour rester ancrées par défaut (voir plus haut) : on les surcharge donc aussi
// avec la priorité !important côté JS (seul moyen de l'emporter), uniquement une fois qu'on
// commence à la glisser.
function makeBarDraggable(barEl, handleEl){
  let dragging = false, startX=0, startY=0, startLeft=0, startTop=0;
  function onDown(e){
    e.stopPropagation();
    const pt = e.touches ? e.touches[0] : e;
    dragging = true;
    const rect = barEl.getBoundingClientRect();
    startX = pt.clientX; startY = pt.clientY;
    startLeft = rect.left; startTop = rect.top;
    // La barre est en pleine largeur (ancrée aux deux bords) : on fige sa largeur actuelle
    // avant de la détacher, sinon elle se rétrécirait d'un coup au premier mouvement.
    barEl.style.setProperty('width', rect.width+'px', 'important');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
  }
  function onMove(e){
    if (!dragging) return;
    if (e.cancelable) e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    let newLeft = startLeft + (pt.clientX - startX);
    let newTop = startTop + (pt.clientY - startY);
    newLeft = Math.max(4, Math.min(window.innerWidth - barEl.offsetWidth - 4, newLeft));
    newTop = Math.max(4, Math.min(window.innerHeight - barEl.offsetHeight - 4, newTop));
    barEl.style.setProperty('left', newLeft+'px', 'important');
    barEl.style.setProperty('top', newTop+'px', 'important');
    barEl.style.setProperty('bottom', 'auto', 'important');
    barEl.style.setProperty('right', 'auto', 'important');
    barEl.style.setProperty('transform', 'none', 'important');
  }
  function onUp(){
    dragging = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchend', onUp);
    if (typeof updateCanvasBottomReserve === 'function') updateCanvasBottomReserve();
  }
  handleEl.addEventListener('mousedown', onDown);
  handleEl.addEventListener('touchstart', onDown, {passive:true});
}

// Tiroir Pastille (v2.1-86) : fermeture après 2 s sans appui, sauf si un sous-menu (liste des postes,

const PASTILLE_DRAWER_CLOSE_MS = 10000; // v2.1-111 : tiroirs affichés 10 s (5 s à la demande de Mic : trop court)
let pastilleDrawerTimer = null;
function schedulePastilleDrawerClose(){
  clearTimeout(pastilleDrawerTimer);
  pastilleDrawerTimer = setTimeout(()=>{
    // On repousse seulement si le choix du poste ou l'ajout de poste (tiroir Pastille) est en cours de saisie.
    if (document.querySelector('#popAddType.open') || document.querySelector('#deviceTypeDropdownList.open')){ schedulePastilleDrawerClose(); return; }
    closeAllTileDrawers();
  }, PASTILLE_DRAWER_CLOSE_MS);

  document.querySelectorAll('.tb-group.mobile-open').forEach(g=>{ g.classList.remove('mobile-open'); g.style.top=''; });
  updateMobileTileActiveState();

}
// Mesure le tiroir le plus haut et impose cette hauteur à tous (v2.1-94).
function equalizeDrawerHeights(){
  let max = 0;
  document.querySelectorAll('.tb-group[data-tile]').forEach(g=>{
    const was = g.classList.contains('mobile-open');
    const old = g.style.cssText;
    g.style.visibility = 'hidden'; g.style.minHeight = '0px';
    const to = g.querySelector('#textOptions'); const toOld = to ? to.style.display : ''; if (to) to.style.display = 'none'; // v2.1-107 : options du texte non comptées
    g.classList.add('mobile-open');
    max = Math.max(max, g.getBoundingClientRect().height);
    if (to) to.style.display = toOld;
    if (!was) g.classList.remove('mobile-open');
    g.style.cssText = old;
  });
  if (max > 0) document.documentElement.style.setProperty('--drawer-h', Math.ceil(max)+'px');
}
function openTileDrawer(tileId, allowToggle=true){
  const group = document.querySelector('.tb-group[data-tile="'+tileId+'"]');
  if (!group) return;
  const wasOpen = group.classList.contains('mobile-open');
  if (wasOpen && !allowToggle) return; // déjà ouvert (ex. par le survol) : rien à faire
  closeAllTileDrawers();
  if (wasOpen) return; // un appui sur une tuile déjà ouverte la referme simplement
  equalizeDrawerHeights();
  const barRect = document.getElementById('mobileTileBar').getBoundingClientRect();
  group.style.top = (barRect.bottom + 6) + 'px';
  group.classList.add('mobile-open');

// Limité aux vrais pointeurs souris (pointerType 'mouse') : sur un écran tactile, le
// navigateur simule aussi un "survol" juste avant le tap, ce qui aurait ouvert puis

/* ---------------------------- Barre du haut : orientation / zoom / grille ------- */
// En changeant d'orientation, la largeur et la hauteur de la feuille s'échangent : un
// élément ancré à un bord (ex. le logo client à droite, la légende en bas à droite) se
// retrouvait donc décalé, voire carrément hors feuille, si sa position n'était pas
// réajustée. Un ancien essai (v2.1-22) réinitialisait ces éléments à une position par
// défaut fixe — corrigé depuis (v2.1-24) car ça écrasait un ajustement manuel déjà fait.
// La bonne approche : préserver la MARGE actuelle de chaque élément par rapport au bord
// auquel il est ancré (calculée avant le changement, réappliquée après), plutôt qu'une
// position fixe — ça respecte un ajustement manuel (une marge plus grande ou plus petite
// que la valeur par défaut reste identique) tout en s'adaptant correctement au nouveau
// format. Le logo entreprise (ancré en haut à gauche) n'a besoin d'aucun ajustement : x et
// y ne dépendent ni de la largeur ni de la hauteur de la feuille.
function adjustCornerElementsForOrientationSwitch(oldW, oldH, newW, newH){
  const clientLogo = model.logos.find(l=>l.which==='client');
  if (clientLogo){
    const marginRight = oldW - (clientLogo.x + clientLogo.width);
    clientLogo.x = newW - clientLogo.width - marginRight;
  }
  if (model.legend){
    // Largeur/hauteur réellement affichées à l'écran (dépendent du nombre de postes
    // listés) recalculées avec la même formule que le rendu de la légende, pour que la
    // marge préservée soit celle réellement visible plutôt qu'une estimation approximative.
    const usedIds = new Set(model.pastilles.map(p=>p.typeId));
    let types = model.deviceTypes;
    if (model.legend.onlyUsed) types = types.filter(t=>usedIds.has(t.id));
    const scale = model.legend.scale || 1;
    const legendW = 300 * scale;
    const legendH = (34 + 14*2 + Math.max(types.length,0)*30) * scale;
    const marginRight = oldW - (model.legend.x + legendW);
    const marginBottom = oldH - (model.legend.y + legendH);
    model.legend.x = newW - legendW - marginRight;
    model.legend.y = newH - legendH - marginBottom;
  }
  const dateText = model.textes.find(t=>t.text && t.text.startsWith('Mise à jour le'));
  if (dateText){
    const h = dateText.height || 26;
    const marginBottom = oldH - (dateText.y + h);
    dateText.y = newH - h - marginBottom;
  }
}
// v2.1-96 : les 4 éléments de coin sont-ils encore EXACTEMENT sur le préréglage de cette orientation ?
function cornerElementsAtPreset(orient){
  const P = CORNER_PRESETS[orient], near = (a,b)=>Math.abs(a-b) < 1;
  const co = model.logos.find(l=>l.which==='entreprise'), cl = model.logos.find(l=>l.which==='client');
  const dt = model.textes.find(t=>t.text && t.text.startsWith('Mise à jour le')), ad = model.textes.find(t=>t.id==='text-client-address');
  if (co && !(near(co.x,P.companyLogo.x) && near(co.y,P.companyLogo.y) && near(co.width,P.companyLogo.width))) return false;
  if (cl && !(near(cl.x,P.clientLogo.x) && near(cl.y,P.clientLogo.y))) return false;
  if (dt && !(near(dt.x,P.date.x) && near(dt.y,P.date.y))) return false;
  if (ad && !(near(ad.x,P.address.x) && near(ad.y,P.address.y))) return false;
  if (model.legend && !(near(model.legend.x,P.legend.x) && near(model.legend.y,P.legend.y))) return false;
  return true;
}
function applyCornerPreset(orient){
  const P = CORNER_PRESETS[orient];
  const co = model.logos.find(l=>l.which==='entreprise'), cl = model.logos.find(l=>l.which==='client');
  const dt = model.textes.find(t=>t.text && t.text.startsWith('Mise à jour le')), ad = model.textes.find(t=>t.id==='text-client-address');
  if (co){ const ratio = co.height/co.width; co.x = P.companyLogo.x; co.y = P.companyLogo.y; co.width = P.companyLogo.width; co.height = P.companyLogo.width*ratio; }
  if (cl){ cl.x = P.clientLogo.x; cl.y = P.clientLogo.y; }
  if (dt){ dt.x = P.date.x; dt.y = P.date.y; }
  if (ad){ ad.x = P.address.x; ad.y = P.address.y; }
  if (model.legend){ model.legend.x = P.legend.x; model.legend.y = P.legend.y; }
}
// Bascule d'orientation : préréglage de la nouvelle orientation si rien n'a été déplacé à la main, sinon marges préservées.
function switchOrientationWithCorners(newOrient){
  const oldOrient = model.orientation;
  const pristine = cornerElementsAtPreset(oldOrient);
  if (pristine) applyCornerPreset(newOrient);
  else if (newOrient === 'portrait') adjustCornerElementsForOrientationSwitch(SHEET_H, SHEET_W, SHEET_W, SHEET_H);
  else adjustCornerElementsForOrientationSwitch(SHEET_W, SHEET_H, SHEET_H, SHEET_W);
  model.orientation = newOrient;
}

/* ---------------------------- Export ------------------------------------------- */
// Attend que toutes les images des logos actuellement affichés aient fini de se charger.
// Nécessaire car un logo est recréé (voir renderContent -> logos) à chaque page visitée
// pendant l'export multi-pages (les nodes sont réinitialisés entre deux pages, voir
// resetContentNodeCaches) : sans attendre ce chargement, la capture pouvait intervenir
// AVANT que l'image ne soit prête (le décodage d'une image, même encodée directement dans
// le fichier, reste asynchrone) — laissant le logo entreprise et/ou client manquant à
// l'export de façon imprévisible, selon lequel des deux finissait de charger à temps.
function waitForLogoImages(){
  const pending = [];
  logoNodes.forEach(node=>{
    const img = node.image();
    if (img && !img.complete){
      pending.push(new Promise(resolve=>{
        img.onload = ()=>{ contentLayer.batchDraw(); resolve(); };
        img.onerror = resolve; // ne bloque jamais l'export si une image est invalide
      }));
    }
  });
  return pending.length ? Promise.all(pending) : Promise.resolve();
}
function withCleanStage(fn){
  const wasSelected = selectedId;
  selectedId = null; transformer.nodes([]);
  updateLockIndicator(); // masque aussi les icônes de rotation et le cadenas : jamais dans l'image exportée
  setGridVisible(false); ghostGroup.visible(false); uiLayer.batchDraw();
  const result = fn();
  setGridVisible(gridVisible); ghostGroup.visible(true);
  selectedId = wasSelected; render();
  return result;
}
// Avant une capture d'export (v2.1-64) : chaque plan est redessiné depuis son image PLEINE
// définition (et non la copie réduite de l'écran), et ceux qui ont un réglage d'image
// (luminosité, contraste…) sont recalculés à la finesse de l'export. Les nodes sont marqués
// "à rafraîchir" : le render() qui suit la capture (withCleanStage) les remet à l'état d'écran.
function prepareStageForExport(){
  model.plans.forEach(p=>{
    const node = planImageNodes.get(p.id), natural = planNaturalCanvases.get(p.id);
    if (!node || !natural) return;
    node.image(natural);
    if (node.isCached()){
      node.clearCache();
      node.cache({ pixelRatio: Math.max(2, Konva.pixelRatio) });
    }
    node._forceRefresh = true;
  });
}
// Capture de la feuille pour l'EXPORT. La couche "fond blanc" n'existe plus à l'écran
// (v2.1-62) : le blanc est donc ajouté ici, derrière l'image, avant l'encodage. Le résultat est
// identique à l'ancien (feuille opaque, fond blanc) ; mêmes pixelRatio et qualité qu'avant.
function exportStageDataURL(mimeType, quality, pixelRatio){
  const cv = stage.toCanvas({ pixelRatio });
  const out = document.createElement('canvas');
  out.width = cv.width; out.height = cv.height;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(cv, 0, 0);
  return out.toDataURL(mimeType, quality);
}
// Parcourt toutes les pages du document, capture une image de chacune (dans son
// orientation propre), puis restaure la page affichée avant l'export. Utilisé pour les
// exports multi-pages (PDF). Les exports PNG/JPEG/PPTX ci-dessous restent, eux, limités
// à la page actuellement affichée à l'écran.
async function captureAllPagesAsImages(mimeType, quality){
  const originalIndex = currentPageIndex;
  const images = [];
  // Pendant la capture, les pastilles et la légende sont redessinées en VECTORIEL (pas depuis
  // leur image mise en cache) : netteté maximale à l'export (v2.1-65).
  bitmapCacheEnabled = false;
  try{
  for (let i=0; i<pages.length; i++){
    currentPageIndex = i;
    model = pages[i];
    selectedId = null; transformer.nodes([]);
    resetContentNodeCaches();
    await rehydratePlanCanvas();
    render();
    await waitForLogoImages(); // sans ça, un logo pouvait manquer à la capture (voir waitForLogoImages)
    const dataUrl = withCleanStage(()=>{ prepareStageForExport(); return exportStageDataURL(mimeType, quality, 2); });
    images.push({ dataUrl, orientation: model.orientation });
  }
  } finally { bitmapCacheEnabled = true; }
  currentPageIndex = originalIndex;
  model = pages[originalIndex];
  resetContentNodeCaches();
  await rehydratePlanCanvas();
  render(); updateOrientButtons(); updatePageIndicator();
  return images;
}
// Télécharge un seul fichier, ou regroupe plusieurs pages dans un .zip : sur mobile
// (Safari iOS en particulier), déclencher plusieurs téléchargements séparés à la suite
// est peu fiable (souvent bloqués au-delà du premier) ; un unique fichier .zip est le
// moyen le plus sûr de récupérer toutes les pages en une fois.
async function downloadImagesAsFileOrZip(images, ext, baseName){
  if (images.length === 1){
    downloadDataURL(images[0].dataUrl, baseName+'.'+ext);
    return;
  }
  const zip = new JSZip();
  images.forEach((img, i)=>{
    const base64 = img.dataUrl.split(',')[1];
    zip.file(baseName+'-page'+(i+1)+'.'+ext, base64, {base64:true});
  });
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = baseName+'.zip';
  a.click();
  URL.revokeObjectURL(url);
}

  const images = await captureAllPagesAsImages('image/jpeg', 0.95);
  const title = (docName || 'plan-pest-control').replace(/[<>&"]/g,'');
  const html = '<!doctype html><html><head><meta charset="utf-8"><title>'+title+'</title><style>'
    + '@page portrait{size:A4 portrait;margin:0}@page landscape{size:A4 landscape;margin:0}'
    + 'html,body{margin:0;padding:0}.p{page-break-after:always;break-after:page;overflow:hidden}'
    + '.p.portrait{page:portrait;width:210mm;height:297mm}.p.landscape{page:landscape;width:297mm;height:210mm}'
    + '.p img{width:100%;height:100%;display:block}</style></head><body>'
    + images.map(im=>'<div class="p '+(im.orientation==='portrait'?'portrait':'landscape')+'"><img src="'+im.dataUrl+'"></div>').join('')
    + '</body></html>';
  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  document.body.appendChild(frame);
  frame.onload = ()=>{
    const w = frame.contentWindow;
    const imgs = Array.from(w.document.images);
    Promise.all(imgs.map(i=>i.complete ? 0 : new Promise(r=>{ i.onload = i.onerror = r; }))).then(()=>{
      w.focus(); w.print();
      setTimeout(()=>frame.remove(), 60000); // laisse le temps à la boîte d'impression de lire le contenu
    });
  };
  frame.srcdoc = html;
});

document.getElementById('btnExportPDF').addEventListener('click', async ()=>{
  closeAllPopovers();
  const base = await ensureDocName(); if (!base) return;
  const images = await captureAllPagesAsImages('image/jpeg', 0.95);
  const { jsPDF } = window.jspdf;
  let pdf = null;
  images.forEach(img=>{
    const orient = img.orientation==='portrait' ? 'p':'l';
    const w = orient==='p'?A4_W_MM:A4_H_MM, h = orient==='p'?A4_H_MM:A4_W_MM;
    if (!pdf) pdf = new jsPDF({orientation:orient, unit:'mm', format:'a4'});
    else pdf.addPage('a4', orient);
    pdf.addImage(img.dataUrl, 'JPEG', 0,0, w, h);
  });
  pdf.save(base+'.pdf');
  toast('PDF exporté ('+images.length+' page'+(images.length>1?'s':'')+').');

document.getElementById('btnExportPPTX').addEventListener('click', async ()=>{
  closeAllPopovers();
  const base = await ensureDocName(); if (!base) return;
  const images = await captureAllPagesAsImages('image/png');
  const pptx = new window.PptxGenJS();
  // Le format du diaporama (calque) est fixé sur l'orientation de la page 1 ; les pages
  // suivantes, si elles ont une orientation différente, sont insérées à leur échelle
  // réelle, centrées, sans être déformées.
  const baseIsPortrait = images[0].orientation === 'portrait';
  const layoutW = baseIsPortrait ? (A4_W_MM/25.4) : (A4_H_MM/25.4);
  const layoutH = baseIsPortrait ? (A4_H_MM/25.4) : (A4_W_MM/25.4);
  pptx.defineLayout({name:'A4', width:layoutW, height:layoutH});
  pptx.layout = 'A4';
  images.forEach(img=>{
    const slide = pptx.addSlide();
    const imgIsPortrait = img.orientation === 'portrait';
    const pageW = imgIsPortrait ? (A4_W_MM/25.4) : (A4_H_MM/25.4);
    const pageH = imgIsPortrait ? (A4_H_MM/25.4) : (A4_W_MM/25.4);
    const scale = Math.min(layoutW/pageW, layoutH/pageH, 1);
    const w = pageW*scale, h = pageH*scale;
    slide.addImage({data:img.dataUrl, x:(layoutW-w)/2, y:(layoutH-h)/2, w, h});
  });
  pptx.writeFile({fileName:base+'.pptx'});
  toast('PPTX exporté ('+images.length+' page'+(images.length>1?'s':'')+').');
});
function downloadDataURL(url, filename){
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
}

/* ---------------------------- Toast ---------------------------------------------- */
let toastTimer=null;
// Bulle flottante (v2.1-71) : contrairement à toast(), elle reste jusqu'à hideBubble().
function showBubble(msg, onTap){
  const el = document.getElementById('bubble');
  el.textContent = msg;
  // Calée juste sous la barre de tuiles (v2.1-72), dont la hauteur varie selon l'appareil.
  const bar = document.getElementById('mobileTileBar');
  if (bar){ const r = bar.getBoundingClientRect(); if (r.height) el.style.top = Math.round(r.bottom + 6)+'px'; }
  el._onTap = onTap || null;
  el.classList.toggle('tappable', !!onTap); // v2.1-73 : bulle cliquable (ex. mise à jour)
  el.classList.add('show');
}
// Bulle orange qui disparaît seule (v2.1-77) ; ne masque pas un autre message affiché entre-temps.
let timedBubbleTimer = null;
function showTimedBubble(msg, ms){
  showBubble(msg);
  clearTimeout(timedBubbleTimer);
  timedBubbleTimer = setTimeout(()=>{
    if (document.getElementById('bubble').textContent === msg) hideBubble();
  }, ms || 2500);
}
function hideBubble(){
  document.getElementById('bubble').classList.remove('show');
  if (updateReady) showUpdateBubble(); // la proposition de mise à jour revient après un autre message
}
document.getElementById('bubble').addEventListener('click', (e)=>{
  const f = e.currentTarget._onTap; if (f) f();
});

/* ---------------------------- Nouvelle version disponible (v2.1-73) ---------------------- */
const APP_VERSION_RE = /<title>[^<]*?(v\d+\.\d+-\d+)/;
function showUpdateBubble(){ showBubble('Nouvelle version disponible — touchez ici pour la charger', applyUpdate); }
async function applyUpdate(){
  // Rien ne doit être perdu : on force la sauvegarde avant de recharger, et on renonce si elle échoue.
  clearTimeout(autoSaveTimer);
  await doAutoSave();
  if (autoSaveDirty){ toast('Sauvegarde impossible : exportez le .json avant de recharger.'); return; }
  location.reload();
}
async function checkForUpdate(){
  if (updateReady || !/^https?:$/.test(location.protocol) || !navigator.onLine) return;
  try{
    const res = await fetch('./index.html', { cache:'no-store' });
    if (!res.ok) return;
    const txt = await res.text();
    const mine = (document.title.match(/v\d+\.\d+-\d+/)||[])[0];
    const last = (txt.match(APP_VERSION_RE)||[])[1];
    if (mine && last && mine !== last){ updateReady = true; showUpdateBubble(); }
  } catch(e){ /* pas de réseau : on réessaiera plus tard */ }
}
setTimeout(checkForUpdate, 10000);
setInterval(checkForUpdate, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') checkForUpdate(); });
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------------------------- Initialisation ------------------------------------- */
document.body.classList.add('mobile-mode'); // mode smartphone (bandeau en tuiles) permanent, mode PC retiré
// Ajoute un texte sous chaque icône des tiroirs (Page, Vue, Historique, Plan, Pastille,
// Texte) — jusqu'ici seule l'info-bulle (title) l'indiquait, invisible tant qu'on n'appuie
// pas longuement dessus. On réutilise directement le texte déjà présent dans chaque title
// plutôt que de le ressaisir à la main pour chaque bouton (et de risquer un oubli/une
// incohérence) ; la partie entre parenthèses (détail secondaire) est retirée pour garder
// un libellé court et lisible sous une icône (ex. "Ajouter un étage (choix de la page à
// recopier)" devient juste "Ajouter un étage").
// v2.1-92 : libellés COURTS (une seule ligne sous l'icône) ; l'infobulle (title) garde le texte complet.
const SHORT_ICON_LABELS = {
  'Page précédente':'Précédente','Page suivante':'Suivante','Ajouter un étage':'+ Étage',
  'Déplacer cette page vers la gauche':'Page ←','Déplacer cette page vers la droite':'Page →',
  'Supprimer la page courante':'Suppr. page','Nouveau projet':'Nouveau',
  'Orientation portrait':'Portrait','Orientation paysage':'Paysage','Zoom arrière':'Zoom −','Zoom avant':'Zoom +',
  "Ajuster à l'écran":'Ajuster','Enregistrer le projet':'Enregistrer','Ouvrir un projet':'Ouvrir',
  'Importer un plan':'Importer','Découpe rectangulaire':'Découpe □','Découpe point par point':'Découpe pts',
  'Outils image : pipette, pot de peinture, gomme, réglages':'Outils image','Pot de peinture intelligent':'Pot peinture',
  'Gomme carrée':'Gomme','Placement classique':'Classique','Placement déporté':'Déporté',
  'Ajouter / retirer un poste':'Postes','Ajouter un texte':'Texte','Logo entreprise':'Logo Cie','Insérer/retirer la légende':'Légende'
};
function addIconLabels(){
  document.querySelectorAll('.tb-group .tb-icon').forEach(btn=>{
    if (btn.querySelector('.tb-icon-label')) return; // déjà fait, ne pas dupliquer
    const title = btn.getAttribute('title');
    if (!title) return;
    const full = title.split(' (')[0];
    const label = SHORT_ICON_LABELS[full] || full;
    const span = document.createElement('span');
    span.className = 'tb-icon-label';
    span.textContent = label;
    btn.appendChild(span);
  });
}
addIconLabels();
updatePlanLockButton();
// v2.1-90 : état de la grille d'accroche écrit sous l'icône (comme le cadenas du plan).
function updateGridButton(){
  const btn = document.getElementById('btnGrid');
  const txt = gridVisible ? "Grille d'accroche activée" : "Grille d'accroche désactivée";
  const short = gridVisible ? 'Grille ON' : 'Grille OFF'; // une seule ligne (v2.1-92)
  const lbl = btn.querySelector('.tb-icon-label');
  if (lbl && lbl.textContent !== short) lbl.textContent = short;
  btn.title = txt;
}
updateGridButton();
// Un seul écouteur "resize" (regroupé sur requestAnimationFrame), au lieu de 4 séparés :
// évite de refaire 4 fois le travail de mise en page à chaque frame d'un redimensionnement
// continu (rotation d'écran, ouverture du clavier virtuel, redimensionnement de fenêtre…).
let resizeRAF = null;
window.addEventListener('resize', ()=>{
  if (resizeRAF) return;
  resizeRAF = requestAnimationFrame(()=>{
    resizeRAF = null;
    // Sur mobile, ouvrir le clavier virtuel déclenche aussi un "resize" (la fenêtre visible
    // rétrécit) : si on est en train de saisir du texte, ce n'est pas une rotation d'écran,
    // et fermer les popovers à cet instant précis fermait le formulaire sous les yeux de
    // l'utilisateur dès qu'il touchait un champ pour y taper. On ne ferme donc les popovers
    // que si le focus n'est pas dans un champ de saisie.
    const typing = document.activeElement && (document.activeElement.tagName==='INPUT' || document.activeElement.tagName==='TEXTAREA');
    if (!typing) closeAllPopovers();
    layoutHeader(); // met aussi à jour les bandes de défilement
    // Sur mobile, ouvrir le CLAVIER VIRTUEL (ex. pour taper un renommage) déclenche aussi
    // cet événement "resize" (la fenêtre visible rétrécit) : ce n'est pas une vraie rotation
    // d'écran ni un redimensionnement de fenêtre, donc pas une raison de réinitialiser le
    // zoom — c'était très gênant en pratique (le zoom retombait dès qu'on touchait un champ
    // de saisie, ex. pour renommer une pastille).
    if (!typing) fitZoom();
  });
});
layoutHeader();
// Ajoute les nouveaux postes "par défaut" (souris/rat) aux documents déjà existants qui ont
// été créés avant leur introduction (sauvegarde automatique restaurée, projet .json ouvert
// depuis un ancien fichier) : sans cela, ils n'apparaissent que dans un tout nouveau projet.
// Convertit l'ancien format à un seul plan par page ("plan": {...} ou null) vers le
// nouveau format à plusieurs plans ("plans": [...]) — nécessaire pour ouvrir sans perte
// un document sauvegardé (autosave ou fichier .json) avant l'introduction des plans
// multiples par page.
function migratePlanFormat(pg){
  if (pg.plans) return;
  pg.plans = pg.plan ? [{...pg.plan, id: pg.plan.id || nextId('plan-')}] : [];
  delete pg.plan;
}
function ensureDefaultDeviceTypes(){
  // Appelée à chaque rendu (donc très souvent) : on ne vérifie que la page AFFICHÉE plutôt
  // que de reboucler sur toutes les pages à chaque fois. Chaque page reçoit de toute façon
  // cette vérification dès qu'on l'affiche (switchToPage -> render()).
  const defaults = [
    { id: 'type-souris', code: 'MU', name: 'Poste rongeur souris', color: '#E31C1C', shape: 'circle', noNumber: true, defaultRadius: 10 },
    { id: 'type-rat', code: 'RA', name: 'Poste rongeurs rat', color: '#E31C1C', shape: 'circle', noNumber: true, defaultRadius: 20 },
  ];
  defaults.forEach(d=>{
    if (!model.deviceTypes.some(t=>t.id===d.id)) model.deviceTypes.push({...d});
  });
}
(async function initApp(){
  // Le canevas dessine avec la police du moment : si IBM Plex Sans n'est pas encore chargée
  // au premier rendu, tout s'afficherait avec une police de secours (et les étiquettes des
  // pastilles, mises en cache, la garderaient). On attend donc son chargement — au maximum
  // 2,5 s, pour ne jamais bloquer l'ouverture hors connexion (police alors indisponible).
  try{
    if (document.fonts && document.fonts.load){
      await Promise.race([
        Promise.all([document.fonts.load("400 16px 'IBM Plex Sans'"), document.fonts.load("700 16px 'IBM Plex Sans'")]),
        new Promise(r=>setTimeout(r, 2500))
      ]);
    }
  } catch(err){ /* sans conséquence : rendu avec la police de secours */ }
  const saved = await idbLoad();
  if (saved && Array.isArray(saved.pages) && saved.pages.length){
    pages = saved.pages;
    pages.forEach(migratePlanFormat);
    currentPageIndex = Math.min(saved.currentPageIndex||0, pages.length-1);
    docName = saved.docName || null;
    model = pages[currentPageIndex];
    idCounter = 100000; // évite toute collision d'ID avec la session restaurée
    ensureDefaultDeviceTypes();
    await rehydratePlanCanvas();
    const t = saved.savedAt ? new Date(saved.savedAt) : null;
    setAutoSaveIndicator('Sauvegardé à '+(t? t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—'), false);
    toast('Session précédente restaurée automatiquement.');
  } else {
    await autoInsertCompanyLogo(); // logo entreprise déjà présent dès l'ouverture de l'application (page 1)
    await autoInsertClientLogoPlaceholder(); // idem pour le placeholder "logo Cie", en haut à droite
  }
  history = [cloneDoc()]; historyIndex = 0;
  ensureDefaultTool(); // à l'ouverture : "Placement classique" déjà sélectionné (avant les mises à jour de boutons : setTool réinitialise leur surbrillance)
  updateOrientButtons();
  updateHistoryButtons();
  updatePageIndicator();
  document.getElementById('toolToggleLegend').classList.toggle('active', model.legend.visible);
  updateMobileTileActiveState();
  fitZoom();
  render();
  scheduleAutoSave();
})();
// Mode hors ligne + mise à jour automatique (v2.1-66) : le "service worker" (fichier sw.js)
// garde l'application en mémoire pour qu'elle s'ouvre sans réseau, et redemande à chaque
// lancement (si le réseau est là) la dernière version publiée. Inactif quand on ouvre le
// fichier directement depuis le PC (adresse file://) : il faut une adresse https.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Mode hors ligne indisponible :', err));
  });
}
